name: Assemble World Lab release
on:
  push:
    branches: [publish-six-cities-20260925]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify exact release bytes
        shell: bash
        run: |
          set -euo pipefail
          cat .publish_parts/part_* > /tmp/index.html
          echo "60500ea0723aad1310769728c3f6167e44d3a83d8277b01f201c06bc4858c2b8  /tmp/index.html" | sha256sum -c -
          test "$(wc -c < /tmp/index.html)" -eq 6977815
      - name: Create clean release commit from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          cp /tmp/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish World Lab with Six Cities"
          git push --force origin HEAD:refs/heads/world-lab-assembled
