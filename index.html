e matter court; LINK CITY is sparse and vertical with multiple network berths. These are visual/mechanical propositions, not replacements for TURRET, THUMPER, DRONE FACTORY, LINK NODE or other canonical payloads.\n\nBIOME PROVENANCE: terrain surface triangles are colored from a persistent world-space biome field (forest/desert/mountain/wetland). Decoration may later be disposable, but provenance is substrate truth. Extruder-produced ordinary matter inherits biome identity and renders with corresponding color while retaining ordinary bearing physics. This is intentionally a small semantic addition, not a resource/crafting taxonomy.\n\nSCALE: footprint remains comparable to existing large payloads; semantic scale increases drastically. Tiny boxes are architectural greeble implying districts/buildings. A moving component can therefore imply a moving district-scale machine. Creeps may now be read as kaiju-scale organisms without changing their existing behavior.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-inheritance-pass-1\"\u003e\n3D \u00b7 WORKS \u2014 INHERITANCE PASS 1 / QUIET ENTRY STATE\n\nThis distribution build changes presentation defaults, not WORKS mechanics. It opens WORKS on the canonical\nflat signed-density surface with water hidden, the E6 wonder field hidden, and the E8 city-machine morphology\nfield hidden. Canonical payloads, probes, terrain tools, water, wonders, cities, biome provenance, and their\nimplementation remain present and recoverable through the existing controls.\n\nThe purpose is a low-noise first encounter for an inheriting player on a phone. No accessibility interaction\nredesign is claimed yet; observed use should provide evidence before changing the UI or control grammar.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-e4-terrain-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E4.1 / TERRAIN SHUFFLE\n\nE4.0 established that repeated local density accretion reads as fast geology rather than life, while\nforcing expensive recurring terrain rebuilds. Continuous growth probes were removed rather than optimized.\n\nWORKS now starts on the canonical flat signed-density table. RESET WORKS restores that flat T0.\n\nSHUFFLE TERRAIN is deliberately discontinuous: one press synthesizes a new varied height field directly\ninto the authoritative signed-density volume, then performs exactly one normal terrain rebuild. Broad\nnoise, finer variation, directional ridges, a basin/highland term, and an isolated mass are randomized\ntogether so repeated presses explore substantially different terrain rather than recoloring one recipe.\n\nThe terrain rewrite uses the same world substrate and rebuild path as all other terrain truth. Therefore\nthe final rendered mesh again authors the retained bearing/drone support field. This is terrain generation,\nnot terrain simulation; there is no ongoing terrain CPU/remesh cost after the button press.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-e4-sea-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E4.3 / EDGE OF WORLD\n\nE4.2 proved that a closed translucent sea volume makes randomized negative relief read immediately as\nbounded geography. Inspection exposed z-fighting not at shorelines but at two apparatus coincidences:\nthe water floor shared the plinth-top plane, and the water side walls shared the terrain cut-wall planes.\n\nE4.3 resolves those relationships geometrically rather than with renderer bias. Terrain retains its inset\nWORKS_MATERIAL_APOTHEM boundary. Water now fills outward to WORKS_APPARATUS_APOTHEM, the containing plinth\nedge. Its bottom penetrates the apparatus top by 0.32 world units. Water and terrain therefore no longer\nown coincident boundary faces, and the water floor no longer terminates coplanar with the plinth top.\n\nThe visual relationship is now intentional:\n  terrain/material world \u003c water vessel \u003c apparatus boundary.\nThe sea reaches the literal edge of the represented world while terrain can expose its cut section inside it.\n\nBOUNDED-WORLD DISCOVERY\nThe octagon has earned a useful interpretation without becoming mandatory world ontology: it can contain a\ncoherent piece of world at whatever local scale that piece requires. Continuity need not mean one continuous\nterrain substrate. Separate bounded locations may preserve their own scale and truth while traversal between\nthem is expressed by whatever transport belongs to the experience: portals, ferries, doors, vehicles, dreams,\nor other mechanisms. This is an architectural possibility, not a portal framework or a requirement that every\nlab use bounded geography.\n\nWater remains presentation only: no buoyancy, currents, waves, shoreline logic, underwater state, or machine\nbehavior. RESET WORKS restores flat terrain; SHUFFLE TERRAIN performs one terrain rewrite/rebuild.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-e4-meteor-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E4.4 / METEOR COST CLEANUP\n\nMeteors are rare manual tools today but may later become actor-driven orbital bombardment, so their cost should\nscale with event count rather than legacy presentation object count.\n\nInspection found the flight simulation itself cheap: one head, one line trail, interpolation, and one apparatus\nsegment test per meteor. Local crater mutation was already bounded. The legitimate expensive event remains the\nsingle authoritative terrain rebuild at impact.\n\nThe old impact presentation, however, created 34 individual heat meshes, a point light, and 18 more individually\nallocated ember/dust meshes per impact. E4.4 replaces that with two small InstancedMesh batches: one crater heat\nbatch and one rising-mote batch. The point light is removed. Crater/rim deformation, granular impulse, trajectory,\nand impact semantics are unchanged.\n\nThe sea also drops MeshPhysicalMaterial transmission/thickness in favor of a translucent MeshStandardMaterial.\nThe bounded-water read already comes from geometry, opacity, lighting, and terrain occlusion; physical transmission\nwas unnecessary GPU work, especially when bright meteor fragments were composited through it.\n\nThis pass optimizes presentation rather than changing meteor authority. If future actors call sustained orbital\nbombardment, the next evidence should come from actual concurrent-meteor profiling before introducing a larger\nprojectile/FX framework.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-e4-meteor-bombardment-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E4.6 / METEOR / METEORS\n\nE4.5 incorrectly made the control itself fire a bombardment and exposed an older sculpt-dispatch bug:\nsculpt() attempted terrainDeformation[kind] even though terrain edits are owned by terrainDeformation.edit().\nE4.6 repairs that boundary and ignores non-sculpt semantic modes defensively.\n\nThe sky tool now behaves as an armed binary choice while preserving the meteor icon:\n  first control tap -\u003e \u2604 METEOR (armed; no strike yet)\n  second control tap -\u003e \u2604 METEORS\n  subsequent taps -\u003e alternate METEOR / METEORS.\nLOOK or another mutually exclusive tool disarms it.\n\nCasting happens by tapping terrain. METEOR calls one full-strength strike at the tapped locus.\nMETEORS calls ten strikes over roughly three seconds with irregular intervals and a small radial aim wander\naround that same tapped locus. The salvo is not map-wide random bombardment.\n\nBombardment meteors carry impact power 0.1. Their crater/rim signed-density mutation is one tenth strength,\nso ten strikes have approximately the terrain-deformation budget of one ordinary meteor while retaining ten\nseparate trajectories, impacts, granular impulses, and visible consequences. This is deliberately not an\norbital-weapons framework; it remains a finite callable world event suitable for later actor invocation.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-e4-fps-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E4.7 / VISIBLE FRAME COST\n\nThe decorative bottom note had stopped carrying useful information. It is replaced by a persistent FPS / average\nframe-time readout so performance suspicions can become device evidence while ordinary play continues.\n\nThe meter counts animation frames over a 250 ms window and updates the DOM only at the end of that window. It does\nnot instrument subsystems or attempt GPU timing. The existing meteor profiler remains responsible for impact-phase\nCPU timings. Together they answer different questions: the profiler exposes where an impact spends synchronous CPU\ntime; FPS exposes whether the complete rendered ecology is actually missing frames on the current device.\n\nNo meteor behavior is changed in this pass. E4.6 remains the current meteor semantics until actor-driven bombardment\ncreates evidence worth revisiting.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-e4-meteor-occlusion-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E4.9 / IMPACT OCCLUSION\n\nE4.8 briefly tested a fading copy of the old terrain mesh after deformation. It was not harmful, but it was judged\nunnecessary and is not present here. The terrain again changes appearance exactly when its authoritative rebuild occurs.\n\nThe more useful perceptual problem is the meteor's missing impact interval: a bright tracked object reached terrain,\nvanished, and immediately exposed the rebuilt crater. E4.9 adds temporary dirty occlusion instead of animating terrain.\n\nEach impact now erupts nine coarse low-poly smoke/dust puffs from the contact locus. They grow quickly into a dense,\nopaque-ish dirty burst, spread and rise asymmetrically, then loosen and disappear over about one second. The geometry\nis one instanced icosahedron batch and one material per impact. It is intentionally noisy at miniature scale rather\nthan volumetric, physically simulated, or composed from hundreds of particles.\n\nThe crater remains authoritative immediately. Smoke owns no collision, deformation, or simulation truth. Its job is\ncausal presentation: meteor -\u003e obscured violent interval -\u003e revealed consequence. This tests whether the apparent\n'hitch' was partly the eye being asked to witness an instantaneous topology change with no intervening event.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-e5-weather-deactivated-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E5.0.2 / PROCEDURAL WEATHER DEACTIVATED\n\nE5.0 tested a persistent shifting cloud layer by reusing the coarse low-poly particulate language discovered in the\nmeteor impact occlusion. The implementation worked after a narrow E5.0.1 initialization-order repair, but the cloud\nlayer did not meet the material/readability bar for persistent world weather.\n\nThe persistent cloud implementation is removed from the active artifact rather than retained as machinery. The useful\nevidence remains: E4.9's temporary impact cloud can read well because it is local, causal, brief, and allowed to be\ncoarse. That does not imply the same geometry/material grammar reads beautifully as distant atmospheric cloud cover.\n\nProcedural weather is intentionally deferred. When revisited, begin from the perceptual/material question\u2014what makes\ncloud, haze, rain, snow, storm mass, or atmospheric depth read beautifully at miniature scale\u2014rather than assuming a\nparticle vocabulary or promoting the impact-cloud implementation.\n\nE4.9 meteor impact occlusion remains active as one successful local use of the coarse particulate mechanism.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-e5-item-pipe-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E5.2 / ITEM PIPE\n\nWeather probes are inactive. PIPE END is an active orbital payload. Two landed ends automatically pair in landing\norder: first is intake, second is output. Repeated structural rings frame the route; there is no glass tube.\n\nThe pipe transports the same authoritative discrete bearings already used by WORKS, not inventory counters or\ncosmetic beads. Ordinary bearings and BIOBALLS may therefore share one stream while retaining provenance. Nearby\nunclaimed matter is claimed at the intake, the same physical bearing is constrained along the route, then released\nback into world physics at the output.\n\nThe route consumes the same mesh-authored conservative support field used by bearings and Drone Factory terrain\nnegotiation. Samples along the direct route, plus short look-ahead/look-behind samples, lift the conduit above visible\nterrain. The path periodically rebuilds after deployment, so later terrain changes are negotiated rather than clipped.\n\nEndpoint removal tears down the conduit and spills claimed contents back into world physics. This is intentionally\nnot yet a sorter, branching network, inventory system, recipe graph, or generalized logistics ontology.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"works-e5-death-fx-fix-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E5.2.1 / CREATURE DEATH FX REPAIR\n\nObserved failure: a turret killed a FLOATER EGG and the render loop stopped in updateMeteorFx with\n\"Cannot read properties of undefined (reading 'y')\".\n\nThis was not caused by pipe placement or pipe transport. Creature death creates a stationary heatLight impact-FX\nrecord with no velocity vector. updateMeteorFx handled swordLight explicitly but allowed heatLight to fall through\nto the generic moving-particle branch, which assumes f.v exists and dereferences f.v.y. The bug was latent in the\nshared impact-FX dispatcher and can affect CRAWLER, JUMPER, or FLOATER death effects.\n\nRepair is deliberately narrow: heatLight now has its own stationary intensity-fade branch. No pipe behavior,\ncreature durability, bearing burst, meteor behavior, or other FX semantics changed. Visible diagnostics again\nexposed an ownership/type-dispatch mismatch rather than a pipe failure.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"world-lab-handoff\"\u003e\nWORLD LAB V0.1 \u2014 RESILIENT CORE / CAPACITY PASS\n================================================\nTHIS PASS OPTIMIZES CAPACITY, NOT METEOR OR SWORD FIDELITY.\nThe laboratory is infrastructure for many grammars. Current meteor/sword implementations are specimens, not privileged architecture.\n\nGRAPHICS FAILURE FINDING\nThe Android/Chrome sad-face WebGL icon means the browser lost the WebGL context; it is not a Three.js UI element. JS error handlers alone cannot catch this class of failure.\n\nV0.1 CHANGES\n- WebGL context loss/restoration is explicitly observed. On loss the animation loop stops and world state remains in CPU memory. On browser restoration, terrain buffers/textures are marked dirty and rendering resumes.\n- RECOVER can rebuild the Three.js renderer after recoverable renderer-loop trouble without resetting world state.\n- Terrain now owns one retained BufferGeometry. Frequent sculpt/remesh operations update reusable DynamicDrawUsage position/normal buffers instead of disposing and replacing a GPU geometry every stroke. Buffers grow geometrically only when required.\n- Terrain normals are generated while copying triangles into the retained buffer; computeVertexNormals no longer scans spare buffer capacity.\n- Baseline shadow maps are disabled. A 2048\u00b2 dynamic shadow map was expensive persistent GPU state that did not define the laboratory's semantics. Future shadows must earn their budget.\n- Device pixel ratio is capped at 1.15 for this mobile-first lab. Resolution is a budget, not world state.\n- RESET now disposes persistent sword geometry/materials instead of merely removing their groups.\n\nCAPACITY RULE\nPrefer retained/poolable resources for high-frequency systems. Persistent semantic objects may own persistent resources. Transient effects should share/pool geometry/material machinery and have bounded populations. Never allocate GPU resources at gesture frequency when an existing buffer can be updated.\n\nRECOVERY RULE\nCPU world state is authoritative. GPU resources are a reconstructible view of it. Context loss should pause presentation, preserve the world, and reconstruct presentation when possible.\n\nWORLD LAB \u2014 V0 SHARED SPATIAL LABORATORY\n========================================\n\nPURPOSE\nThis is the current common home for the user's little-world experiments. Do not treat Living Miniatures, Touch Probes, orbital interactions, terrain deformation, procedural actors, or future perspective experiments as unrelated projects by default. They are disposable/progressive manifestations of one evolving spatial-toy vocabulary.\n\nV0 QUESTION\nCan one persistent volumetric world remain pleasant to inspect and manipulate through multiple observer perspectives while retaining the terrain behaviors and event grammars already earned in earlier probes?\n\nWORLD / PERSPECTIVE / GRAMMAR\nWORLD = substance + discrete objects + processes + accumulated history.\nPERSPECTIVE = observer/camera/interaction lens onto that same world. Changing VIEW must never rebuild, reinterpret, or mutate world state.\nGRAMMAR = a bounded capability that acts on the world: carve, raise, smooth, meteor, embedded sword, and later rip/tether/fling/extrude/rigged actors.\n\nPORTABLE CRAFT KNOWLEDGE \u2014 DO NOT RELEARN\n- Known-good Three.js browser import: https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js\n- Three.js is renderer, not ontology.\n- Use visible pre-module window.error + unhandledrejection diagnostics; failures must not go silent.\n- Keep one authoritative runtime/world state. Avoid brittle shadow globals and dual ownership.\n- Scene-specific visual assets are generated/encoded in-artifact. Do not introduce external texture/model/image dependencies casually.\n- Terrain is substance. Geometry is only the current visible boundary. Positive signed density = solid; negative = empty.\n- True caves, tunnels, overhangs, craters, cuts and raised forms are topology of the same substance, not decorative meshes.\n- Camera transforms are observer transforms, not world transforms. Preserve world state across perspective changes.\n- Free inspection is valuable. God-eye panorama is a strong canonical scale, but close inspection is allowed and useful.\n- Detail can be authored above normal viewing resolution; perceptual collapse at miniature scale turns many small assertions into richness.\n- Greebling/appearance/process belong to the semantic object that gives them meaning; avoid a global decoration pass that knows every object type.\n- Directional effects should derive from explicit semantic direction/state, not incidental mesh orientation.\n- Persistent consequences belong to world state; transient FX clarify events and then die.\n- FX resource ownership must be explicit. Shared resources are not disposed by individual effects. Bound sustained transient populations on mobile.\n- Impact residue belongs to the resulting cavity/state, not stale pre-impact surface coordinates. Depth-test it so topology occludes it.\n- A probe is not allowed to redefine the thing it is probing. Promote lessons carefully; preserve local failures as evidence rather than universal law.\n\nPRESERVED DISCOVERIES / ARCHAEOLOGY\nT0.4 STATIC PAINTERLY PROBE: pulled-back miniature scale + dense object-owned geometric evidence produced a dramatic improvement even without fog. Distance is a visual budget, not a prohibition on zoom.\nT0.5 ABYSS: real topology mattered; ecology had to respect cuts; shared boundaries beat independently approximated seams; continuous wall/skirt beat spaghetti terraces.\nT0.7 DEFORMABLE SUBSTANCE: coarse signed-density field + synchronous remesh was fast and responsive on the target phone. This is the foundation used here.\nT0.8.2 METEOR RESIDUE: tiny impacts became fading Dark-Souls-like bonfires when heat/embers lived volumetrically inside the wound.\nT0.8.4.1 FX HARDENING: explicit resource ownership, shared transient geometry and bounded populations survived sustained meteor/sword abuse.\nT0.9\u2013T0.11 SEMANTIC CARVING: noun-to-shape compilation failed; iterative affordance evaluation was richer, but scalar metrics reward-hacked themselves. This branch is preserved knowledge, not the current focus.\nTOUCH T0.1: stable world substance + touch-defined topology + liberated debris + ballistic deposited material was a powerful cheap 2D interaction sketchpad.\nTOUCH SKYHOOK: touch should establish physical relationships between hand and world rather than merely map gestures to UI commands. Successful cheap touch grammars are candidates for promotion here; the brown 2D substrate is not a replacement world architecture.\n\nCURRENT WORLD\nThe current world is intentionally modest: one seeded volumetric landmass rendered from a 30\u00d722\u00d730 signed-density field. It is not the final visual target and not a claim that all future worlds share this resolution or geology.\n\nCURRENT OWNERSHIP MODEL\nWORLD SUBSTRATE owns authoritative terrain/material truth and its deformation realization.\nWORLD SYSTEMS own cross-entity rules such as gravity/support evaluation.\nENTITY CAPABILITIES carry reusable live data such as GravityBody, spatial input/output ports, and semantic local forward. Directional entities author local +Z as forward; behaviors express intent against that entity-level convention rather than inventing mesh-specific signs.\nPAYLOAD BEHAVIORS own machine-specific state and continuous meaning: scan, fire, chew, thump, crawl.\nPRESENTATION may visualize causality (link pulses, sparks, glow) without claiming additional physical simulation.\nPromote machinery only when repeated world evidence makes ownership cross-cutting; capability is not authority.\n\nCURRENT PERSPECTIVES\nVIEW cycles PANORAMA / MINIATURE / CLOSE. They are convenience presets over one camera/world, not separate scenes. LOOK then allows free orbit; two fingers pan/pinch and wheel zoom remains available. Future situated/character perspectives should obey the same invariant: perspective does not redefine world state.\n\nCURRENT TERRAIN OWNERSHIP + VERBS\nThe signed-density terrain substrate owns deformation. Callers request physical changes through terrainDeformation; callers do not own field mutation, remeshing, cache invalidation, or support consequences.\nRAISE adds substance. CARVE subtracts substance. SMOOTH relaxes local density. SURFACE CARVE expresses physical intent from a sampled surface inward and is converted by terrain into a lattice mutation deep enough to cross the visible isosurface reliably.\nHuman sculpting, Extruder bites, meteor craters and payload destruction all enter through this terrain-owned boundary while retaining their own cause-specific shapes/behavior. ONE TERRAIN BITE is currently the shared surface-carve scale used by Extruder chew and Crawler death.\nMETEOR is a persistent mutually exclusive sky-rain grammar that excavates the same field and leaves bounded volumetric fading residue.\nSWORDS is a sibling sky-rain grammar whose blades embed persistently while fire/ember/smoke residue remains ephemeral.\nRESET restores the canonical WORKS T0 octagonal planar field and clears event artifacts. VIEW changes only observation.\n\nTOUCH / INTERACTION THESIS\nDo not start by inventing gestures. Invent physical relationships between hand and world. Cheap probes established useful candidate verbs: RIP, SPRAY, DROP, FLING, TETHER/PULL, JOIN, EXTRUDE/CHANNEL. These are interaction grammars, not a mandatory final control scheme.\nBefore inventing an in-world machine, ask whether the player's hand can simply be that machine.\n\nNEXT RICH AREA\nProcedural articulation: simple rigs with root/body/limb chains/joints/end effectors; behaviors target constraints rather than canned animation names. Deformable worlds especially reward procedural bodies because authored animation assumes authored geometry. A tiny multi-legged actor that genuinely seeks footholds on deformed terrain is a good bounded proof. Do not build a universal character system first.\n\nHANDOFF MAINTENANCE RULE\nThis embedded semantic layer is part of the artifact, not cleanup documentation. Update it whenever implementation changes architecture, ownership, interaction meaning, portable craft knowledge, or an important experimental lesson. Keep portable knowledge distinct from probe-local observations. A fresh model receiving only the latest World Lab artifact should not need to rediscover imports, boot/diagnostic discipline, terrain ontology, camera semantics, or already-paid-for behavior lessons before continuing.\n\u003c/script\u003e\u003cscript type=\"text/plain\" id=\"test-chamber-current-semantics\"\u003e\n3D TEST CHAMBER \u2014 T1 GRANULAR / CAUSAL FLOW\n\nT1.1 \u2014 COLLAPSIBLE LAB CONTROLS\nThe chamber control surface starts open but is now owned by one persistent TEST CHAMBER binary toggle. Collapsing it removes the experiment controls from the world view without changing simulation state, active interaction mode, or any world state. This is lab-local UI; the World Lab host remains ignorant of chamber controls.\n\nT1.2 \u2014 OBSERVER / EMITTER MANIPULATION\nThe chamber now separates three observer/manipulation verbs: LOOK orbits freely, DRAG CAMERA pans the observer target, and two-finger pinch continues to zoom while translating the camera target with the pinch centroid. MOVE EMITTERS directly drags either physical ball emitter across a horizontal world plane; emission originates from the emitter\u2019s live transform rather than hard-coded coordinates. Moving Source B also updates the visible A\u2192B causal link. These are observer and infrastructure manipulations only: moving the camera never mutates world state, while moving an emitter explicitly does.\n\n\nThe chamber is an independent lab. It inherits no runtime dependency from 3D VOLUMETRIC, though this first pass deliberately retained its signed-density terrain, direct deformation, camera, meteor/sword grammar, and graphics diagnostics as earned evidence.\n\nThe active question is whether visible matter/population flow remains intrinsically satisfying when the human manipulates causes rather than puppeteering outcomes. Two physical bearing streams are coupled by a collector/link/emitter chain. The link is visible and severable. A physical gate can interrupt flow. Terrain deformation changes routes. Meteors deform terrain and impart impulse to granular matter. Twenty deliberately cheap walkers share the changing terrain but pursue their own deterministic destination pressure.\n\nGranular representation is intentionally hybrid and approximate. Balls have independent position/velocity state and are rendered with instancing; high population registers reduce rendered sampling. Collision uses a cached top-surface query derived from the authoritative volumetric field, plus a cheap occupancy pile term. This means caves/overhangs are not yet full granular collision volumes and ball-ball collision is not rigid-body exact. Those are explicit compromises in service of testing causal legibility at 1K\u2192100K scale.\n\nPopulation ladder is evidence, not a score. The useful result is the largest regime where flow, interruption, rerouting and intervention remain legible and tactile.\n\nThe external first-pass specification that caused this implementation is embedded verbatim in #test-chamber-first-pass-spec so future workers can distinguish intended experiment from implementation evidence.\n\n\nT2 \u2014 CLEAN MATERIALS YARD / PRE-BUILD INTENT + IMPLEMENTATION ARCHAEOLOGY\nThe preceding T1 chamber produced unexpected evidence worth protecting: 100k bearings remained smooth; settled piles were metastable; carving a retaining lip produced slow gravity-accelerated streams; carving support from beneath a dense pile caused the population to resume falling together; meteor impulse composed temporally, with repeated impacts accelerating already-moving matter.\n\nT2 intentionally removes emitters, collectors, links, gates, swords and lemmings from the default chamber. It is a clean materials-testing yard: broad flat deformable floor, deformable perimeter containment, shallow/medium/steep grades, and a flat vertical terrain wall. No matter exists until explicitly spawned. SPAWN BALLS places the selected atomic bucket at the tapped terrain point. Buckets deliberately extend from 100 through 1M so device/perceptual limits can be discovered rather than assumed. BEARINGS constants remain the T1 baseline. Large populations retain authoritative CPU particle state while rendering is progressively sampled above the previously proven range.\n\nThe perimeter is made from the same signed-density terrain as the floor and test forms. It is not an invisible collision fence; breaching it is a legitimate experiment. Terrain brushes now have SMALL/MED/HUGE radius registers. LOOK, DRAG CAMERA, pinch zoom/pan, gravity registers, METEOR, visible diagnostics, context recovery, and the collapsible lab-local menu remain.\n\n\nT2.1 \u2014 LOCAL GRAVITY BALL\n\n\nT2.2 \u2014 LOCUS NAVIGATION / MOBILE BATTLE-ROOM CAMERA\nThe chamber became spatially interesting enough that observer manipulation itself required a semantic upgrade. FOCUS LOCUS is a mobile-first navigation verb: tapping an addressable node (currently the gravity ball) or any terrain point establishes the observer working locus and smoothly retargets the camera without moving world state. LOOK continues to orbit freely around the current locus; DRAG CAMERA continues to translate it; pinch continues to zoom and pan. FRAME LOCUS restores a useful inspection distance around the current locus without resetting world orientation. The gravity ball is the first world node participating in this grammar; future pylons and other deliberate nodes should become loci rather than inventing separate camera affordances. Empty terrain can create a temporary WORK locus, so observation does not require an object to already exist there. Principle: the world owns coordinates; the observer owns a current locus.\nA persistent visible gravity ball now occupies the center of the materials yard and can be toggled independently of global gravity. It is a softened local attractor acting directly on existing bearing velocity state, so its force composes with meteors and global gravity rather than triggering a canned orbit behavior. Its peak acceleration is deliberately below EARTH gravity: it should perturb and gather against 1g without defeating it, pull substantially against LOW gravity, and dominate MICRO gravity. This is a causal-field probe, not yet an energy-gate or pylon system.\n\nDEFERRED / DO NOT FORGET\nThe human explicitly wants a later construction grammar where pylons can be slammed into the terrain and energy gates formed between them. Do not smuggle that into this clean matter pass. Preserve it as a next experiment candidate.\n\u003c/script\u003e\n\n\u003cscript type=\"text/plain\" id=\"works-current-semantics\"\u003e\n3D \u00b7 WORKS \u2014 E3.4.1 / CONTACT GRANTS DESCENT\n\nTerrain clearance and terrain interaction are distinct constraints. During ordinary travel, drones remain\nabove the support-field flight envelope. Only during the final approach to their already-claimed bioball\ndoes that target gain permission to pull the drone below normal clearance. The hard terrain floor remains:\ncontact permission is not permission to penetrate the world.\n\nThis is task-local authority, not a general navigation mode. The failure that exposed it was useful:\nterrain-safe flight had made pickup impossible by leaving drones hovering above their own targets.\n\n3D \u00b7 WORKS \u2014 E3.4 / DRONES READ TERRAIN\n\nDrone flight now consumes the mesh-authored bearing support field rather than treating the world as empty\n3D space. A drone samples a few points ahead along its intended travel, raises its desired flight envelope\nabove the highest sampled terrain, and has finite climb/descent authority. A final support-field constraint\nprevents momentum from carrying it through newly risen ground.\n\nThis is deliberately not navigation or optimal pathfinding. Drones still pursue the same direct targets;\ntheir bodies now have to negotiate the terrain between here and there. The support field earned a second\nconsumer without becoming a generalized navigation framework.\n\n3D \u00b7 WORKS \u2014 E3.3.1 / BIOBALLS BECOME PERCEPTIBLE\n\nBIOBALL provenance is now visible at miniature scale as a muted lime-green instance color. Ordinary\nbearings retain their existing pale metallic appearance. This is presentation of an already-earned\nsemantic distinction, not a new resource rule: color does not alter physics, claims, collision, or logistics.\n\n3D \u00b7 WORKS \u2014 E3.3 / BIOBALLS\n\nThe Drone Factory no longer treats every spherical piece of matter as equivalent work. Bearings now\ncarry one minimal provenance bit. Ordinary spawned bearings, Extruder output, and turret ammunition\nremain ordinary bearings. Bearings released by Crawler, Jumper, and Floater deaths are BIOBALLS.\n\nDrone Factory claims only BIOBALLS. This is not a generalized resource taxonomy: the physical simulation,\nrendering, terrain collision, carrying, and deposit behavior remain exactly the same bearing machinery.\nThe distinction exists because machine ecology earned one semantic difference: drones care about creature\nremains and should ignore ammunition, mined/extruded matter, and manually spawned BBs.\n\nCrawler death now joins Jumper and Floater death in producing the same 25-bioball physical shower while\nretaining its terrain bite and ember effects.\n\n3D \u00b7 WORKS \u2014 E3.2 / RENDERED TERRAIN AUTHORS BEARING SUPPORT\n\nE3.1 established the correct collision surface by raycasting every bearing against the rendered mesh,\nand immediately found the hard performance edge: even roughly ten thousand bearings made exact\nper-bearing mesh queries too expensive. That implementation is removed rather than preserved as runtime\nmachinery.\n\nThe useful architecture is the relationship E3.1 exposed. The final terrain rebuild already owns the\nclipped marching-tetrahedra triangles the observer sees. That rebuild now rasterizes those final\ntriangles once into a retained X/Z bearing-support field. Bearings return to constant-time support\nlookups while their collision representation is authored by the rendered surface rather than independently\nreconstructed from density.\n\nThe support field is deliberately conservative: each lookup uses the highest represented corner around\nthe bearing instead of interpolating downward through visible terrain, and tiny raster holes are filled\nfrom neighboring represented surface. Vertical cookie-cut walls remain apparatus-side collision rather\nthan terrain-height support.\n\nOwnership is now:\ndensity -\u003e terrain rebuild -\u003e final rendered triangles -\u003e bearing support field -\u003e bearings.\n\nApproximation remains essential for scale. The invariant is not exact triangle collision; it is that the\ncheap approximation is derived from, and conservative toward, the visible terrain it represents.\n\n3D \u00b7 WORKS \u2014 E3.0.2 / CONSEQUENTIAL RELATIONSHIPS EARN VISIBILITY\n\nBearing simulation remains authoritative and may contain far more matter than the InstancedMesh renders.\nOrdinary high-population bearing sampling is unchanged. However, a bearing currently claimed by a drone\nis force-included in the rendered set when stride sampling would otherwise omit it.\n\nThis is presentation, not simulation authority: drones still choose from authoritative bearings rather\nthan from visible bearings. The rule is narrower and more useful: presentation may simplify world state,\nbut when a machine establishes a consequential relationship with hidden state, that relationship should\nbecome perceptible.\n\n3D \u00b7 WORKS \u2014 E3.0.1 / FACTORY-OWNED DRONES\n\nDrone lifetime is subordinate to factory lifetime. Drones are now literal children of the factory root,\nnot independent scene objects. Removing/resetting the factory therefore removes its entire drone swarm\nthrough ordinary scene-graph ownership. Factory removal also releases any bearing claims held by its\ndrones. Drones are not yet entities and cannot meaningfully survive their factory.\n\nBecause orbital delivery may leave the factory at arbitrary yaw, drone targeting remains world-space\nwhile motion is transformed back into factory-local coordinates before updating each child mesh.\n\n3D \u00b7 WORKS \u2014 E3.0 / DRONE FACTORY\n\nWORKS returns from isolated locomotion research to compositional machine ecology. DRONE FACTORY is a\nplain near-cube orbital payload with an orange machinery cap. After landing it releases at most fifteen\ntiny hovering cube drones.\n\nEach drone has only a tiny physical-purpose loop: SEEK -\u003e CLAIM -\u003e INTERCEPT -\u003e CARRY -\u003e DEPOSIT -\u003e SEEK.\nIt claims the nearest currently unclaimed physical bearing outside its factory's depot exclusion radius,\nflies directly toward that bearing in full 3D, carries the same authoritative bearing home, and deposits\nit near the factory. Bearings inside the exclusion radius are ignored, allowing repeated behavior to\nproduce a depot without inventing storage or inventory.\n\nClaims prevent many drones from converging on one bearing. Claims are local bookkeeping only; no worker,\ninventory, routing, or resource ontology is promoted. Drone flight intentionally borrows the Floater\nlesson\u2014direct 3D movement can negotiate height without terrain navigation\u2014but gives it a concrete target.\n\nThe acceptance question is ecological: does one simple collector make existing bearing-producing events\n(Extruder output, death showers, loose piles) acquire new meaning through composition?\n\n3D \u00b7 WORKS \u2014 E2.7.3 / POSITION EARNS ORIENTATION\n\nE2.7.2 let the head author history but still rotated the head geometry toward intention before its\nposition had turned. The result was a sideways-facing head stepping at roughly forty-five degrees while\nthe aggregate stance solver continued driving the long body forward.\n\nThat authored rotation is removed. Lazy-circle intention now biases only the HEAD PAIR'S candidate\nfootholds in world space. If those steps create enough asymmetric planted-foot reaction, the front must\nphysically walk off the old centerline. Only that actual head displacement enters trail history.\n\nEvery vertebra's visible forward, including the head's, is derived from the tangent of traveled positional\nhistory. POSITION EARNS ORIENTATION. Followers still consume progressively older head positions.\n\nThis is the final intended snake-mechanics probe before returning to orbital delivery. If differential\nhead stepping cannot bend the traveled path under the current aggregate root stance solver, that is\nevidence that this solver cannot support the articulated locomotion proposition without a deeper change;\ndo not conceal that result with authored spine rotation.\n\n3D \u00b7 WORKS \u2014 E2.7.2 / HEAD AUTHORS THE TRAIL\n\nE2.7.1 removed the expensive/time-driven trail but exposed a locomotion deadlock: every frame the head\nitself was reconstructed from the most recent world-space trail sample. Sub-threshold root motion was\ntherefore canceled before it could accumulate enough displacement to append a new sample. The legs\nstepped while the snake remained effectively pinned in place.\n\nThe head no longer consumes path history. It remains attached to the moving entity root and AUTHORS\nnew history from actual displacement. Only the following vertebrae sample older head positions.\nThis restores the intended ownership boundary: head motion creates history; history shapes followers.\n\nFor inspection, WALKING SNAKE now defaults to a slow constant-curvature intention: each specimen chooses\na handedness and traces a wide lazy circle. The head cube alone steers toward that evolving world-space\nheading; its legs create the asymmetric planted-foot reactions that turn/move the body. No pathfinder,\nself-collision system, or additional gait machinery is introduced.\n\n3D \u00b7 WORKS \u2014 E2.7.1 / DISTANCE-DRIVEN SNAKE TRAIL\n\nE2.7's first path-history implementation regressed badly despite the earlier many-legged Millipede\nrunning acceptably. Three symptoms shared one cause: the trail was born as one point, grew with elapsed\ntime rather than embodied displacement, and every vertebra repeatedly rescanned a trail up to 420\nVector3s. That produced a startup singularity, shape motion outrunning the feet, and avoidable frame cost.\n\nThe snake now seeds a complete straight body history at birth. Trail samples are appended only when\nthe ACTUAL head has displaced far enough in world space. The trail is short/fixed-size and vertebrae\nuse direct distance-indexed lookup rather than linear rescans. Shape memory therefore cannot run ahead\nof locomotion. Top speed is also brought below the previous gait-outrunning value while preserving the\nsame leg mechanics.\n\nThis is one repair pass, not further snake architecture. After this probe, attention returns to orbital\ndelivery: an articulated walking snake cannot truthfully arrive from orbit already deployed as a snake.\nDeployment/packaging is the next separate question.\n\n3D \u00b7 WORKS \u2014 E2.7 / WALKING SNAKE RESET\n\nE2.6 showed that independently posing rectangular segments makes a slanted train, not a body that follows its own turn. The active proposition is now WALKING SNAKE. Nine roughly cubic walking vertebrae replace elongated blocks, so length comes from repeated relationships rather than long bricks.\n\nThe head owns a bounded heading and lays down path history. Successive vertebrae sample progressively older points and orient tangent to that history: the tail follows where the head has been rather than anticipating its turn. Legs retain the earned terrestrial rule and step only along their own vertebra-local headward +Z.\n\nPATH HISTORY IS SHAPE MEMORY, NOT MOTION AUTHORITY. It does not translate the entity root. Planted-foot reaction remains world-motion authority. Conservative head curvature is the first anti-coiling constraint; self-collision is deliberately not introduced yet.\n\n3D \u00b7 WORKS \u2014 E2.6 / HEADWARD TURNING\n\nPlay exposed a semantic bypass in E2.5. Millipede footholds were advanced directly along world-space\ntravel intention, so the animal could strafe sideways even though its morphology was meant to be\nhead-forward. Intention had accidentally acquired locomotor authority.\n\nThe Millipede now has an explicit morphological +Z headward end, marked only by a crude dark nose for\ninspection. Each leg advances along its OWN SEGMENT'S local headward axis. World-space travel intention\ndoes not become a stepping vector. Instead it biases articulation most strongly at the head and\nprogressively less toward the tail. Curved local footholds then create planted-foot reactions; those\nreactions remain the only authority translating/yawing the root.\n\nTRAVEL INTENTION MAY STEER SEMANTIC FORWARD; IT MAY NOT REPLACE SEMANTIC FORWARD.\nThe animal remains deliberately unidirectional. No reverse gait or tail-as-head behavior is introduced.\n\nThe edge failure seen in play is not patched here. Large articulated bodies can still outrun the\npoint-like root boundary and leave anchors/body sections in degenerate relationships. That is retained\nas evidence for the next traversal question: whether plausible ground continues through the body's\nforward corridor. Do not hide that missing perception with leg deletion, root teleport, or invisible\nrescue constraints.\n\n3D \u00b7 WORKS \u2014 E2.5 / TURNING INTENTION\n\nE2.4 established that the articulated millipede walks. This pass asks whether Walker and Millipede\ncan respond to a changing world-space travel intention without granting intention direct body authority.\n\nBODY FORWARD remains stable entity-local +Z. TRAVEL INTENTION is separate and slowly wanders in\nworld space. It may change direction; it never rotates or translates a machine directly. Walker\ncontinues to turn through asymmetric foothold/stance reaction. Millipede now accumulates yaw torque\nfrom its own planted-foot reaction, so any turn must emerge through the same embodied seam.\n\nThe Millipede remains head-forward and unidirectional. Bidirectional gait is deliberately absent.\nIts phase gate now permits one swing per leg per gait cycle, removing the accidental double-tap.\nTemporary visual grammar follows Walker: beige body, dark top pieces; orange accent is not identity.\n\nThis is not pathfinding. It is a probe of whether semantic travel direction can change while\nembodiment retains authority over how, whether, and how quickly the machine actually turns.\n\n3D \u00b7 WORKS \u2014 E2.4.1 / PRESENTATION STATE OWNERSHIP\n\nPlay exposed accidental coupling: turret fire changed the emissive state of the shared orange material,\ncausing orange parts on unrelated machines to pulse simultaneously. The shared material was also\nmisnamed payloadHot even though orange parts often mean only temporary WORKS construction language.\n\nIt is now machineAccentMat: a shared provisional metal/accent language, not behavioral state. The\nturret scanner owns a cloned instance because its fire pulse is entity-specific mutable presentation.\nSHARED APPEARANCE DOES NOT IMPLY SHARED MUTABLE PRESENTATION STATE.\n\nThese crude shared materials and geometries are not final entity identity. A later visual-design pass\nmay unify the overall WORKS language while giving each proven machine its own geometry and character;\nfunctional morphology and causal readability are the evidence to preserve.\n\n3D \u00b7 WORKS \u2014 E2.4 / ARTICULATED MILLIPEDE PROBE\n\nThe rigid Walker platform earned a new question: are its terrestrial leg semantics reusable when the\nthing being carried is an articulated spine rather than one rigid trunk? ARTICULATED MILLIPEDE is a\nfresh PROBE, not a promoted PAYLOAD and not a generalized robotics framework.\n\nEight short body segments form a bounded spine. Each segment carries a left/right pair of the same\nkind of deliberately cheap two-bone terrestrial legs. Leg pairs use a traveling phase offset rather\nthan bespoke per-leg choreography. Neighboring body segments carry a small traveling articulation\nwave so the trunk itself participates perceptually in locomotion.\n\nThe Walker's earned terrestrial invariant is preserved: candidate footholds at or above the owning\nhip are rejected before IK. Stance feet remain world anchors and their accumulated positional error\nis the only authority translating the specimen. The target/intention never directly moves it.\n\nThis probe asks one narrow question: CAN A WALKING PLATFORM'S LEG SEMANTICS SURVIVE RECOMPOSITION\nONTO A REPEATED ARTICULATED BODY? It does not claim realistic centipede dynamics. At miniature scale,\ncoherent causal reading is the acceptance criterion; close-up robotics fidelity is not.\n\n3D \u00b7 WORKS \u2014 E2.3.1 / TERRESTRIAL FOOTHOLD CUTOFF\n\nPlay exposed a semantic violation rather than an IK failure: a foot could solve to overhead terrain.\nA terrestrial leg now rejects any candidate support at or above its own world-space hip before the\ntarget reaches IK. Rejection preserves the existing foothold, so inability to find admissible support\nremains local failure rather than granting motion authority. No additional step-height, slope,\nclearance, or traversal-prediction rules are introduced by this correction.\n\n3D \u00b7 WORKS \u2014 E2.3 / LEG DISCIPLINE\n\nPlay established a useful result: E2.2 genuinely traveled, but its legs became kinematically incoherent.\nThe locomotion seam is therefore preserved. This pass does not redesign gait, increase body authority,\nor guarantee success. It adds morphology the first walker proved it needed.\n\nEach leg now owns a body-relative workspace associated with its hip/quadrant. Foothold targets are\nclamped to that workspace and to conservative horizontal reach before terrain height is sampled.\nA leg cannot casually cross the chassis centerline or choose another leg's territory.\n\nTwo-bone IK now has a persistent body-local outward knee hint per leg. The solver may satisfy reach,\nbut it may not freely choose a new bend side every frame. This is body knowledge, not locomotion.\n\nHeading intent no longer rotates the desired home frame to face the target. A crawl step begins from\nthe leg's current body-relative home and heading error only biases forward/lateral reach. Existing\nstance reaction remains authoritative for trunk translation/yaw.\n\nE2.2 evidence is preserved: a machine can move through stance reaction while IK itself has no\nlocomotion authority. E2.3 asks the narrower question: can that movement remain mechanically legible\nonce each limb knows where it belongs?\n\n3D \u00b7 WORKS \u2014 E2.2 / FIRST IK WALKER\n\nThe E2.1 Tripod and Walker specimens were scrubbed rather than patched. The experiment now advances one\nmachine at a time. The only visible PROBE is IK WALKER. Old single-mechanism probe implementations remain\narchaeology/code but are not selector choices.\n\nThis Walker deliberately borrows established craft instead of rediscovering gait scheduling: a conservative\nfour-beat crawl moves one foot at a time. Each leg is represented only by hip attachment, two segment lengths,\na world-space effector target, and an analytic two-bone solve. This is research vocabulary, not yet a promised\ngeneral limb architecture.\n\nIK HAS NO LOCOMOTION AUTHORITY. It only articulates segments toward an effector target. Intent chooses future\nfootholds. During stance, feet become world anchors; spring-like reaction from anchor error accelerates and yaws\nthe trunk. No target, gait phase, IK solve, or controller writes destination-space trunk position or yaw directly.\nThe result may walk, slip, oscillate, turn poorly, or fail. Those outcomes are evidence about the seam between\nsemantic machine propositions and lightweight embodiment.\n\nKNOWN CRAFT IS NOT A FAILED EXPERIMENT. 'Build the smallest thing that can teach us something' does not require\nre-deriving solved gait/IK mathematics. Established craft may be used as the boring substrate beneath the actual\nquestion: what mechanically meaningful representation is also legible enough for conversational machine invention?\n\n3D \u00b7 WORKS \u2014 E2.1 / BODY MORPHOLOGY + EARNED STEERING\n\nInspection showed WALKER BASE direct root-yaw steering could spin violently while the legs separately\nattempted gait. The target no longer rotates the root. Heading error now biases left/right step timing\nand stride; yaw may arise only from asymmetric planted-foot correction. Rocking remains visible evidence.\n\nThe first TRIPOD read as a stationary appliance: narrow vertical body with three short appendages.\nThat specimen was replaced rather than cosmetically tuned. The new proposition separates three very\nlong load-bearing legs from three independent telescoping manipulators beneath a broad elevated body.\nHistorical John Christopher Tripod cover imagery informed only the proportion lesson\u2014substantial body\naloft over enormous empty undercarriage\u2014not a design to reproduce. Locomotion/support and manipulation\nare now separate mechanical questions. The Tripod likewise receives no direct root-yaw steering.\n\nPROBE selector invariant: only current experimental machine propositions are exposed. Older mechanism\nprobes remain implemented and documented but must not re-enter the tap-through selector accidentally.\n\n3D \u00b7 WORKS \u2014 E2 / MACHINE PROPOSITIONS\n\nThe experimental cupboard now exposes only TRIPOD and WALKER BASE. Earlier mechanism probes remain\nimplemented as archaeology/test material but no longer occupy the tap-through list. PAYLOAD now means\ntried/accepted current-canon unit or machine; PROBE means experimental bucket. Both may use the same\norbital delivery and live-world machinery. Classification is epistemic, not a different physics path.\n\nNorth star: machines are situated actors, not placed structures. Orbital delivery preserves arbitrary\nroot orientation. External control is represented as world-space intention (vector/locus/node); each\nmachine owns the embodied attempt to satisfy it. Intention does not guarantee success. E2 uses a small\ndeterministic autonomous target only as a temporary stand-in for future human/agent locus assignment.\n\nTRIPOD is a tall trunk with three telescoping axial-force appendages. They are intentionally not named\narms or legs. Each independently seeks terrain-relative extension. Pair/triplet gripping and resultant\nforce are the proposition under inspection, not pre-scripted FLIP behavior.\n\nWALKER BASE is a mobile trunk with four crude articulated struts. Alternating swing/stance may create\nplanted contacts. Horizontal trunk displacement is allowed only as correction required to preserve\nthose planted contacts while joints articulate; there is no destination-space translation. It receives\na distant locus, turns its semantic forward toward it, and if bodily locomotion brings it near the locus\nit visibly changes configuration into a deployed-base posture.\n\nThese are machine-scale propositions, not claims of success. Human/model inspection remains part of\nestablishing their mechanical relationships. Failed behavior should be diagnosed rather than hidden\nbehind animation.\n\n3D \u00b7 WORKS \u2014 E1 PHASE 2C / MECHANICAL TRUTH PASS\n\nSecond inspection corrected the experiment's objective: bearings are diagnostic matter, not a universal\nacceptance test for machinery. JAWS remain untouched. TUMBLER keeps its visually successful sustained\ncontact but now relinquishes bearings when rotation no longer plausibly supports them.\n\nFLIPPER's horizontal launch is explicitly reconciled with semantic local forward rather than a world\naxis. TENDON stops pretending to be a granular scoop: it now connects attachment points on an\narticulated member, with contraction visibly changing configuration. LEG abandons the invisible\nvertical-piston correction. Its foot can plant at a real world point; while planted, joint articulation\nmoves the body by the linkage error required to keep that foot fixed. During swing, gravity resumes.\n\nCurrent truths under test:\nROTATION MUST LOSE CONTACT NATURALLY.\nCONTRACTION MAY BE A RELATIONSHIP BETWEEN ATTACHMENT POINTS.\nPLANTED CONTACT CAN TURN ARTICULATION INTO BODY DISPLACEMENT.\nDIAGNOSTIC MATERIAL IS NOT A DESIGN OBJECTIVE: BEARINGS REVEAL MECHANICS; MECHANICS DO NOT EXIST TO\nMANIPULATE BEARINGS.\n\nNo generalized mechanics framework is promoted by this pass.\n\n3D \u00b7 WORKS \u2014 E1 PHASE 2B.1 / TUMBLER RUNTIME REPAIR\n\nVisible diagnostics caught a real Phase 2B integration error during bearing/tumbler contact:\ncarryBearingWithRotor used dt to derive carried bearing velocity but its helper signature did not\nreceive dt. The render loop correctly failed visibly rather than continuing in a corrupt state.\nThe repair is intentionally minimal: updatePhase2Probe now passes its existing frame dt into the\nrotor-contact helper. No mechanical semantics changed.\n\n3D \u00b7 WORKS \u2014 E1 PHASE 2B / CONTACT + SUPPORT CONSOLIDATION\n\nUser inspection of the first fan-out produced a clean experimental split:\nJAWS passed and visibly smoothed granular piles.\nFLIPPER launched delightfully but used a world-axis impulse instead of semantic forward.\nTUMBLER pushed through bearings but could not carry them upward and over.\nTENDON contraction scooped material, but extension passed through instead of pushing it back.\nLEG found the ground, disturbed bearings, and pushed its body upward, but then remained suspended\nbecause the probe had modeled a momentary ground reaction rather than persistent support.\n\nThe correction pass preserves those findings instead of replacing them with a generalized mechanics\nframework. All probes now carry semantic local forward (+Z); Flipper derives horizontal launch impulse\nfrom that direction. Tendon's moving endpoint transmits contact in both contraction and extension.\nTumbler gets a deliberately local sustained-contact proof: bearings inside its rotating cage region\nare carried incrementally with rotor motion until geometry/gravity releases them.\n\nLEG now owns vertical velocity. Its body continuously falls under probe-local gravity; foot penetration\nagainst actual terrain/plinth support resolves the body upward and arrests downward velocity only while\nthe articulated chain reaches the world. When the foot loses support, gravity resumes. This is the\nfirst probe where mechanism configuration constrains what the world can do to the mechanism itself.\n\nNo generic ContactSystem, SupportSystem, JointSystem, rigid-body solver, or actuator framework is\npromoted yet. The batch has instead sharpened four candidate truths:\nDIRECTION BELONGS TO THE MECHANISM, NOT THE WORLD.\nPUSH IS NOT CARRY.\nCONTRACTION IS NOT BILATERAL CONTACT.\nGROUND REACTION IS NOT PERSISTENT SUPPORT.\n\n3D \u00b7 WORKS \u2014 E1 PHASE 2 / MECHANICAL FAN-OUT\n\nPhase 1 passed by direct play: multiple crude linear actuators visibly reorganized persistent bearing\npiles, and flat surfaces let the displaced material retain a readable history of work. The actuator\nis frozen as proof rather than polished.\n\nThe PROBES cupboard now fans that evidence into five additional disposable specimens:\nFLIPPER redirects moving-contact consequence through a hinge and attempts angular impulse.\nJAWS use opposed translation to compress and temporarily contain bearings.\nTUMBLER uses continuous rotation to lift, stir, and spill material.\nLEG combines two articulated joints, a foot, terrain contact, and a visibly supported body load.\nTENDON expresses actuation as changing distance between attachment points rather than a piston shaft.\n\nThese are intentionally heterogeneous local implementations. Their contact approximations operate\ndirectly on the same authoritative CPU bearing state proven useful in Phase 1. Similar-looking code is\nnot yet evidence for a shared actuator, joint, contact, locomotion, muscle, or rigid-body framework.\n\nThe batch's purpose is comparative evidence: discover which mechanical relationships remain useful\nwhen expressed as translation, rotation, containment, support, and contraction. Successful and\ninstructive failed specimens may coexist on the table. Promotion follows observed repeated truth,\nnot completion of this list.\n\n3D \u00b7 WORKS \u2014 E1 PHASE 1 / LINEAR ACTUATOR PROOF\n\nIterative payload development pauses here for a mechanical expedition. PAYLOADS remain the established\nPOC ecology. A separate PROBES cupboard now hosts disposable specimens inside the same WORKS world.\n\nThe first specimen deliberately assumes almost nothing: a crude frame, one translating carriage,\none shaft, and one broad contact face cycling through a fixed stroke. Its only success condition is\nwhether extension can physically displace ordinary authoritative bearings already belonging to WORKS.\n\nBecause WORKS bearings are CPU-authoritative particles rather than rigid-body meshes, this proof uses\na deliberately local swept contact slab at the actuator face to transfer forward velocity into balls.\nThat is evidence, not yet architecture. No ActuatorComponent, contact engine, rigid-body framework,\njoint system, or machine alphabet is promoted by this implementation.\n\nGATE: inspect this specimen in play before fan-out. If contact displacement is legible and useful,\nthe expedition may rapidly probe rotational redirection, opposed contact, articulated support, and\nother mechanisms. If it is not, investigate this boundary rather than layering more machinery on it.\n\n3D \u00b7 WORKS \u2014 T0.22 / TURRET ELEVATION + TRUE MUZZLE\n\nFloater height exposed a presentation gap in the cannon: azimuth tracked semantic forward correctly,\nbut the barrel did not visually negotiate target elevation. The turret now has a nested pitch pivot\nbeneath its existing yaw pivot. While tracking, yaw follows horizontal intent and pitch follows target\nheight. Elevation is presentation/aiming semantics only; it does not steer an in-flight bearing or\ngrant hitscan. The existing ballistic solver still independently determines the shot trajectory.\n\nCannon bearings now spawn from the transformed world position of the physical barrel muzzle rather\nthan a generic machine-center offset. The ballistic solver starts at that muzzle position, so visible\ncause and simulated projectile origin agree.\n\nThis remains turret-local articulation. One articulated cannon does not yet earn a generalized aiming\nor joint system.\n\n3D \u00b7 WORKS \u2014 T0.21 / FLOATER EARNS LIFT\n\nThe true Floater no longer fakes hovering by adding a fixed post-gravity Y offset. Its GravityBody now\nuses a small payload-specific lift controller: vertical velocity accelerates gradually toward a\nterrain-relative hover datum, damps as it approaches, and continuously follows slow sinusoidal\nvertical drift while the existing random walk continues horizontally.\n\nThe current hover datum is 4.85 units above support. With the Floater body's local geometry this reads\nat approximately twice the height of the 3.72-unit Link Node pylon. This is deliberately a tuned\nspecimen behavior, not yet a generalized flight or buoyancy system. Jumper keeps the accidental\nsupport/gravity interaction that gives it its ballistic-nightmare bounce.\n\n3D \u00b7 WORKS \u2014 T0.20 / JUMPER CANON + TRUE FLOATER\n\nObserved play overruled authored naming. The T0.19 \"Floater\" did not read as a stable hovering creature:\nits support/gravity interaction produced erratic bouncing. That failure was useful. The moving target\nbecame a ballistic problem where a nominal two-hit creature often consumes substantially more shots.\nThe behavior is retained and canonized as JUMPER EGG rather than corrected away.\n\nA new JUMPER EGG now occupies the original intent: same autonomous wandering family, but held at a\nstable elevated support offset. Its body is muted purple with a broad suspended sac and four sparse\njellyfish-like appendages: one longer central spindle and three shorter surrounding tendrils.\n\nThe successful bearing-shower consequence earned one small promotion: bearingBurst(origin,count).\nIt emits ordinary physical world bearings and is shared by Jumper and Floater deaths. This is a mini\nphysical-consequence system, not loot, drops, rewards, or a generalized death-effects framework.\nCrawler death remains distinct: three hits and a terrain bite. Jumper and Floater each take two hits\nand release twenty-five bearings.\n\nThis turn is also evidence for the root philosophy: unexpected composition was inspected before being\n\"fixed\"; the useful accident was preserved as a new creature, while only the repeated bearing-shower\nmechanism was promoted.\n\n3D \u00b7 WORKS \u2014 T0.19 / JUMPER EGG\n\nA second autonomous target was added as a deliberately close sibling rather than a new creature\nframework. JUMPER EGG reuses the Crawler's wandering behavior and existing entity/gravity semantics,\nwith a small local hover presentation. Turrets acquire either egg through the same target search.\n\nDurability is now payload-specific evidence rather than a universal health system: Crawlers take\nthree cannon hits; Floaters take two. Crawler death keeps its world-owned terrain bite. Floater death\ndoes not deform terrain and instead releases twenty-five ordinary physical bearings into the world,\nturning destruction into a granular resource/event. The distinction remains payload behavior because\ntwo specimens do not yet justify generalized combat, loot, death-effect, or locomotion frameworks.\n\n3D \u00b7 WORKS \u2014 T0.17 / ENTITY-LEVEL SEMANTIC FORWARD\n\nRepeated turret-facing corrections exposed directionality split between authored geometry and behavior\nmath. Direction now begins at the live entity: every entity carries semantic forwardLocal, currently\ncanonical local +Z. This is intentionally not a full directionality framework.\n\nDirectional payload geometry is authored against +Z. A small entity-level yaw helper converts a\nworld-space intent point into local yaw and turns a payload part toward it. Turret acquisition now\nuses that convention directly; the compensating +PI behavior hack is removed. The barrel remains\nauthored physically along +Z, so geometry, entity semantics and targeting share one statement of\nforward.\n\nThis is the beginning of reusable positional semantics at entity level. Future directional payloads\nmay consume the convention without each inventing their own sign/orientation rules; no additional\norientation components or hierarchy are promoted until world evidence earns them.\n\n3D \u00b7 WORKS \u2014 T0.16 / SURFACE-INTENT BITE\n\nT0.15 fixed ownership but play exposed a second problem: a 1.45-radius buried spherical density edit\nwas an implementation-space request, not a reliable physical statement. At this coarse 30x22x30\nlattice it could change density without moving enough samples across the zero isosurface to produce\na visible wound.\n\nTerrain therefore gained surfaceCarve(surfacePoint, radius, depth). Callers identify the actual\nsurface and desired bite scale; terrain owns conversion into a downward-biased mutation spanning\nmultiple vertical lattice intervals. ONE TERRAIN BITE is now a real shared physical operation:\nExtruder chew and Crawler death both call the same oneTerrainBite() helper with radius 1.45 and\ndepth 2.8. The Extruder no longer gets a privileged implementation-shaped carve.\n\nThis is a refinement of the T0.15 world-owned deformation boundary, not a new subsystem. Meteor\nretains its crater-specific shape through the same mutation/commit ownership. Human brush CARVE\nremains a direct sculpting verb because its intent is interactive density editing rather than a\nsurface-material bite.\n\n3D \u00b7 WORKS \u2014 T0.15 / WORLD-OWNED TERRAIN DEFORMATION\n\nTerrain deformation became world-owned when human sculpting, Extruder chewing, meteor impact and\nCrawler destruction all needed to alter the same authoritative signed-density substance. Earlier\ncallers reached field mutation through interaction-shaped or bespoke paths; that made cause and\nrealization easy to confuse.\n\nterrainDeformation is now the single mutation/commit boundary. Callers describe their physical\ndelta; terrain owns field mutation, rebuild and derived-support invalidation. The sculpt tool is a\ncaller, not the owner. Extruder and Crawler death both invoke the same EXTRUDER_BITE_RADIUS carve\noperation; Crawler death anchors that carve just beneath its exact live support surface so the wound\nactually intersects material. Meteor retains its distinctive crater/rim mutator but commits through\nthe same terrain-owned boundary and preserves profiler timing.\n\nThis is a semantic promotion, not an ECS promotion: terrain is a world substrate, not an entity\ncomponent. The artifact's present-tense ownership model and terrain documentation were revised in\naddition to preserving this chronological scar.\n\n3D \u00b7 WORKS \u2014 T0.14 / AIM + BITE CALIBRATION\n\nTwo observed play corrections, no new architecture. Turret visual yaw is corrected by PI so the\nauthored +Z barrel faces the acquired Crawler rather than pointing directly away while targeting.\nBallistic shot computation remains world-space and unchanged.\n\nCrawler death terrain damage now uses the same 1.45 carve brush radius as one Extruder chew. The\ndestruction event therefore has an already-familiar material scale instead of inventing another one.\n\n3D \u00b7 WORKS \u2014 T0.13 / CANNON CANON\n\nTurret-versus-Crawler behavior is now an explicit bounded physical relationship rather than an\naccidental infinite-range shot. Turrets search only within a 25-unit horizontal radius and own\ntheir own scan -\u003e acquire -\u003e track -\u003e fire transitions. Their head slews toward acquisition before\na shot is permitted; scanner/barrel motion makes firing state visible.\n\nCannon rounds are ordinary bearing particles launched with a low ballistic solution using the\ncurrently selected world gravity. A tracked cannon round can register at most one collision event.\nCrawler Eggs own hit state and survive four impacts; the fifth consumes the crawler, emits a short\nspark shower and buried red thermal glow, and makes a mild local wound in the same deformable terrain.\nThis is deliberately not a generalized combat/health framework.\n\nThe host now defaults to 3D \u00b7 WORKS when no explicit valid lab hash is supplied. Existing lab\nselection and cold-mount behavior remain unchanged.\n\n3D \u00b7 WORKS \u2014 T0.11 / PAYLOADS OWN THEIR MOTION\n\nPayload animation is now explicitly payload-owned behavior rather than a world animation framework.\nThe behavior system dispatches each live entity to its payload-specific updater; each payload may own\nits own semantic state transitions. World systems remain cross-cutting capabilities such as gravity,\nsupport and ports. Reusable motion helpers may emerge later, but motion is not promoted to a component\nmerely because several things move.\n\nTURRET now continuously expresses state: without a CRAWLER EGG target it performs a slow idle scan\nwith its orange directional cone; acquisition transitions immediately to tracking and firing when fed.\nLINK NODE is now a narrow relay pole with its orange directional head raised above machine clutter.\nIts one input and one output terminate at the head so topology reads above the work surface.\n\nLink flow is intentionally representational at this stage. Bright pulses travel EXTRUDER -\u003e LINK NODE\nand LINK NODE -\u003e TURRET to make the causal transfer readable, but the logistics system does not yet\nsolve physical bearing capture or transport from the extruder pile. The real extruded bearings remain\nfree world substance. This is a deliberate boundary: make the relationship legible before simulating it.\n\n3D \u00b7 WORKS \u2014 T0.10 / PORTS SOLVE ONE PROBLEM\n\nThe logistics experiment is intentionally narrower than its substrate. Live entities may now own\narbitrary inputs[] and outputs[] with local spatial socket transforms. This N-port capability exists\nso future payloads can instantiate only the ports they actually need; it is not a routing framework.\n\nCurrent specimens remain deliberately asymmetric:\nEXTRUDER = 0I / 1O\nLINK NODE = 1I / 1O\nTURRET = 1I / 0O\n\nA Link Node can bind exactly one free upstream O and one free downstream I. Ports are exclusive:\na bound port cannot simultaneously serve another Link Node. Connections are provisional; removal of\nan endpoint releases the corresponding sockets so surviving nodes can resolve again. Link machinery\nqueries ports, never EXTRUDER/TURRET classes. Branching, balancing, priorities and typed resources\nremain absent until physical evidence earns them.\n\nExtruder conversion was made intentionally profligate without increasing its terrain appetite.\nEach existing slow chew removes the same bounded terrain bite but now emits a dense stream of 72\nordinary bearings. The pile is the stockpile; no abstract production counter was introduced.\n\n3D \u00b7 WORKS \u2014 T0.9 / FIRST EARNED ECS PROMOTION\n\nWORKS did not begin with ECS. Individual payloads originally owned their own update behavior because\npremature generalization would have hidden what the laboratory was actually discovering. Terrain\ndeformation then produced a genuinely cross-cutting requirement: every physical payload must remain\nsubject to gravity after orbital delivery, regardless of machine behavior. Gravity therefore became\nthe first capability whose ownership clearly belonged to neither a particular payload nor terrain.\n\nECS enters here because the world earned a system. Every live dropped payload is now an entity and\nautomatically receives GravityBody at orbital-arrival handoff. Orbital delivery remains an authored\nfast slam and is explicitly not gravity. After touchdown, GravitySystem continuously reevaluates\nsupport. Deformable terrain is provisional support; the immutable octagonal plinth top is the absolute\nbottom of WORKS. Remove terrain beneath a machine and the machine falls until terrain or plinth catches\nit. Machine behavior remains separate from gravity ownership.\n\nThe selector is intentionally narrowed to the current experiment: THUMPER, EXTRUDER, LINK NODE,\nTURRET, and CRAWLER EGG. Earlier PYLON, SPIDER JACK, MOLE, CRANE SEED, HOPPER, and BRICK bodies and\nbehavior prototypes remain in source as dormant conceptual specimens rather than active UI clutter.\n\nArtifact scar: this is the exact point where local toy code became a small entity/system substrate,\nnot because ECS was aesthetically preferred, but because a live world-wide invariant finally demanded it.\n\n3D \u00b7 WORKS \u2014 T0.8 / BEARING LOGISTICS + GRAVITATIONAL DELIVERY\n\nOrbital payloads now fall under explicit downward acceleration after release. The human chooses the\nhorizontal drop point; runtime gravity owns arrival timing and contact. This replaces the prior\nscripted interpolation-to-ground arrival.\n\nThree rough payloads close a first material loop. EXTRUDER slowly bites adjacent signed-density\nterrain and emits ordinary physical bearings. LINK NODE dynamically discovers the nearest extruder\nand nearest turret; its visible cyan connections are provisional, periodically recomputed, and may\nremain half-resolved until a compatible endpoint exists. It consumes actual loose bearings near its\nproducer and transfers conserved units into turret feed, shown as traveling bearing beads. TURRET\ntracks the nearest crawler egg and can fire only when fed; shots are ordinary bearing particles with\nvelocity and gravity, not a separate projectile ontology.\n\nThe intended user grammar remains DROP THING HERE. Routing, loading, target acquisition and relinking\nare machine behavior rather than additional human UI. Nodes persist while connections are fluid.\nThis is deliberately a rough systems probe, not a generalized logistics graph or combat framework.\n\n3D \u00b7 WORKS \u2014 T0.7 / ORBITAL PAYLOAD CUPBOARD\n\nWORKS now has a deliberately small orbital payload vocabulary selectable one at a time from the\nlab controls. PAYLOAD cycles the current body; CALL DOWN arms placement; tapping terrain/apparatus\ncalls that payload from above. Arrival is shared machinery, but payload bodies and behaviors remain\nlocal and intentionally unsystematized.\n\nCurrent specimens: PYLON establishes a vertical marker; SPIDER JACK deploys four legs and settles\ntoward level; MOLE performs one bounded excavation after landing; THUMPER repeatedly drives a hammer\nand impulses nearby granular matter; CRANE SEED unfolds a mast/boom proposition; HOPPER periodically\nemits small bearing batches; CRAWLER EGG becomes a simple terrain-following mobile body; BRICK is\nintentionally functionless mass/obstacle evidence.\n\nThese are cheap propositions, not a machine ontology or construction API. Their purpose is to let\nWORKS discover which bodies and consequences are actually interesting. Procedural browser geometry\nis sufficient truth for this pass. Payloads persist until RESET WORKS.\n\n3D \u00b7 WORKS \u2014 T0.6 / PROJECTILE AUTHORITY STOPS AT APPARATUS\n\nThe T0.5 plinth collision initially applied only to bearing support/side response. Meteors could\nstill complete their precomputed terrain trajectory through the manufactured prism and invoke\nterrain deformation beneath it. That violated the new ownership boundary.\n\nMeteor flight now sweeps each frame segment against the same immutable analytic octagonal prism.\nFirst apparatus contact terminates the projectile. Contact may still produce visible impact FX and\ngranular impulse, but it never calls terrain deformation. Terrain impact behavior is unchanged when\nthe apparatus is not the first physical obstruction.\n\nRule: physical grammars do not get to act through immutable apparatus.\n\n3D \u00b7 WORKS \u2014 T0.5 / IMMUTABLE PLINTH COLLISION\n\nThe octagonal apparatus is now physically authoritative rather than visual scenery. It remains\ncategorically separate from signed-density terrain and cannot be raised, carved, smoothed, or\ndeformed by meteors. Bearings collide with its analytic top and vertical octagonal side faces.\n\nTerrain support and apparatus support compose by taking the higher physical surface. Excavating\nbrown material deeply enough therefore reveals an immutable manufactured floor at the apparatus\ntop instead of allowing matter to fall through the table. The exposed rim is likewise real support.\nSide collision is analytic against the eight prism planes; no mesh collider, BVH, or general physics\nengine has been introduced.\n\nOwnership invariant: terrain tools own deformable substance; the apparatus owns its immutable\noctagonal prism and collision boundary.\n\n3D \u00b7 WORKS \u2014 T0.4 / METEOR COST PROBE\n\nMeteor impacts showed a noticeable mobile frame hitch. This pass does not prematurely redesign\nterrain meshing. It makes the cost visible in the lab itself and removes one demonstrably wasteful\noperation: crater/rim deformation now visits only a conservative local grid box instead of scanning\nthe complete signed-density volume.\n\nThe visible METEOR PROFILER reports deformation, complete terrain rebuild with polygonize/clip/\ncut-wall/copy/bounds phases, granular impulse, impact-FX construction, and the lazy collision-height\ncache rebuild that occurs after terrain mutation. Full terrain remeshing and current FX realization\nremain deliberately intact as controls. The next optimization should follow measured device evidence.\n\n3D \u00b7 WORKS \u2014 T0.3 / CLOSED COOKIE CUT\n\nT0.2 got the plan-view architecture right but exposed a new implementation leak: clipping the\ntriangle soup removed geometry outside the octagon without creating the physical cross-section of\nthe cut, leaving a wafer-thin open shell visible from below.\n\nT0.3 keeps the cubic density block and exact post-mesh octagonal mask unchanged. Boundary edges on\nthe eight mask planes are recovered from the clipped surface and extruded vertically into the\nplinth as brown material cut faces. This closes the visible solid without a collar, second terrain\nsystem, or octagonal density field. Apparatus owns X/Z boundary; material owns the surface and its\ncut cross-section.\n\n3D \u00b7 WORKS \u2014 T0.2 / OCTAGONAL PLINTH, CUBIC BLOCK, COOKIE-CUTTER MASK\n\nT0.1 still asked marching tetrahedra to infer an octagonal density boundary. Six faces looked clean\nwhile two opposing faces exposed tetrahedral/grid anisotropy, and the visible reveal wandered.\nThat approach is retired rather than refined.\n\nT0.2 matches the deliberately dumb mental model: explicit regular octagonal plinth; ordinary\nrectilinear signed-density block that does not know it is an octagon; exact post-mesh clipping\nagainst eight apparatus-derived half-planes. Collision/height sampling is rejected outside that\nsame mask. The block deliberately overruns the mask.\n\nInvariant: octagonal plinth + cubic block + octagonal cookie cutter. Apparatus owns the exact X/Z\nlaboratory boundary and fixed reveal. Existing substance machinery owns deformation right up to it.\n\n3D \u00b7 WORKS \u2014 T0.1 / AUTHORITATIVE OCTAGON BOUNDARY\n\nThe first empty WORKS table exposed an implementation leak: the signed-density grid approximated\nthe material perimeter while the apparatus used an independent octagonal mesh. The result was a\ntoothed terrain edge and a reveal whose width drifted around the table.\n\
