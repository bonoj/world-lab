nT0.1 establishes one geometric relationship. The apparatus is a regular octagonal prism. The\nmaterial boundary is the constant-perpendicular inset of that same octagon, expressed analytically\nas a clipping density during terrain meshing and collision sampling. Deformation remains free\ninside the boundary but cannot move or voxelize the laboratory edge. The apparatus now descends\nfar below the material as one thick monolithic plinth rather than reading as stacked decorative\nlayers.\n\nInvariant: apparatus owns the boundary; deformable material owns everything inside it.\n\n3D \u00b7 WORKS \u2014 T0 / COPY-FIRST GENESIS\n====================================\n\nSTATUS\nWORKS is a new independent World Lab laboratory copied completely from the authoritative 3D \u00b7 TEST CHAMBER T2.2 / LOCUS NAVIGATION implementation. This is intentionally a dumb fork, not a refactor and not shared infrastructure. Test Chamber remains unchanged and authoritative for its own lineage.\n\nSTARTING QUESTION\nWORKS is a surface for stationary and mobile machines at implied miniature scale. It begins before those machines exist. The inherited deformable signed-density material, bearings, gravity registers, local attractor, meteor, sculpting, locus navigation, camera behavior, diagnostics, recovery, and interaction machinery are preserved as available capabilities rather than redesigned up front.\n\nT0 SCENE\nThe active world is deliberately cleared to one planar octagonal signed-density material volume resting slightly proud of a massive octagonal manufactured apparatus. The apparatus is not terrain and does not participate in sculpting. The material itself is simply octagonal; no special octagonal topology, sector semantics, sockets, directions, or world ontology are introduced. Internally the inherited rectangular signed-density field remains unchanged and merely contains the octagonal solid.\n\nThe local gravity attractor remains inherited functionality but is hidden while OFF so the canonical T0 scene contains only material + apparatus. Turning it ON makes the inherited gravity node visible and causal again. Bearings remain absent until spawned. Meteors and deformation leave evidence only when invoked.\n\nWHY THIS EXISTS\nThe immediate direction is intentionally broader than the earlier Terrordrome traversal framing: stationary and mobile machines should both negotiate world geometry through physical bodies and mechanisms. Candidate future work includes terrain-tolerant/deployable machinery and construction modules that can establish local rectilinear datums by deforming terrain, but none of that machinery exists at T0.\n\nPROCESS\nBuild truth first. Preserve visible causality. Prefer composable physical relationships over bespoke abilities. Let failure purchase the next mechanism only while it fails cheaply. Failed probes should be reverted rather than fossilized into active machinery. Do not use image generation for implementation. Preserve useful archaeology here as WORKS earns it.\n\u003c/script\u003e\n\n\u003cscript type=\"text/plain\" id=\"works-e6-wonder-archaeology\"\u003e\n3D \u00b7 WORKS \u2014 E6.0 / WONDER FIELD\n\nBefore choosing a unified material language, WORKS needs evidence about the kinds of monumental and impossible architecture its wider world can contain. Twenty-five discrete visual structures are therefore placed directly into the existing world as probes: domes, conservatories, towers, gates, reactors, gardens, sanctums, civic-scale landmarks and stranger objects. They are deliberately heterogeneous in material and scale. They are not a Townscaper-like construction grammar, a building catalog, a city generator, or a promise that all twenty-five belong. The building/object is the compositional atom; later urbanism may arrange discrete functional buildings through radial plans, grids, density fields, terrain, logistics and other higher-level planning rules.\n\nThe probes have no gameplay authority. They preserve existing WORKS systems and exist to let human/model inspection discover which silhouettes, transparent volumes, visible interiors, monumental gestures, sparse framing and magical treatments survive at miniature scale. A WONDERS toggle allows comparison against the underlying ecology. WATER can now be toggled independently because water presentation should not prevent inspection of terrain or architecture.\n\nThe important question is not which material wins. It is which kinds of visual ontology are worth carrying forward into a later style-guide / Astra expedition. Failed structures should be discarded cheaply; useful visual mechanisms may be promoted only after inspection.\n\u003c/script\u003e\n\n\u003cscript type=\"text/plain\" id=\"works-handoff-v001-semantics\"\u003e\nWORLD LAB HANDOFF v0.01 \u2014 WORKS QUIET CONTROL SURFACE\nThe inheritance-facing WORKS play strip adds RESET as a fourth persistent bottom control. It invokes the same authoritative RESET WORKS behavior as the laboratory control rather than creating a second reset path. The quiet surface is now WORLD / DEPLOY / PAYLOAD / RESET; deeper laboratory controls remain collapsed and preserved.\n\u003c/script\u003e\n\u003c/body\u003e\u003c/html\u003e\n"},{"id":"living-miniatures","title":"LIVING MINIATURES","kind":"Three.js painterly spatial composition","source":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\"\u003e\n\u003ctitle\u003eLiving Miniatures \u2014 T0.4 Static Painterly Probe\u003c/title\u003e\n\u003cstyle\u003e\nhtml,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9c8c7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}\n#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}\n#hud{position:fixed;left:10px;top:10px;z-index:10;max-width:min(590px,calc(100vw - 20px));padding:8px 13;x^=x\u003e\u003e\u003e17;x^=x\u003c\u003c5;this.s=x\u003e\u003e\u003e0;return this.s/4294967296}range(a,b){return a+(b-a)*this.next()}pick(a){return a[Math.floor(this.next()*a.length)]}}\nfunction hash2(x,y,s=0){let n=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;n^=n\u003e\u003e\u003e13;n=Math.imul(n,1274126177);return((n^(n\u003e\u003e\u003e16))\u003e\u003e\u003e0)/4294967295}function noise(x,y,s=0){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=hash2(ix,iy,s),b=hash2(ix+1,iy,s),c=hash2(ix,iy+1,s),d=hash2(ix+1,iy+1,s);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a,b,u),THREE.MathUtils.lerp(c,d,u),v)}function fbm(x,y,s=0){let v=0,a=.55,f=1;for(let i=0;i\u003c5;i++){v+=a*noise(x*f,y*f,s+i*23);f*=2.07;a*=.47}return v}\nclass Atelier{static texture({seed=1,size=256,base='#777',light='#aaa',dark='#444',grain=1,strokes=25}){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d'),r=new RNG(seed);g.fillStyle=base;g.fillRect(0,0,size,size);for(let i=0;i\u003csize*size*.06*grain;i++){g.globalAlpha=r.range(.025,.15);g.fillStyle=r.next()\u003e.5?light:dark;const x=r.range(0,size),y=r.range(0,size),w=r.range(.4,3.5);g.beginPath();g.ellipse(x,y,w*2.5,w*.55,r.range(0,Math.PI),0,Math.PI*2);g.fill()}g.globalAlpha=.12;g.strokeStyle=dark;for(let i=0;i\u003cstrokes;i++){let x=r.range(-20,size),y=r.range(0,size);g.beginPath();g.moveTo(x,y);for(let k=0;k\u003cr.range(3,8);k++){x+=r.range(8,35);y+=r.range(-8,8);g.lineTo(x,y)}g.stroke()}g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}}\nclass Obj extends THREE.Group{constructor(id,seed){super();this.name=id;this.seed=seed;this.userData.semantic=true}own(o,role){o.name=this.name+':'+role;o.userData.owner=this.name;o.userData.role=role;this.add(o);return o}}\nconst terrainHeight=(x,z)=\u003e2.0+5.2*Math.exp(-((x+17)*(x+17))/9 th.floor(r.range(4,7));for(let i=0;i\u003clevels;i++){const t=i/(levels-1),rad=THREE.MathUtils.lerp(h*.22,h*.055,t)*r.range(.85,1.15),cone=this.own(new THREE.Mesh(new THREE.ConeGeometry(rad,h*.28,5),fol),'crown-'+i);cone.position.y=h*(.33+i*.105);cone.rotation.y=r.range(0,6.28);cone.rotation.z=r.range(-.035,.035);cone.castShadow=true}if(r.next()\u003e.55){const snag=this.own(new THREE.Mesh(new THREE.CylinderGeometry(.025,.035,h*.22,4),trunkMat),'dead-snag');snag.position.set(r.range(-.2,.2),h*.55,r.range(-.2,.2));snag.rotation.z=r.range(-.8,.8)}}}\nclass PineGrove extends Obj{constructor(seed=210){super('pine-grove',seed);const r=new RNG(seed);for(let i=0;i\u003c150;i++){let x=r.range(-54,52),z=r.range(-30,29);if(Math.abs(x)\u003c11\u0026\u0026z\u003e-18\u0026\u0026z\u003c18)continue;if(r.next()\u003c.18){x=r.range(-52,-22);z=r.range(-28,25)}const h=r.range(2.1,6.8),p=new Pine('pine-'+i,seed+i*31,h);p.position.set(x,terrainHeight(x,z),z);p.rotation.y=r.range(0,6.28);this.add(p)}}}\nclass Aqueduct extends Obj{constructor(seed=310){super('aqueduct',seed);const r=new RNG(seed),tex=Atelier.texture({seed,base:'#a99a75',light:'#d3c39a',dark:'#655f4d',grain:1.7,strokes:42});tex.repeat.set(3,3);const mat=new THREE.MeshStandardMaterial({map:tex,color:0xbbaa80,roughness:1});const count=22,span=3.0,pier=.52,depth=1.15,h=7.2;for(let i=0;i\u003c=count;i++){const x=(i-count/2)*span,y=terrainHeight(x,-2.5);const ph=Math.max(1.5,h+4.0-y),m=this.own(new THREE.Mesh(new THREE.BoxGeometry(pier,ph,depth),mat),'pier-'+i);m.position.set(x,y+ph/2,-2.5);m.castShadow=m.receiveShadow=true;if(i%4===0){const butt=this.own(new THREE.Mesh(new THREE.BoxGeometry(1.05,ph*.46,1.7),mat),'buttress-'+i);butt.position.set(x,y+ph*.23,-2.5);butt.castShadow=true}}const deckY=12.1,deck=this.own(new THREE.Mesh(new THREE.BoxGeometry(count*span+2,.72,1.55),mat),'deck');deck.position.set(0,deckY,-2.5);deck.castShadow=true;for(let i=0;i\u003ccount;i++){const tor=new THREE.TorusGeometry(span*.42,.18,5,14,Math.PI),a=this.own(new THREE.Mesh(tor,mat),'arch-band-'+i);a.position.set((i-(count-1)/2)*span,deckY-3.15,-1.91);a.rotation.z=Math.PI;a.castShadow=true}for(let i=0;i\u003c46;i++){if(r.next()\u003c.28)continue;const x=r.range(-count*span/2,count*span/2),g=this.own(new THREE.Mesh(new THREE.BoxGeometry(r.range(.16,.42),r.range(.15,.38),r.range(.12,.3)),mat),'edge-stone-'+i);g.position.set(x,deckY+.47+r.range(-.04,.12),-2.5+r.pick([-1,1])*r.range(.62,.85));g.rotation.set(r.range(-.1,.1),r.range(-.3,.3),r.range(-.1,.1));g.castShadow=true}for(let i=0;i\u003c8;i++){const x=r.range(-29,29),shed=this.own(new THREE.Mesh(new THREE.BoxGeometry(r.range(.8,1.5),r.range(.7,1.4),r.range(.8,1.3)),mat),'repair-hut-'+i);shed.position.set(x,deckY+.7,-2.5+r.pick([-1,1])*1.1);shed.rotation.y=r.range(-.3,.3);shed.castShadow=true}}\n}\nclass TowerCluster extends Obj{constructor(seed=410){super('tower-cluster',seed);const r=new RNG(seed),tex=Atelier.texture({seed,base:'#b9a77f',light:'#dfcea1',dark:'#6b6250',grain:1.2,strokes:30});tex.repeat.set(2,3);const stone=new THREE.MeshStandardMaterial({map:tex,color:0xc1ae84,roughness:1}),roof=new THREE.MeshStandardMaterial({color:0x66513b,roughness:1});for(let i=0;i\u003c7;i++){const x=-30+r.range(-6,7),z=-10+r.range(-6,6),base=terrainHeight(x,z),h=r.range(4.5,9.5),rad=r.range(.8,1.5),body=this.own(new THREE.Mesh(new THREE.CylinderGeometry(rad*.86,rad,h,r.pick([6,7,8])),stone),'tower-'+i);body.position.set(x,base+h/2,z);body.castShadow=true;const cap=this.own(new THREE.Mesh(new THREE.ConeGeometry(rad*1.18,r.range(1.2,2.5),8),roof),'roof-'+i);cap.position.set(x,base+h+r.range(.5,1),z);cap.castShadow=true;for(let w=0;w\u003c3;w++){const ledge=this.own(new THREE.Mesh(new THREE.BoxGeometry(rad*2.2,.16,.25),stone),'ledge-'+i+'-'+w);ledge.position.set(x,base+h*(.28+.18*w),z+rad*.88);ledge.rotation.y=r.range(-.1,.1)}}for(let i=0;i\u003c12;i++){const x=-31+r.range(-9,10),z=-10+r.range(-8,8),y=terrainHeight(x,z),annex=this.own(new THREE.Mesh(new THREE.BoxGeometry(r.range(.8,2.2),r.range(.5,1.8),r.range(.8,2.2)),stone),'annex-'+i);annex.position.set(x,y+annex.geometry.parameters.height/2,z);annex.rotation.y=r.range(0,6.28);annex.castShadow=true}}\n}\nclass RuinScatter extends Obj{constructor(seed=510){super('ruin-scatter',seed);const r=new RNG(seed),tex=Atelier.texture({seed,base:'#8e8265',light:'#b8aa83',dark:'#595548',grain:1.4,strokes:20});const mat=new THREE.MeshStandardMaterial({map:tex,color:0x93866a,roughness:1});for(let i=0;i\u003c85;i++){const x=r.range(-50,50),z=r.range(-27,27);if(r.next()\u003c.5\u0026\u0026Math.abs(x)\u003e25)continue;const y=terrainHeight(x,z),m=this.own(new THREE.Mesh(new THREE.BoxGeometry(r.range(.18,.75),r.range(.25,1.4),r.range(.18,.8)),mat),'masonry-'+i);m.position.set(x,y+r.range(.05,.5),z);m.rotation.set(r.range(-.3,.3),r.range(0,6.28),r.range(-.25,.25));m.castShadow=true}}\n}\nclass Locus extends Obj{constructor(){super('static-painterly-locus',42);this.add(new TerracedHighland());this.add(new PineGrove());this.add(new Aqueduct());this.add(new TowerCluster());this.add(new RuinScatter())}}\nfunction lighting(scene){scene.background=new THREE.Color(0xb9c8c7);const hemi=new THREE.HemisphereLight(0xf2ead3,0x5b5848,1.8);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffd79c,3.7);sun.position.set(-35,48,34);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-75;sun.shadow.camera.right=75;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-45;sun.shadow.bias=-.0004;scene.add(sun);const fill=new THREE.DirectionalLight(0x93afb7,.42);fill.position.set(38,18,-30);scene.add(fill)}\nconst runtime={renderer:null,scene:null,camera:null};const HERO={position:new THREE.Vector3(86,55,105),target:new THREE.Vector3(-2,5,-2)};const view={target:HERO.target.clone(),distance:HERO.position.distanceTo(HERO.target),yaw:0,pitch:0,pointers:new Map(),pinch:null};{const o=HERO.position.clone().sub(HERO.target);view.yaw=Math.atan2(o.x,o.z);view.pitch=Math.asin(o.y/o.length())}\nfunction applyView(){if(!runtime.camera)return;view.distance=clamp(view.distance,35,260);const cp=Math.cos(view.pitch);runtime.camera.position.set(view.target.x+view.distance*Math.sin(view.yaw)*cp,view.target.y+view.distance*Math.sin(view.pitch),view.target.z+view.distance*Math.cos(view.yaw)*cp);runtime.camera.lookAt(view.target);runtime.camera.updateMatrixWorld()}\nfunction panPixels(dx,dy){const cam=runtime.camera;if(!cam)return;const h=innerHeight||1,scale=2*view.distance*Math.tan(THREE.MathUtils.degToRad(cam.fov*.5))/h;const right=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0),up=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1);view.target.addScaledVector(right,-dx*scale).addScaledVector(up,dy*scale);applyView()}\nfunction controls(el){const pinchState=()=\u003e{if(view.pointers.size!==2){view.pinch=null;return}const a=[...view.pointers.values()],dx=a[0].x-a[1].x,dy=a[0].y-a[1].y;return{d:Math.hypot(dx,dy),cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2}};el.addEventListener('pointerdown',e=\u003e{el.setPointerCapture?.(e.pointerId);view.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});view.pinch=pinchState()});el.addEventListener('pointermove',e=\u003e{const prev=view.pointers.get(e.pointerId);if(!prev)return;view.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(view.pointers.size===1){panPixels(e.clientX-prev.x,e.clientY-prev.y)}else if(view.pointers.size===2){const now=pinchState();if(view.pinch\u0026\u0026now){view.distance*=view.pinch.d/Math.max(1,now.d);panPixels(now.cx-view.pinch.cx,now.cy-view.pinch.cy)}view.pinch=now}});const end=e=\u003e{view.pointers.delete(e.pointerId);view.pinch=pinchState()};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('wheel',e=\u003e{e.preventDefault();view.distance*=Math.exp(e.deltaY*.0012);applyView()},{passive:false})}\nfunction resize(){if(!runtime.renderer)return;runtime.renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));runtime.renderer.setSize(innerWidth,innerHeight,false);runtime.camera.aspect=innerWidth/innerHeight;runtime.camera.updateProjectionMatrix();applyView()}\nfunction boot(){try{phase('Three.js \u2713 \u00b7 constructing clean static locus\u2026');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});runtime.renderer=renderer;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;const scene=new THREE.Scene();runtime.scene=scene;lighting(scene);const camera=new THREE.PerspectiveCamera(31,1,.1,500);runtime.camera=camera;applyView();phase('renderer \u2713 \u00b7 realizing semantic objects + owned greebles\u2026');scene.add(new Locus());resize();addEventListener('resize',resize,{passive:true});controls(canvas);phase('static locus \u2713 \u00b7 clean air \u2713 \u00b7 procedural textures \u2713 \u00b7 persistent pan/zoom \u2713');renderer.setAnimationLoop(()=\u003erenderer.render(scene,camera))}catch(e){fail('boot',e)}}boot();\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"living-miniatures-handoff\"\u003e\nLIVING MINIATURES \u2014 T0.4: STATIC PAINTERLY PROBE\n=================================================\nPROJECT STATUS\nBrand-new Living Miniatures lineage. Previous experiments contribute evidence and methodology, not implementation inheritance. This probe intentionally leaves the T0.3 water branch behind rather than polishing it.\n\nCENTRAL THESIS\nCan ordinary static Three.js geometry, using semantic object ownership and visual assets generated entirely inside one HTML artifact, approach the compositional richness of painterly generative raster art?\n\nPROBE BOUNDARY\nT0.4 tests static painterly miniature construction only. No water. No animation. No fog, haze, bloom, depth fade, or atmospheric concealment. The scene must earn depth and richness through geometry, composition, lighting, surface treatment, overlap, silhouette, scale, and density.\n\nVISUAL TARGET\nThe supplied large unbounded fantasy landscape is a north star, not a blueprint. The desired reading is a large, dense little place viewed from far enough away that the eye must work: immediate large-form coherence, partially legible middle-scale structure, and tiny gnarly evidence that resolves only under inspection.\n\nINVARIANTS\n1. All scene-specific textures and visual assets are generated in this HTML. No external images, models, textures, or baked/base64 art. Three.js is the only external runtime dependency.\n2. Visual detail belongs to the semantic object that gives it meaning. Objects own geometry, materials, generated textures, and object-specific greebling grammars.\n3. Shared helpers (Atelier, RNG, noise) provide operations, never object-level art direction.\n4. Detail density is an object property. Greebles are seeded semantic elaboration, not global decorative noise.\n5. Characteristic process remains part of object identity, but this probe is deliberately static so motion cannot rescue weak appearance.\n6. No atmospheric cheat until the clean scene looks good. Fog comes later as flavor, not structural support.\n7. The hero view is a starting composition, not a prison. Drag pans and pinch/wheel zooms. Inspection state persists exactly where the user leaves it; there is no automatic snap-back.\n8. Fail visibly. Startup/runtime failures must remain diagnosable in-artifact.\n\nSEMANTIC OWNERSHIP IN THIS PROBE\nTerracedHighland owns the landmass, rock surface language, and physical outcrop scatter.\nPine owns individual tree realization and small branch/snag irregularity. PineGrove owns ecological placement and hierarchy.\nAqueduct owns its long structural rhythm, piers, arch bands, buttresses, edge stones, repair accretions, and stone surface language.\nTowerCluster owns towers, roofs, ledges, annex accretion, and architectural clustering.\nRuinScatter owns sparse masonry evidence embedded through the locus.\n\nMETHOD LESSON \u2014 GREEBLES\nPainterly generated images often obtain richness from huge numbers of tiny plausible assertions. Living Miniatures wants the same effect, but as spatial evidence. The important unit is not a perfect inspectable prop; it is a seeded grammar of ledges, repairs, roots, stones, annexes, broken edges, branches, roofs, stairs, etc. At hero distance many should collapse to a few pixels and contribute density/history/scale before literal legibility.\n\nMETHOD LESSON \u2014 SCALE\nDetail is built above the resolution at which it will normally be viewed. T0.4 is intentionally much larger than T0.0\u2013T0.3 and the hero camera is pulled far back. If the scene only works while individual trees dominate the screen, the painterly-miniature hypothesis has not been tested.\n\nRETAINED WATER LESSONS (NOT ACTIVE HERE)\nT0.1 showed procedural ribbon geometry can read convincingly as falling water. T0.3 showed that independently rendered water forms can still fail if containment, shared substance identity, and boundary geometry are absent. Water is a hard coupled problem and is frozen as a side branch until static painterly quality is established.\n\nSUCCESS CRITERION\nJudge the screenshot first. Does the clean static hero view begin to read as a dense painterly miniature rather than a low-poly game scene? If not, spend complexity on object silhouette, value grouping, geometric density, generated surface language, lighting, and composition before adding simulation or atmosphere.\n\nNEXT DECISION\nInspect the render at hero scale and by persistent pan/zoom. Identify which object family most damages the painterly reading and improve that object's own realization rather than applying a scene-wide cosmetic patch.\n\u003c/script\u003e\n\u003c/body\u003e\u003c/html\u003e\n"},{"id":"reality-weather","title":"3D \u00b7 REALITY \u2192 WEATHER","kind":"3D Planar / Data Reconstruction","source":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\"\u003e\n\u003ctitle\u003eWorld Lab \u2014 Reality Weather T1\u003c/title\u003e\n\u003cstyle\u003e\nhtml,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none}\n#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}\n#hud{position:fixed;left:10px;top:10px;z-index:10;max-width:min(690px,calc(100vw - 20px));padding:8px 10px;border:1px solid #d8cfb23b;border-radius:9px;background:#10161be8;color:#eee7d7;font-size:10px;line-height:1.35;box-shadow:0 4px 18px #0008}\n#hud b{font-size:11px;letter-spacing:.05em}#status{opacity:.8;margin-top:3px}#readout{opacity:.68;margin-top:3px}\n.row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}button{border:1px solid #d8cfb23b;background:#171d21;color:#ddd7c8;border-radius:6px;padding:6px 9px;font:700 10px ui-monospace,monospace}\nbutton.on{background:#ddd3b9;color:#16191b}#evidence{position:fixed;left:10px;bottom:10px;z-index:8;width:min(660px,calc(100vw - 20px));height:82px;border:1px solid #d8cfb225;border-radius:8px;background:#0c1116d9}\n#note{position:fixed;right:10px;bottom:9px;color:#e8e0cc99;font-size:9px;text-align:right;pointer-events:none}\n#fault{display:none;position:fixed;z-index:100;left:10px;right:10px;bottom:105px;max-height:45vh;overflow:auto;white-space:pre-wrap;background:#351717;color:#ffd2c8;border:1px solid #ff8c78;padding:12px;border-radius:8px;font:12px/1.4 ui-monospace,monospace}\n\u003c/style\u003e\n\u003cscript\u003e\n(function(){function fail(scope,e){const f=document.getElementById('fault');if(f){f.style.display='block';f.textContent=scope+'\\n'+(e\u0026\u0026e.stack||e)}}window.__RW_FAIL__=fail;addEventListener('error',e=\u003efail('startup/runtime',e.error||e.message));addEventListener('unhandledrejection',e=\u003efail('unhandled promise',e.reason));})();\n\u003c/script\u003e\u003c/head\u003e\u003cbody\u003e\n\u003ccanvas id=\"stage\"\u003e\u003c/canvas\u003e\n\u003cdiv id=\"hud\"\u003e\u003cb\u003eREALITY \u2192 WEATHER \u00b7 T1 LATENT RECONSTRUCTION\u003c/b\u003e\n\u003cdiv id=\"status\"\u003eKORD severe passage \u00b7 19:30\u201322:00 local \u00b7 45 second loop\u003c/div\u003e\n\u003cdiv id=\"readout\"\u003e\u003c/div\u003e\u003cdiv class=\"row\"\u003e\u003cbutton id=\"t1\" class=\"on\"\u003eT1 LATENT WORLD\u003c/button\u003e\u003cbutton id=\"t0\"\u003eT0 LITERAL BASELINE\u003c/button\u003e\u003cbutton id=\"restart\"\u003eREPLAY\u003c/button\u003e\u003cbutton id=\"pause\"\u003ePAUSE\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\n\u003ccanvas id=\"evidence\"\u003e\u003c/canvas\u003e\n\u003cdiv id=\"note\"\u003edrag to orbit \u00b7 wheel to inspect\u003cbr\u003eT1: record has no renderer access\u003c/div\u003e\u003cpre id=\"fault\"\u003e\u003c/pre\u003e\n\u003cscript type=\"module\"\u003e\nimport * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';\ntry {\nconst OBS=[{\"m\":0,\"t\":25,\"d\":21,\"wd\":220,\"w\":9,\"g\":14,\"v\":10,\"p\":1008.5,\"c\":0.72,\"ceil\":6000,\"r\":0,\"wx\":\"\"},{\"m\":120,\"t\":24,\"d\":21,\"wd\":220,\"w\":8,\"g\":13,\"v\":10,\"p\":1008.0,\"c\":0.68,\"ceil\":7000,\"r\":0,\"wx\":\"\"},{\"m\":240,\"t\":23,\"d\":21,\"wd\":210,\"w\":7,\"g\":12,\"v\":8,\"p\":1007.8,\"c\":0.76,\"ceil\":5000,\"r\":0.03,\"wx\":\"-RA\"},{\"m\":360,\"t\":23,\"d\":21,\"wd\":210,\"w\":8,\"g\":14,\"v\":10,\"p\":1008.2,\"c\":0.7,\"ceil\":6000,\"r\":0,\"wx\":\"\"},{\"m\":480,\"t\":25,\"d\":21,\"wd\":220,\"w\":9,\"g\":16,\"v\":10,\"p\":1008.4,\"c\":0.55,\"ceil\":8000,\"r\":0,\"wx\":\"\"},{\"m\":600,\"t\":28,\"d\":21,\"wd\":230,\"w\":11,\"g\":19,\"v\":10,\"p\":1007.9,\"c\":0.48,\"ceil\":10000,\"r\":0,\"wx\":\"\"},{\"m\":720,\"t\":30,\"d\":21,\"wd\":240,\"w\":12,\"g\":21,\"v\":10,\"p\":1007.0,\"c\":0.44,\"ceil\":11000,\"r\":0,\"wx\":\"\"},{\"m\":840,\"t\":31,\"d\":21,\"wd\":250,\"w\":13,\"g\":23,\"v\":10,\"p\":1006.1,\"c\":0.5,\"ceil\":9000,\"r\":0,\"wx\":\"\"},{\"m\":960,\"t\":31,\"d\":22,\"wd\":250,\"w\":14,\"g\":25,\"v\":10,\"p\":1005.3,\"c\":0.62,\"ceil\":7000,\"r\":0,\"wx\":\"\"},{\"m\":1080,\"t\":30,\"d\":22,\"wd\":250,\"w\":13,\"g\":24,\"v\":10,\"p\":1004.8,\"c\":0.72,\"ceil\":5500,\"r\":0,\"wx\":\"\"},{\"m\":1170,\"t\":29,\"d\":22,\"wd\":250,\"w\":14,\"g\":27,\"v\":10,\"p\":1004.5,\"c\":0.82,\"ceil\":4000,\"r\":0.05,\"wx\":\"VCTS\"},{\"m\":1215,\"t\":28,\"d\":22,\"wd\":250,\"w\":18,\"g\":32,\"v\":6,\"p\":1004.1,\"c\":0.92,\"ceil\":2500,\"r\":0.25,\"wx\":\"TSRA\"},{\"m\":1235,\"t\":27,\"d\":22,\"wd\":260,\"w\":31,\"g\":65,\"v\":1.5,\"p\":1003.6,\"c\":1.0,\"ceil\":1200,\"r\":1.15,\"wx\":\"+TSRA\"},{\"m\":1255,\"t\":25,\"d\":22,\"wd\":290,\"w\":25,\"g\":48,\"v\":2.5,\"p\":1004.6,\"c\":1.0,\"ceil\":900,\"r\":0.85,\"wx\":\"+TSRA\"},{\"m\":1280,\"t\":24,\"d\":21,\"wd\":300,\"w\":18,\"g\":34,\"v\":5,\"p\":1006.0,\"c\":0.96,\"ceil\":1500,\"r\":0.35,\"wx\":\"RA\"},{\"m\":1320,\"t\":23,\"d\":21,\"wd\":300,\"w\":14,\"g\":26,\"v\":7,\"p\":1007.3,\"c\":0.9,\"ceil\":2200,\"r\":0.12,\"wx\":\"-RA\"},{\"m\":1380,\"t\":22,\"d\":20,\"wd\":300,\"w\":11,\"g\":20,\"v\":10,\"p\":1008.5,\"c\":0.72,\"ceil\":4500,\"r\":0,\"wx\":\"\"},{\"m\":1440,\"t\":22,\"d\":20,\"wd\":300,\"w\":10,\"g\":18,\"v\":10,\"p\":1009.2,\"c\":0.62,\"ceil\":6000,\"r\":0,\"wx\":\"\"}];\nconst WINDOW0=1170,WINDOW1=1320,PLAY_SECONDS=45;\nconst canvas=document.getElementById('stage'),ev=document.getElementById('evidence'),readout=document.getElementById('readout');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;\nconst scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,1,.5,9000);camera.position.set(760,390,820);\nconst hemi=new THREE.HemisphereLight(0xcfe4ff,0x49453a,1.15);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffe5bd,1.7);scene.add(sun);\nconst ground=new THREE.Mesh(new THREE.PlaneGeometry(3600,2600),new THREE.MeshStandardMaterial({color:0x65735b,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);\nconst grid=new THREE.GridHelper(3000,30,0x4f5b51,0x4f5b51);grid.material.opacity=.10;grid.material.transparent=true;scene.add(grid);\n\n// Situated virtual station. It measures the world; it does not own it.\nconst station=new THREE.Group();scene.add(station);\nconst metal=new THREE.MeshStandardMaterial({color:0xd6d2c5,metalness:.4,roughness:.55});\nconst pole=new THREE.Mesh(new THREE.CylinderGeometry(2.2,3.4,76,8),metal);pole.position.y=38;station.add(pole);\nconst cross=new THREE.Mesh(new THREE.BoxGeometry(44,2,2),metal);cross.position.y=69;station.add(cross);\nconst vane=new THREE.Mesh(new THREE.ConeGeometry(5,22,5),new THREE.MeshStandardMaterial({color:0xb54d35}));vane.rotation.z=-Math.PI/2;vane.position.set(18,73,0);station.add(vane);\n\n// Distance witnesses make station visibility measurable rather than a fog knob.\nconst landmarks=[];const lmMat=new THREE.MeshStandardMaterial({color:0x59625c,roughness:.95});\nfor(let i=0;i\u003c56;i++){const a=i/56*Math.PI*2,r=260+(i%10)*145,h=25+(i*41%125);const q=new THREE.Mesh(new THREE.BoxGeometry(15+(i%4)*8,h,15+(i%3)*9),lmMat);q.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);q.userData.range=r;scene.add(q);landmarks.push(q);}\n\n// Generic latent atmosphere: moving parcels. Names intentionally avoid meteorological ontology.\n// Renderer reads ONLY parcel state in T1.\nconst N=72,parcels=[];\nfor(let i=0;i\u003cN;i++){const a=i*2.399,r=130+(i%13)*105;parcels.push({\n x:Math.cos(a)*r,z:Math.sin(a)*r,y:90+(i%9)*48,\n mass:.15+((i*37)%100)/100*.5, drift:.25+((i*61)%100)/100*.5,\n fall:.05+((i*29)%100)/100*.3, span:120+(i%7)*38\n});}\nconst cloudGroup=new THREE.Group();scene.add(cloudGroup);const cloudMeshes=[];\nfor(let i=0;i\u003cN;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(1,10,7),new THREE.MeshLambertMaterial({color:0xd8dcdd,transparent:true,depthWrite:false,opacity:.12}));m.scale.set(parcels[i].span,34+(i%5)*9,parcels[i].span*.62);cloudGroup.add(m);cloudMeshes.push(m);}\n\nconst rainN=700,rainPos=new Float32Array(rainN*3),rainGeom=new THREE.BufferGeometry();rainGeom.setAttribute('position',new THREE.BufferAttribute(rainPos,3));\nconst rainMat=new THREE.PointsMaterial({color:0xc7e0e5,size:2.1,transparent:true,opacity:.5,depthWrite:false});const rain=new THREE.Points(rainGeom,rainMat);scene.add(rain);\nconst reeds=[];const reedGeo=new THREE.BoxGeometry(1.7,31,1.7),reedMat=new THREE.MeshStandardMaterial({color:0x9a9a70});\nfor(let i=0;i\u003c90;i++){const r=new THREE.Mesh(reedGeo,reedMat),a=i*2.399,rad=100+(i%18)*35;r.position.set(Math.cos(a)*rad,15.5,Math.sin(a)*rad);scene.add(r);reeds.push(r);}\n\n// Target evidence is accessible ONLY to the reconstructor + comparison strip.\nfunction lerpAngle(a,b,t){let d=((b-a+540)%360)-180;return(a+d*t+360)%360}\nfunction targetAt(min){let i=0;while(i\u003cOBS.length-2\u0026\u0026OBS[i+1].m\u003cmin)i++;const A=OBS[i],B=OBS[Math.min(i+1,OBS.length-1)],u=Math.max(0,Math.min(1,(min-A.m)/(B.m-A.m||1)));return{m:min,wd:lerpAngle(A.wd,B.wd,u),w:A.w+(B.w-A.w)*u,g:A.g+(B.g-A.g)*u,v:A.v+(B.v-A.v)*u,r:A.r+(B.r-A.r)*u,ceil:A.ceil+(B.ceil-A.ceil)*u,wx:u\u003c.5?A.wx:B.wx}}\n\n// Latent controller: target evidence may adjust generic parcel state, but renderer cannot read target.\n// This is deliberately a tiny inverse model, not a weather simulator.\nlet latent={flowX:0,flowZ:0,energy:.18,loading:.12,scatter:.08,lift:.42};\nfunction reconstruct(t,dt){\n const dir=t.wd*Math.PI/180,targetFX=Math.sin(dir)*(t.g/65),targetFZ=Math.cos(dir)*(t.g/65);\n const desiredEnergy=Math.min(1,t.g/65),desiredLoading=Math.min(1,t.r/1.15),desiredScatter=Math.min(1,1-t.v/10);\n latent.flowX+=((targetFX-latent.flowX)*.85)*dt;latent.flowZ+=((targetFZ-latent.flowZ)*.85)*dt;\n latent.energy+=(desiredEnergy-latent.energy)*.7*dt;latent.loading+=(desiredLoading-latent.loading)*.8*dt;latent.scatter+=(desiredScatter-latent.scatter)*.7*dt;\n // Ceiling evidence pressures parcel vertical distribution, but does not directly position visible cloud geometry.\n const desiredLift=Math.max(.08,Math.min(.85,t.ceil/7000));latent.lift+=(desiredLift-latent.lift)*.45*dt;\n}\n\n// Virtual station derives observations from latent world state.\nfunction sensor(){\n const speed=Math.hypot(latent.flowX,latent.flowZ),gust=Math.min(70,speed*65*(.72+.28*latent.energy));\n const wd=(Math.atan2(latent.flowX,latent.flowZ)*180/Math.PI+360)%360;\n const rainRate=Math.max(0,(latent.loading-.12))*1.34;\n const visibility=10*Math.exp(-latent.scatter*2.05-latent.loading*.62);\n let weightedY=0,w=0;for(const p of parcels){const near=Math.exp(-(p.x*p.x+p.z*p.z)/(2*520*520))*p.mass;weightedY+=p.y*near;w+=near;}\n const ceil=Math.max(500,(weightedY/(w||1))*7.5);\n return{wd,w:speed*42,g:gust,v:Math.max(.3,Math.min(10,visibility)),r:rainRate,ceil};\n}\nfunction renderLatent(s,dt){\n scene.fog=new THREE.FogExp2(0x75818a,.00010+latent.scatter*.0011+latent.loading*.00035);scene.background=new THREE.Color(0x75818a);\n hemi.intensity=.45+(1-latent.loading)*.8;sun.intensity=.3+(1-latent.loading)*1.0;\n for(let i=0;i\u003cN;i++){const p=parcels[i];p.x+=latent.flowX*(12+p.drift*15)*dt;p.z+=latent.flowZ*(12+p.drift*15)*dt;\n   p.y+=((70+latent.lift*620)-p.y)*(.06+p.drift*.035)*dt;\n   if(p.x\u003e1500)p.x=-1500;if(p.x\u003c-1500)p.x=1500;if(p.z\u003e1100)p.z=-1100;if(p.z\u003c-1100)p.z=1100;\n   const m=cloudMeshes[i];m.position.set(p.x,p.y,p.z);m.material.opacity=.05+latent.loading*.34+p.mass*.14;m.material.color.setHex(latent.loading\u003e.58?0x858b90:0xd8dcdd);\n }\n vane.rotation.y=-Math.atan2(latent.flowX,latent.flowZ);reeds.forEach(r=\u003e{r.rotation.z=latent.flowX*.52;r.rotation.x=latent.flowZ*.52;});\n const active=Math.floor(rainN*Math.min(1,Math.max(0,latent.loading-.1)*1.18));rain.visible=active\u003e0;\n for(let i=0;i\u003crainN;i++){const j=i*3;if(i\u003e=active){rainPos[j+1]=-100;continue}const q=((i*73)%997)/997,q2=((i*193)%991)/991,phase=(elapsed*(135+latent.energy*155)+q2*900)%900;rainPos[j]=(q-.5)*1200+latent.flowX*phase*.5;rainPos[j+1]=900-phase;rainPos[j+2]=(q2-.5)*1000+latent.flowZ*phase*.5;}rainGeom.attributes.position.needsUpdate=true;\n return s;\n}\n\n// Preserved negative control: direct evidence -\u003e presentation mapping.\nfunction renderLiteral(t,dt){\n const vis=Math.max(.1,Math.min(1,t.v/10)),dir=t.wd*Math.PI/180;\n scene.background=new THREE.Color(0x66737c);scene.fog=new THREE.FogExp2(0x66737c,.00012+(1-vis)*.0024);\n hemi.intensity=.45;sun.intensity=.45;\n cloudMeshes.forEach((m,i)=\u003e{m.position.x=parcels[i].x;m.position.z=parcels[i].z;m.position.y=Math.max(75,Math.min(800,t.ceil*.075))+(i%5)*18;m.material.opacity=.12+Math.min(1,t.r+t.g/100)*.35;});\n vane.rotation.y=-dir;reeds.forEach(r=\u003e{r.rotation.z=Math.sin(dir)*Math.min(.7,t.g/65);r.rotation.x=Math.cos(dir)*Math.min(.7,t.g/65);});\n const active=Math.floor(rainN*Math.min(1,t.r));rain.visible=active\u003e0;for(let i=0;i\u003crainN;i++){const j=i*3;if(i\u003e=active){rainPos[j+1]=-100;continue}const q=((i*73)%997)/997,q2=((i*193)%991)/991,phase=(elapsed*240+q2*900)%900;rainPos[j]=(q-.5)*1200;rainPos[j+1]=900-phase;rainPos[j+2]=(q2-.5)*1000;}rainGeom.attributes.position.needsUpdate=true;\n}\n\nlet mode='t1',elapsed=0,paused=false,last=performance.now();\nfunction evidenceStrip(t,s){\n const dpr=Math.min(devicePixelRatio,2),w=ev.clientWidth,h=ev.clientHeight;if(ev.width!==w*dpr||ev.height!==h*dpr){ev.width=w*dpr;ev.height=h*dpr}const c=ev.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);\n c.font='9px ui-monospace,monospace';c.fillStyle='#e8e0ccb0';c.fillText('TARGET  \u2500\u2500\u2500    VIRTUAL SENSOR  \u00b7\u00b7\u00b7',9,13);\n const rows=[['VIS',t.v,s.v,0,10],['GUST',t.g,s.g,0,70],['RAIN',t.r,s.r,0,1.2]];\n rows.forEach((r,k)=\u003e{const y=28+k*17;c.fillStyle='#e8e0cc55';c.fillText(r[0],9,y+3);const x0=55,x1=w-12,tx=x0+(x1-x0)*(r[1]-r[3])/(r[4]-r[3]),sx=x0+(x1-x0)*(r[2]-r[3])/(r[4]-r[3]);c.strokeStyle='#e8e0cc88';c.beginPath();c.moveTo(x0,y);c.lineTo(Math.max(x0,Math.min(x1,tx)),y);c.stroke();c.fillStyle='#e8e0cc';c.fillRect(tx-2,y-2,4,4);c.fillStyle='#8fc5d0';c.fillRect(sx-2,y-2,4,4);});\n}\nfunction resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();\nlet target=new THREE.Vector3(0,110,0),yaw=.72,pitch=.36,dist=1120,drag=null;\nfunction placeCamera(){camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist,target.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(target)}placeCamera();\ncanvas.addEventListener('pointerdown',e=\u003e{drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture?.(e.pointerId)});\ncanvas.addEventListener('pointermove',e=\u003e{if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.006;pitch=Math.max(.08,Math.min(1.15,pitch+(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY;placeCamera()});\ncanvas.addEventListener('pointerup',()=\u003edrag=null);canvas.addEventListener('pointercancel',()=\u003edrag=null);\ncanvas.addEventListener('wheel',e=\u003e{e.preventDefault();dist=Math.max(420,Math.min(2600,dist*Math.exp(e.deltaY*.001)));placeCamera()},{passive:false});\nfunction setMode(m){mode=m;document.getElementById('t1').classList.toggle('on',m==='t1');document.getElementById('t0').classList.toggle('on',m==='t0');elapsed=0;latent={flowX:0,flowZ:0,energy:.18,loading:.12,scatter:.08,lift:.42}}\ndocument.getElementById('t1').onclick=()=\u003esetMode('t1');document.getElementById('t0').onclick=()=\u003esetMode('t0');document.getElementById('restart').onclick=()=\u003esetMode(mode);\ndocument.getElementById('pause').onclick=()=\u003e{paused=!paused;document.getElementById('pause').textContent=paused?'RESUME':'PAUSE'};\nfunction frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)elapsed=(elapsed+dt)%PLAY_SECONDS;const min=WINDOW0+(elapsed/PLAY_SECONDS)*(WINDOW1-WINDOW0),t=targetAt(min);\n let s;if(mode==='t1'){reconstruct(t,dt);s=sensor();renderLatent(s,dt)}else{renderLiteral(t,dt);s={wd:t.wd,w:t.w,g:t.g,v:t.v,r:t.r,ceil:t.ceil}}\n evidenceStrip(t,s);readout.textContent=`${String(Math.floor(min/60)).padStart(2,'0')}:${String(Math.floor(min%60)).padStart(2,'0')} \u00b7 target vis ${t.v.toFixed(1)}mi gust ${t.g.toFixed(0)}kt rain ${t.r.toFixed(2)} \u00b7 sensor vis ${s.v.toFixed(1)} gust ${s.g.toFixed(0)} rain ${s.r.toFixed(2)}`;\n renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);\n} catch(e) {window.__RW_FAIL__('module startup',e)}\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"reality-weather-semantics\"\u003e\nREALITY \u2192 WEATHER \u2014 T1 / WORLD \u2192 SENSOR\n\nT0 IS PRESERVED AS NEGATIVE CONTROL\nThe first pass mapped observations directly into presentation: reported ceiling moved visible\ncloud geometry, visibility controlled fog, precipitation controlled rain, and wind controlled\nsusceptible objects. It produced a coherent animated weather chart and exposed the category\nerror: situated observations were mistaken for world state.\n\nT1 QUESTION\nCan a hidden world be adjusted so that a virtual situated sensor reproduces real evidence,\nwithout allowing the renderer to read that evidence directly?\n\nSHORT PROBE\nUse the already-established KORD 15 Jul 2024 severe passage, 19:30\u201322:00 local, compressed\nto a 45-second loop. Start with visibility, gust/wind, and precipitation as reconstruction\npressure. Ceiling is allowed to pressure the latent vertical distribution but is not rendered\nas cloud-Y.\n\nOWNERSHIP / AUTHORITY\nREAL RECORD: target evidence only.\nRECONSTRUCTOR: may read target evidence and alter generic latent state.\nLATENT WORLD: generic moving parcels + flow/loading/scatter/lift/energy; these names are\nworking capacities, not claims of recovered meteorological ontology.\nRENDERER: T1 may read latent world only. It may not read ASOS observations.\nVIRTUAL STATION: reads latent world and emits synthetic visibility, wind/gust, rain, ceiling.\nCAMERA: independent inspector; never the station.\n\nVISIBLE COMPARISON\nThe lower strip is intentionally diagnostic: target evidence versus virtual-station evidence.\nIt is not world state. Once reconstruction becomes credible it can be hidden for observation.\n\nSUCCESS CRITERION\nNot visual prettiness and not exact numerical fit. The probe succeeds if representational\nmachinery becomes reusable: freeze it, change the real day, and reconstruct by changing\nlatent state rather than rewriting the renderer.\n\nMETHOD CHANGE\nThis is reconstruction-before-invention made operational:\nREAL EVIDENCE \u2192 INVERSE PRESSURE \u2192 LATENT WORLD \u2192 VIRTUAL SENSOR \u2192 COMPARISON.\nThe latent machinery, if it generalizes, is the candidate source of semantically earned knobs\nfor later impossible/fantasy regimes.\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e"},{"id":"visual-machinery","title":"3D \u00b7 VISUAL MACHINERY","kind":"Distant Miniature / Semantic Expansion","source":"\u003c!doctype html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"\u003e\u003ctitle\u003eVisual Machinery \u00b7 T1\u003c/title\u003e\n\u003cstyle\u003e\n*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202c31;color:#eee5d1;font:11px/1.5 ui-monospace,monospace}#c{display:block;width:100%;height:100%;touch-action:none}button,select,input{font:inherit;color:inherit;background:#243138;border:1px solid #a6b5ac55;border-radius:6px;min-height:38px;padding:6px 9px}button{cursor:pointer}button:hover,button.on{background:#b7b59b;colo
