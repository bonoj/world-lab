l(sig^hash(JSON.stringify(a)),16777619);}mesh.instanceMatrix.needsUpdate=true;mesh.computeBoundingSphere();owned.get(owner).add(mesh);}\n signature=(sig\u003e\u003e\u003e0).toString(16);buildMS=Math.round(performance.now()-start);syncUI();highlight();draw();\n}\nfunction highlight(){if(outline){scene.remove(outline);outline.geometry.dispose();outline.material.dispose();outline=null}if(owned.has(selected)){outline=new THREE.BoxHelper(owned.get(selected),'#9bbec1');outline.material.transparent=true;outline.material.opacity=.48;outline.material.depthTest=true;scene.add(outline)}}\nfunction syncUI(){const n=state.nodes.find(n=\u003en[0]===selected);$('owner').innerHTML='';for(const a of state.nodes){const opt=document.createElement('option');opt.value=a[0];opt.textContent=a[0]+(records[a[0]]?'':' \u00b7 absent');$('owner').append(opt)}$('owner').value=selected;$('material').value=n[4];$('age').value=n[5];$('ageValue').value=n[5].toFixed(1);$('lift').value=n[6]?.lift||0;$('liftValue').value=String(n[6]?.lift||0);$('presence').textContent=n[6]?.off?'Restore owner':'Remove owner';$('mode').textContent=full?'Machinery ON':'Masses ONLY';$('mode').classList.toggle('on',!full);$('seed').textContent='Seed '+state.seed+' +1';$('program').textContent='seed '+state.seed+' / '+state.ground+'\\n'+state.nodes.map(n=\u003e{const [id,op,s,rel,mat,age,edit]=n;return id+': '+op+' '+JSON.stringify(s)+' '+JSON.stringify(rel)+' '+mat+' age='+age+(edit?.lift?' lift='+edit.lift:'')+(edit?.off?' OFF':'')}).join('\\n');}\nfunction draw(){renderer.render(scene,camera);$('status').textContent=(full?'MATERIAL WORLD':'SEMANTIC MASSES')+' \u00b7 '+Object.keys(records||{}).length+' owners \u00b7 '+instances+' instances \u00b7 '+renderer.info.render.calls+' draws \u00b7 '+buildMS+'ms build \u00b7 '+signature;}\nfunction guard(fn){return(...args)=\u003e{try{fn(...args)}catch(e){vmFail('experiment',e)}}}\nfunction edit(fn){const n=state.nodes.find(n=\u003en[0]===selected);fn(n);rebuild()}\n$('tools').onclick=()=\u003e{$('panel').classList.toggle('open');$('tools').setAttribute('aria-expanded',String($('panel').classList.contains('open')))};\n$('preset').onchange=guard(()=\u003e{state=structuredClone(presets[$('preset').selectedIndex]);selected=state.nodes[0][0];rebuild()});\n$('mode').onclick=guard(()=\u003e{full=!full;rebuild()});$('owner').onchange=guard(()=\u003e{selected=$('owner').value;syncUI();highlight();draw()});$('cycle').onclick=guard(()=\u003e{selected=state.nodes[(state.nodes.findIndex(n=\u003en[0]===selected)+1)%state.nodes.length][0];syncUI();highlight();draw()});\n$('material').onchange=guard(()=\u003eedit(n=\u003en[4]=$('material').value));$('age').onchange=guard(()=\u003eedit(n=\u003en[5]=+$('age').value));$('age').oninput=()=\u003e{$('ageValue').value=$('age').value};$('lift').onchange=guard(()=\u003eedit(n=\u003e{n[6]||={};n[6].lift=+$('lift').value}));$('lift').oninput=()=\u003e{$('liftValue').value=$('lift').value};$('presence').onclick=guard(()=\u003eedit(n=\u003e{n[6]||={};n[6].off=!n[6].off}));$('seed').onclick=guard(()=\u003e{state.seed++;rebuild()});$('reset').onclick=guard(()=\u003e{state=structuredClone(presets[$('preset').selectedIndex]);selected=state.nodes[0][0];rebuild()});$('home').onclick=guard(()=\u003e{view.target.set(0,2,0);view.yaw=.62;view.pitch=.52;view.distance=55;applyView();draw()});\nconst pointers=new Map();let last=null,tap=null;const canvas=$('c');function gesture(){const a=[...pointers.values()];if(!a.length)return null;return{x:a.reduce((s,p)=\u003es+p.x,0)/a.length,y:a.reduce((s,p)=\u003es+p.y,0)/a.length,d:a.length\u003e1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0,n:a.length}}\nfunction pan(dx,dy){const scale=2*view.distance*Math.tan(16*Math.PI/180)/innerHeight;view.target.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),-dx*scale);view.target.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1),dy*scale)}\ncanvas.addEventListener('pointerdown',e=\u003e{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last=gesture();tap=pointers.size===1?{x:e.clientX,y:e.clientY,id:e.pointerId}:null});\ncanvas.addEventListener('pointermove',guard(e=\u003e{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const g=gesture();if(tap\u0026\u0026Math.hypot(e.clientX-tap.x,e.clientY-tap.y)\u003e5)tap=null;if(last\u0026\u0026g.n===last.n){const dx=g.x-last.x,dy=g.y-last.y;if(g.n\u003e1){pan(dx,dy);if(g.d\u003e0\u0026\u0026last.d\u003e0)view.distance*=last.d/g.d}else if(e.shiftKey||e.buttons===2)pan(dx,dy);else{view.yaw-=dx*.006;view.pitch+=dy*.004}applyView();draw()}last=g}));\ncanvas.addEventListener('pointerup',guard(e=\u003e{if(tap\u0026\u0026tap.id===e.pointerId){const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);const hit=ray.intersectObject(root,true)[0];if(hit\u0026\u0026hit.object.userData.owner!=='ground'){selected=hit.object.userData.owner;syncUI();highlight();draw()}}pointers.delete(e.pointerId);last=gesture();tap=null}));\nfor(const type of ['pointercancel','lostpointercapture'])canvas.addEventListener(type,e=\u003e{pointers.delete(e.pointerId);last=gesture();tap=null});canvas.addEventListener('contextmenu',e=\u003ee.preventDefault());canvas.addEventListener('wheel',guard(e=\u003e{e.preventDefault();view.distance*=Math.exp(clamp(e.deltaY,-150,150)*.002);applyView();draw()}),{passive:false});addEventListener('resize',guard(resize));\nstate=structuredClone(presets[0]);selected=state.nodes[0][0];rebuild();resize();window.vmReady=true;clearTimeout(window.vmWatch);\n// Small inspection surface for reproducibility/automation, not a host API or save contract.\nwindow.vmInspect=()=\u003e({state:structuredClone(state),camera:{target:view.target.toArray(),yaw:view.yaw,pitch:view.pitch,distance:view.distance},signature,instances,owners:Object.keys(records),drawCalls:renderer.info.render.calls,geometries:renderer.info.memory.geometries,buildMS,full,ready:window.vmReady});\n} catch(e) {clearTimeout(window.vmWatch);vmFail('module / startup',e);}\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"visual-machinery-semantics\"\u003e\nVISUAL MACHINERY \u2014 T1 / SMALL PROGRAM, OWNED MATERIAL CONSEQUENCES\nCENTRAL QUESTION\nCan masses + relations + material + condition produce coherent distant richness, without a finished-object catalog? This pass tests the lower half of prose -\u003e program -\u003e world. No prose ingestion, inference, generated imagery, raster scene assets, or dependencies on other labs.\n\nACTUAL VOCABULARY\nEach line is [id, operation, dimensions, relation, material, age, optional edit]. The displayed program is a readable serialization of the actual authoritative tuples, not a decorative paraphrase. Dimensions are width/height/depth. mass uses a center position; stack rests on parent top; cap is a triangular prism resting on parent top; attach uses [parent, side \u00b11]; span uses ordered [left anchor, right anchor], deriving its width and height from their bounds. span dimension x=0 means inferred, not zero-width mesh. stone spans realize an arch, other materials realize braced beams. Presets are data only. Suspended court has no dedicated generator. Scene ground is either an island or a channel; these finite composition priors are explicit semantic input, not an inferred ecology.\nMATERIAL REGIONS\nstone: dark mortar core + stagger-free irregular courses and coping; timber: panels + dark posts and belts; copper: large patinated panels. cap: shared pitched silhouette, overlapping courses, ridge, fascia. span: shared arch spandrel or braced deck, partial parapet losses. Openings use projecting frames and dark fields, not Boolean cutouts. age controls clustered stains, missing surface pieces, edge dislocation, attached foliage and debris. No structural stability simulation. Aged cores remain intact; damage is surface/parapet damage, not arbitrary volumetric fracture.\n\nOWNERSHIP / DETERMINISM\nTuples and seed own world state. Topologically ordered relationships resolve in a single pass. Removing an owner suppresses all transitive dependents; restoring it restores them. Lift offsets the selected owner in world Y and propagates through relationships. A lifted attachment can float: this is an intentional relation probe, not physics. A span uses the lower anchor top rather than tilting, so lifting one anchor need not move the span until it becomes the limiting anchor. Each owner's RNG uses scene seed + stable id, preventing edits from shuffling unrelated owners. Draw batches retain owner id, material region and shape; CPU raycast maps an instance to that owner. ground owns terrain, shoreline and ripples. No hidden random calls, animated world time, or camera-dependent population generation. Observer state never regenerates the world. Host cold-mount still resets lab state by original host contract.\n\nVIEWING BAND\n32-degree vertical perspective; minimum orbit radius 55 world units in landscape, 55/aspect in portrait to preserve horizontal scene footprint. Maximum 2.7 times that radius. Typical world width 25, hero footprint around half the landscape width; structure details roughly subpixel to a few pixels. Zoom cannot enter asset inspection distance. Orbit, pan, material changes, mode switches, reseeding, reset and preset selection preserve observer state; Home is the sole explicit pose reset. Resize enforces the distance band only when necessary. Mouse orbit, Shift/right drag pan, wheel zoom; one-finger orbit, two-finger centroid pan + pinch. Static render-on-demand, no continuous render loop.\n\nMECHANISMS / TRANSFER HYPOTHESES\n- Shared surface subdivision with material-specific proportions creates several visual scales from one mass. Applies to all non-cap/non-span masses across presets; transferable candidate, not yet proof across arbitrary prose.\n- Large silhouette + middle-scale courses + fine world-space pigment modulation avoids relying on noise alone. Shader is procedural arithmetic, no sampled images.\n- Dark core under discrete cladding, coping light edges, and directional shadows strengthen contact/readability. Reusable across masonry/timber/copper; openings remain an illusion at grazing angles.\n- Owner-local aging and colonization cluster consequences on their source instead of scattering unrelated decorations. Cheap transferable surface grammar, not ecology or growth simulation.\n- Caps, arch edges and broken parapets carry silhouette information while shader grain carries only pigment. Instancing per owner/material/shape bounds draw calls; shared geometry/materials survive rebuilds and generated geometries are disposed.\n\nCOMPARISON / LIMITS / ARCHAEOLOGY\nMasses mode preserves primary silhouettes, terrain support and lighting but removes details and substitutes neutral material. Water remains a common stage. This measures the aggregate material/detail contribution, not an isolated ablation of each mechanism. It does not remove the semantic roof/arch primitives themselves. Outline is an observer diagnostic.\nNo visual-model calls were used for construction or validation. Perceptual success still needs human inspection. Tiny near-coplanar window fields and moss are distant-view approximations. Terrain is a bounded cluster of coarse rocks, not continuous height-field geology. Arch remains structurally whole beneath damaged parapets. World-space shader phase changes when a parent moves; geometry RNG remains parent stable. Topological tuples are trusted built-in data, not a general parser/editor. CDN Three.js is required, consistent with sibling labs; failed load, script parse, shader compilation, WebGL loss and runtime exceptions surface through independent bootstrap, watchdog and guarded controls. CDN absence is a reported failure, not an offline fallback.\n\nVALIDATION EVIDENCE \u2014 FIRST PASS\nHeadless Chromium 153 / software WebGL: all three presets started without script or shader errors. Fixed-seed detail -\u003e masses -\u003e detail restored identical world signatures; reset restored each preset. Owner material/age/lift edits, transitive remove/restore and repeat reseeding executed. Preset instance counts 2236 / 1902 / 2207; main render draw counts 40 / 50 / 49. Twelve successive reseeds left geometry allocation count at 7. Build times in this test were roughly 9\u201330ms, not an Android benchmark. 390px touch emulation verified orbit, two-finger pan/pinch and camera preservation through comparison. UI stayed within viewport width. Host navigation retained one active iframe and successfully cold-mounted back. Forced CDN rejection and injected module syntax failure both produced visible lab diagnostics. All original lab sources and host bytes were checked unchanged; every embedded executable script was parsed separately. Raster capture had nonempty scene variation, but no visual-model inspection or beauty rating was performed.\nThe environment's browser could not directly fetch CDN modules; runtime tests routed exact Three.js 0.180.0 bytes downloaded from the specified CDN into the browser. Production HTML retains the CDN import. Network portability and actual Android GPU performance remain user-device checks. No claimed external service fallback.\n\nPROJECT BOUNDARY\nThe host and the five earlier labs remain unchanged. No renderer, material, entity, camera or state framework is shared. No new collaboration method is claimed. Preserve this semantic surface as the experiment learns.\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e\n"},{"id":"orbital-construction","title":"3D \u00b7 ORBITAL CONSTRUCTION","kind":"Three.js / Modular Orbital Construction Toy","source":"\u003c!doctype html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\"\u003e\n\u003ctitle\u003eOrbital Construction \u2014 E2 Construction Vocabulary\u003c/title\u003e\n\u003cstyle\u003ehtml,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010204;touch-action:none}canvas{display:block;touch-action:none}#reset{position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff38;background:#10151caa;color:#ddd;font:21px system-ui;z-index:3} \n\n#selection{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);\npadding:7px 11px;border:1px solid #ffffff28;border-radius:8px;background:#0c1118c9;color:#e7ebef;\nfont:12px/1.2 system-ui;letter-spacing:.04em;z-index:4;opacity:0;pointer-events:none;transition:opacity .12s}\n#selection.show{opacity:1}\n#fault{position:fixed;left:10px;bottom:10px;color:#ffb36b;font:11px system-ui;z-index:9;pointer-events:none}\n\n\n#controls{position:fixed;left:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100vw - 92px);z-index:3}\n#controls button{height:44px;padding:0 14px;border-radius:22px;border:1px solid #ffffff38;background:#10151caa;color:#ddd;font:12px system-ui;letter-spacing:.08em;white-space:nowrap}\n\n#xp-top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;align-items:center;pointer-events:none}#xp-top\u003e*{pointer-events:auto}#xp-top select,#xp-top button,#xp-panel button,#xp-panel select{font:11px system-ui;color:#e4e8e9;background:#101b25eb;border:1px solid #ffffff38;border-radius:7px;min-height:38px;padding:6px 9px;max-width:100%}#xp-top .on{background:#3d5960}#xp-panel{display:none;position:fixed;top:57px;left:10px;width:355px;max-width:calc(100vw - 20px);max-height:calc(100dvh - 160px);overflow:auto;touch-action:pan-y;background:#101923f5;color:#d5dfe3;border:1px solid #83959e77;border-radius:9px;padding:11px;box-sizing:border-box;z-index:6;font:11px/1.5 system-ui}#xp-panel.open{display:block}.xp-row{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}#xp-panel select{flex:1;min-width:110px}#xp-readout{font:10px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow:auto;padding:8px;background:#080f16}#xp-status{font:10px system-ui;opacity:.8}#xp-panel button:disabled{opacity:.35}#fault{display:none;z-index:99;left:10px;right:10px;bottom:75px;max-height:45%;overflow:auto;pointer-events:auto;background:#351b1bf5;border:1px solid #d98565;border-radius:6px;padding:12px;white-space:pre-wrap}#selection{top:auto;bottom:76px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#controls{gap:5px;left:10px;bottom:10px;max-width:calc(100vw - 70px)}#controls button{height:40px;font-size:10px;padding:0 10px}#reset{right:10px;bottom:10px}button{cursor:pointer}@media(max-width:430px){#xp-top{gap:4px}#xp-top select,#xp-top button{font-size:10px;padding:5px 6px}#xp-compose{max-width:170px!important}}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003cdiv id=\"xp-top\"\u003e\u003cselect id=\"xp-compose\" aria-label=\"Composition\"\u003e\u003coption value=\"habitat\"\u003eAccreted habitation\u003c/option\u003e\u003coption value=\"yard\"\u003eOrbital construction yard\u003c/option\u003e\u003coption value=\"radial\"\u003eRadial junction network\u003c/option\u003e\u003coption value=\"bench\"\u003eSingle-module bench\u003c/option\u003e\u003coption value=\"archive\"\u003eOriginal V1.65 station\u003c/option\u003e\u003c/select\u003e\u003cbutton id=\"xp-tools\" aria-expanded=\"false\"\u003eModules \u25be\u003c/button\u003e\u003cbutton id=\"xp-ports\"\u003ePorts\u003c/button\u003e\u003cbutton id=\"xp-home\"\u003eHome\u003c/button\u003e\u003c/div\u003e\n\u003csection id=\"xp-panel\"\u003e\u003cb\u003eORBITAL CONSTRUCTION \u00b7 E2\u003c/b\u003e\u003cdiv class=\"xp-row\"\u003e\u003cselect id=\"xp-owner\" aria-label=\"Selected semantic module\"\u003e\u003c/select\u003e\u003cbutton id=\"xp-solo\"\u003eIsolate\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"xp-row\"\u003e\u003cselect id=\"xp-port\" aria-label=\"Selected interface\"\u003e\u003c/select\u003e\u003c/div\u003e\u003cdiv class=\"xp-row\"\u003e\u003cselect id=\"xp-kind\" aria-label=\"Module vocabulary\"\u003e\u003c/select\u003e\u003c/div\u003e\u003cdiv class=\"xp-row\"\u003e\u003cbutton id=\"xp-add\"\u003eAttach at port\u003c/button\u003e\u003cbutton id=\"xp-study\"\u003eStudy unattached\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"xp-row\"\u003e\u003cbutton id=\"xp-detach\"\u003eDetach branch\u003c/button\u003e\u003cbutton id=\"xp-nudge\"\u003eMove +X\u003c/button\u003e\u003cbutton id=\"xp-roll\"\u003eRoll joint 90\u00b0\u003c/button\u003e\u003c/div\u003e\u003cpre id=\"xp-readout\"\u003e\u003c/pre\u003e\u003cdiv id=\"xp-status\"\u003e\u003c/div\u003e\u003cp\u003eTap a module to inspect. Drag to orbit; pinch to zoom. Shift-drag / two-finger drag to pan. Detail and Texture are independent. Amber: free pressure port. Blue: free structural port. Green: joined.\u003c/p\u003e\u003cp\u003eBuilt-in isolation hatches keep free pressure interfaces sealed. Terminations are separate one-port modules. Attach rejects incompatible or occupied ports. Assembly edits preserve the observer; Home frames the result. Room 001 remains the preserved interior probe.\u003c/p\u003e\u003c/section\u003e\n\u003cdiv id=\"selection\"\u003e\u003c/div\u003e\u003cdiv id=\"fault\"\u003e\u003c/div\u003e\u003cbutton id=\"reset\" aria-label=\"Reset view\"\u003e\u21ba\u003c/button\u003e\u003cdiv id=\"controls\"\u003e\u003cbutton id=\"greeble\" aria-label=\"Toggle detail\"\u003eDETAIL ON\u003c/button\u003e\u003cbutton id=\"texture\" aria-label=\"Toggle texture\"\u003eTEXTURE ON\u003c/button\u003e\u003cbutton id=\"interior\" aria-label=\"Enter interior\"\u003eINTERIOR\u003c/button\u003e\u003c/div\u003e\n\u003cscript type=\"text/plain\" id=\"orbital-e2-semantics\"\u003eORBITAL CONSTRUCTION \u2014 E2 / VISUAL MACHINERY EXPEDITION\nCURRENT CONTRACT (supersedes implementation-specific portions of the preserved V0\u2013V1.65 archaeology below)\n\nQUESTION\nCan a small set of semantic construction families produce materially different, rich orbital facilities, while every component is complete when unattached and every connection remains explicit? The reference images supplied construction evidence: pressure shells versus open frames, inhabited glazing, working decks, lifting/receiving equipment, routed services and multiple visual frequencies. They are not runtime assets or traced layouts. This implementation uses geometry, procedural shader surfaces and existing procedural textures only; no image generation or inference service.\n\nPRESERVED\nThe existing World Lab host and all six unrelated lab sources are untouched. Within Orbital, the original exterior remains under Original V1.65 station. Its module IDs and older stationToy API survive. Room 001, its unresolved metric containment, human-scale look/bounded dolly, lander, containment sequencing, cargo hierarchy and orrery/alignment detector remain implemented. Original lighting is restored when observing the archive or interior. Detail and Texture retain separate meanings. The full earlier semantic/development record remains verbatim after this document. It is archaeology, not a demand to preserve weak rendering mechanisms.\n\nNEW MODULE CONTRACT\nA module owns a finished shell/frame, its generated detail, per-module surface state, named local ports and optional local practical lights. Unattached pressure modules have real built-in closed isolation hatches. These valves are intrinsic manufactured anatomy, not anonymous endcap modules added to conceal holes. Connected pressure ports remain coupled/isolated: the joint is a sealed union, not a claim that a door has opened or pressure has equalized. Explicit one-port termination modules add function beyond that intrinsic closure. The exterior graph represents sealed pressure boundaries; it is not a traversable internal floor plan or pressure-flow simulation.\n\nPORTS / SNAPPING\nEvery port stores a local position, outward unit normal, canonical tangent frame, interface family, size and occupancy. Standard pressure radius = .48; wide pressure = .8; frame half-width = .42. The scale adapter joins standard to wide; the communal volume accepts the wide interface at its aft end. Pressure collar contact planes and frame plates are authored in these same frames, with hardware behind the plane. Small bolt protrusion is mating hardware, not stray detail.\nSnapping aligns full frames with opposite normals, coincident contact points and an optional roll. It does not derive topology from mesh overlap. Type/size mismatches, occupied ports, self-links, multiple incoming constraints and cycles are rejected before a pose change. Stations currently form directed assembly forests: each child has one incoming joint; loops/multi-anchor constraint solving are deliberately unsupported. Descendants follow a detached/reconnected or rolled branch rigidly while retaining stable IDs. Moving a connected child independently is rejected. UI Detach moves the branch 1.6 units along its former parent-port normal to expose the now-independent interfaces.\nPressure ports include sleeved collars, seating rings, isolation hatch and repeated fastening hardware. Structural interfaces have square plates, corner fixtures and backing stems. Platform edge corridors deliberately omit rail segments opposite docking faces. Detail placement uses oriented, shape-aware bounding envelopes sampled along the long axis against finite port exclusion cylinders; unsafe whole pieces are rejected, not clipped through sockets. This protects local intended interfaces, not arbitrary world-space neighbors.\n\nVOCABULARY \u2014 37 NAMED KINDS IN SEVEN REALIZATION FAMILIES\nJunctions: elbow, tee, wye, orthogonal cross, six-axis cross (four lateral + poles), radial-six, octagon (eight lateral + poles). A junction is explicitly named; no leftover mesh is promoted into topology. Octagon uses an eight-sided chamber whose face apothem and port radius agree. Junctions also offer one structural mounting interface.\nPressure: arm, long-arm; scale adapter is its own realization family.\nHabitation: short-drum, long-drum, compact pod, industrial workshop, observation, greenhouse, communal, utility. Their distinctions include elliptical/round versus box shells, panoramic glazed bays with actual shallow interior geometry, planted trays, workshop window rhythms, communal scale and external utility tanks. Round and rectangular forms have different envelope-derived frame/detail rules.\nWork platforms: yard, cargo-dock, service-dock, receiving, crane-platform, equipment, airlock-platform. Load rails, receiving shoes, cargo restraint geometry, service banks, tank racks, entry steps and crane foundations distinguish function. Equipment and cargo here are module-owned consequences, not independent simulated actors.\nStructure: open truss, pylon, beam, service-frame. Shared repeated stations derive rails, crossmembers and diagonal bracing; beams add a load-bearing web.\nMachines: articulated crane, handling gantry, instrument mast. These are complete, selectable modules with structural foot interfaces. Crane boom/cable/hook/counterweight and gantry hoist have explicit geometry but no new articulated animation or load simulation.\nTerminations: sealed bulkhead, observation endcap, airlock, docking termination, service termination. Each has exactly one pressure port. The docking termination's exposed capture hardware is not a second station-construction port in this pass.\n\nTHREE COMPOSITIONAL TESTS\nAccreted habitation: 25 modules, 24 explicit connections; wide adapter/communal annex, industrial workshop, greenhouse, long habitat, observation tower, secondary junction, cargo spur and deliberate terminations.\nConstruction yard: 17 modules, 16 connections; receiving gantry, central crane, cargo and service wings, pylon/service frame, instrument mast and sparse pressure architecture.\nRadial network: 21 modules, 20 connections; octagon with T/Y/vertical/radial branches, cross and elbow routes plus a small inhabited terminus. These are add/connect programs using the same catalog, not separate scene generators.\nSingle-module bench: any catalog kind alone, with its ports unoccupied. This is an executable test of the module contract. Isolate hides neighbors for observer inspection without changing occupancy; use the bench or Detach to inspect truly unattached state.\n\nLAYERS / OWNERSHIP\nModule roots are transform/semantic objects. Form is split between pressure and structural layers according to function/material region. Detail is independent optional construction evidence. Surface state is independent of both. Merged meshes retain owner ID, region and layer; the station is never merged into one opaque mesh. Existing setDetail / setFrame / setTexture handles remain, and stationToy.expedition exposes catalog, registry, links, make, connect, detach, moveBranch, inspect and composition. Ports are module-local even when the complete module is rotated. inspect() emits plain graph/pose/port data plus alignment and resource metrics.\n\nMACHINERY THAT TRANSFERS\n1. Envelope-first realization: round service lanes follow curvature; rectangular lanes follow flat faces. Frame bands, mounting offsets and detail placements consume the same dimensions. Applying cylindrical bands to box habitats initially produced intersecting/floating frames; this was replaced, not accepted as decoration.\n2. Protected interface corridors: port geometry, exclusion regions and working-platform rail gaps share one semantic interface. Detail cannot claim space simply because the surface has room for another object.\n3. Manufactured frequency hierarchy: primary pressure volumes/open spans; middle bands, cross-braces, window bays, receiving rails and routed services; fine panels, fasteners, replacement-tone variation and directional scuff marks. Detail OFF retains meaningful structure and functional silhouettes.\n4. Procedural object-local surfaces: antialiased panel rhythm, seams, fastener fields, plate variation and restrained marks. Region-specific surface scales distinguish hull, deck and frame. Fields move with module geometry. Texture OFF removes these treatments but leaves physical beams, windows, ribs, cables and beveled geometry intact.\n5. Shared bevel primitive gives small housings/decks/crates edge response without unique meshes. Curved profile primitives and repeated stations produce more material variation with few geometry rules.\n6. Local glazed compartments: transparent sides, opaque envelope, floor, plants/furniture and a local practical light preserve parallax and sparse warm inhabited evidence. No scene image behind the window.\n7. Ownership-preserving batching: shared authoring primitives are transformed/merged per owner + layer + material region. This reduces thousands of independent detail objects while retaining selection and per-module layers. Geometry/materials are disposed on composition replacement. Fixed module IDs seed any variation.\n8. Static exterior rendering and cached directional shadows: camera/UI/world changes mark the exterior dirty; the renderer sleeps between changes. Interior toys keep their existing animation loop. Pixel ratio is capped at 1.5. No required postprocessing. The shadow frustum is bounded to the vicinity of supplied compositions; very large custom extensions may outgrow its high-quality coverage.\n\nOBSERVER / INTERACTION\nExterior orbit/pinch behavior remains; Shift/right drag and two-finger centroid pan are added. Two-finger cancellation releases gesture state. Tap selects semantic owners, including generated detail. Hidden archive/isolated modules are excluded from selection. All assembly edits, Detail, Texture and isolation preserve camera state. Composition replacement and explicit Home frame the new view; Home fits per-module bounds rather than the empty corners of one enormous assembly AABB. Interior entry/exit preserves the earlier situated camera contract and exterior pose. No world transform represents observer motion. UI controls wrap and the module panel scrolls within narrow displays.\n\nPERFORMANCE / COMPROMISES\nExterior complexity is approximately 86k\u2013146k merged triangles in the supplied scenes, plus hardware hatches and the sparse background; no per-frame procedural regeneration. Software Chromium renders reported roughly 124\u2013234 draw calls, with cached shadows. These are test-environment observations, not an Android performance guarantee. The original exterior/interior remain resident CPU-side as archaeology, though hidden and unrendered outside their view. A 60-module UI assembly cap bounds interactive growth; programmatic consumers must remain responsible for budgets.\nNo global collision solver, automatic rerouting, multibody load simulation, articulated crane controls, cyclic assembly solver or full pressure interior generation is included. A locally valid snap can put another branch through nearby architecture; inspect composition after recombination. Major primitive shells are intentionally economical; bevels and service grammar improve manufactured read but do not reproduce the reference images' fine realism. Transparent glazing is conventionally sorted, not order-independent. Shader treatment is color/material evidence, not geometric displacement. Existing interior layout is preserved as its own unresolved probe, not automatically assigned to each new habitat.\n\nFAILURE ARCHAEOLOGY / VALIDATION\nFirst runtime checks caught: a .48 versus .42 structural-port default mismatch; GLSL's reserved word `patch`; and a preset consuming a Y junction's already-used input. All were corrected. These were startup/runtime faults that a JavaScript parse check alone would not catch. They are preserved here as evidence for explicit interface typing, shader compilation checks and occupancy validation.\nAn independent classic bootstrap reports module parse/load/runtime failures. A watchdog reports startup stalls; WebGL context loss is visible. Optional expansion-construction errors restore the earlier exterior where possible. Surface-shader failures request a retry with plain materials and leave diagnostics visible. Dependency/module parse failure cannot execute the base lab and is reported rather than disguised as a fallback. CDN Three.js 0.180.0 remains the sole renderer dependency.\nHeadless Chromium 153/software WebGL validated all compositions and all 37 standalone types, sealed unused pressure ports, finite transforms, clean startup/shader compilation, exact port mating (errors below 2e-15 world units), independent comparison layers, branch mutation/reconnection, occupied/type/cycle rejection, preservation of the room/toy handles, responsive 390px controls, and stable geometry allocations through repeated rebuilds. Browser testing used exact pinned CDN bytes routed locally because this execution environment's browser fetch path is restricted; actual user-device network and Android GPU behavior remain field tests. Supplied image references were authoring-time evidence only.\n\nNEXT EVIDENCE\nInspect unfamiliar combinations on the bench and in the graph. Stronger local surface routing, collision-aware branch placement or a useful articulated machine should be earned by those observations. Do not replace this with an encyclopedia of scene-specific finished stations. Preserve the earlier archaeology below while revising this current semantic surface with actual findings.\n\nFINAL SUCCESS-CONDITION REVIEW\n1. Same semantic project, stronger construction vocabulary: preserved legacy station/room/toy handles and added 37 named types through shared realization families.\n2. Strong form without optional layers: inspected the habitat composition with Detail/Texture comparison; all compositions share the same independent layers. Pressure envelopes, trusses, crane/gantry, collars, rails and inhabited bays remain geometry.\n3\u20134. Organized detail and manufactured surfaces: curved/flat service lanes, access routes, repeated fixtures, plate rhythm and physical bevels supply distinct scales. The pass improves construction legibility; its economical geometry and restrained wear remain below the references' fine realism.\n5. Required family coverage: all junction, habitat, working-space, structural and five one-port termination families are available in the bench/catalog, including the eight-lateral-plus-two-pole hub and usable standard/wide adapter.\n6\u20138. Independent completeness and clean interfaces: all 37 bench types passed finite geometry, free-port and sealed-hatch checks. A separate audit of generated detail vertex positions found no intrusion into the protected local port regions for any kind. Explicit joints maintain coincident planes/opposed normals; no neighbor is needed to seal a free pressure interface.\n9\u201310. Transfer and manipulation: three distinct shared-vocabulary programs; attach/roll/detach/move/reconnect tested with descendant preservation. Observer changes leave graph data unchanged. Isolated inspection now follows a newly selected owner instead of leaving the old module visible.\n11. Responsiveness: touch orbit, pinch and pan exercised in Chromium touch emulation; narrow portrait and landscape control wrapping inspected. Module panel height derives from both wrapped header and footer bounds, avoiding overlap. Actual Android hardware performance remains unmeasured; no claim of a device benchmark.\n12. Preservation: byte comparison confirmed unchanged host code/project surfaces, all six unrelated lab entries, the complete prior semantic archaeology and the original Room 001/lander/orrery implementation block.\n13. Visible failures: deliberately blocked renderer dependency, injected module parse fault, injected optional construction exception and actual shader compile failure all produced diagnostics. Optional construction restored the base; shader failure rendered with plain surfaces. The first meaningful error cancels the watchdog so its diagnostic is not later overwritten by a generic timeout.\n14. Continuity: this current document records implementation, ownership, contracts, evidence, known limits and corrected failures; the earlier archaeology remains intact after it. No new cross-lab architecture or collaboration method was introduced.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"v0-spec\"\u003eORBITAL CONSTRUCTION TOY \u2014 V0 INSPECTION SUBSTRATE\n\nPURPOSE\nA mobile-first Three.js executable conversational artifact. V0 asks only:\nDoes holding and inspecting this little modular station feel good?\n\nMETHOD\nconversation \u2192 executable \u2192 direct manipulation \u2192 observation \u2192 conversation \u2192 bounded modification \u2192 next executable.\nThe visual station is replaceable; the semantically addressable station graph is valuable.\n\nVISUAL LANGUAGE\nOpen black space, sparse stars, strong distant sun. Small incomplete asymmetrical constructed station. Cool white/light grey hulls, dark mechanical structure, orange framework, scarce warm amber inhabited interiors. No finished O'Neill cylinder and no monolithic spacecraft silhouette.\n\nSEMANTIC STRUCTURE\nStationRoot\n\u251c\u2500 Spine / stable segments\n\u251c\u2500 Workshop / Hull / Glass / Interior / Desk / Shelf / Light / AttachmentNodes\n\u251c\u2500 Habitat_A / Hull / Glass / Interior / AttachmentNodes\n\u251c\u2500 ReceivingYard / Platform / Framework / AttachmentNodes\n\u251c\u2500 Crane_A / Base / Boom / EndNode\n\u251c\u2500 Truss modules\n\u2514\u2500 AttachmentNodes\n\nMeaningful modules receive stable IDs and deliberately small metadata. Attachment nodes are explicit transforms and semantic addresses. Do not prematurely encode economy, crafting, damage, engineering or narrative ontology.\n\nHABITAT PARALLAX\nWarm windows contain actual shallow geometry behind transparent glass: floor, rear wall, crude furniture/equipment and warm local light. Orbiting shifts window frames against interior objects and those objects against rear surfaces. FAR: warm inhabited point. MEDIUM: compartment. CLOSE: there is a room in there. Same orbital camera; no ENTER button.\n\nTOUCH\nOne-finger drag orbits broadly around the station. Pinch zoom spans tiny-station-in-space through close inspection of habitat glass. Avoid camera roll and frustrating inertia. Pan not required. Small reset-view affordance.\n\nPERFORMANCE\nContemporary mobile target. Primitive/reused geometry and materials, modest mesh count, inexpensive lights, conservative transparency, no required postprocessing. Responsive portrait/landscape canvas.\n\nOUT OF SCOPE\nBooks/prose, Clara, materials, inventory, cargo, construction tools, crafting, economy, objectives, progression, damage, physics simulation, station management, save UI, complete cylinder, procedural generation, narrative, tutorial, labels, selection outlines, semantic UI, elaborate HUD.\n\nPRESERVE FOR LATER, DO NOT IMPLEMENT\nModule selection and mutation; object attachment; receiving materials at ReceivingYard; interior placement; persistence; multiple locations; scale transitions; orbital-to-interior inspection; prose-derived construction.\n\nSUCCESS\nUser discovers drag and pinch without instruction, peers into warm rooms, understands those rooms spatially within the larger station, and keeps manipulating the station despite having no objective.\n\nV0 IS AN INSPECTABLE PLACE, NOT A GAME.\nBuild enough station to make inspection interesting, enough interior to make closeness rewarding, and enough semantic structure that future conversation has handles. Then stop. Touch it. The experience determines V1.\n\nV1 DELTA \u2014 2026-09-21\n- Orthogonal construction grammar for now; radial capability preserved but not exercised.\n- Curved pressure-hull language for inhabited modules.\n- No black metal: structural darks become readable greys.\n- Long primary beams extend from central structure.\n- Nothing structural should visually float; modules receive visible load paths/collars.\n- Physical attachment hardware corresponds to semantic attachment nodes.\n- Greebling is a separate toggleable layer with varied greys; interiors remain independent.\n- Greebles are subordinate to large readable structural forms.\n\n\nV1.65 ORRERY ALIGNMENT LATCH\nThe toy now notices one property of its own moving configuration. Three restrained brass sights and an ivory latch tile have been added at the center. While the orrery is turning, the detector derives each body's actual current world-space direction from the center and compares pairwise angular separation. If any pair enters a seven-degree alignment tolerance, the ivory tile physically pops up with a tiny kick. A wider twelve-degree release threshold provides hysteresis so the mechanism does not chatter at the boundary. This is geometric observation, not a timer.\nThe tile carries no label and no assigned interpretation. It records only that the machine recognized a configuration. Existing clipping, displaced button, floating collapsed spindle, and collapsed-body squashing remain untouched.\nRule: the toy may respond to relationships it physically exhibits without yet explaining those relationships.\n\nV1.64 ORRERY LOCAL CYCLES\nThe second toy receives one conceptual upgrade only. Each of its three bodies is no longer fixed to the end of a rotating arm. Each arm endpoint now carries a small tilted local orbit mechanism, with a restrained brass track and an independently moving body. The three local periods are deliberately incommensurate and one runs retrograde, so relationships drift and occasional alignments can emerge while the common armature continues its slow rotation. No purpose, labels, projection, lighting system, or additional controls have been assigned.\nThe observed floating collapsed spindle and displaced physical button are intentionally left untouched in this pass.\nRule: the machine now expresses relationships, not merely rotation.\n\nV1.63 SECOND TOY SEED \u2014 ORRERY\nThe preserved pallet lander is translated carefully to the left side of the workbench without changing its internal geometry, flight state machine, containment sequence, or Y-axis flight semantics.\nA new independent tabletop toy, Orrery Seed 001, begins on the right. It intentionally carries very little interpretation: a compact brass base, central spindle, three folded articulated arms, three materially distinct bodies, and one physical control. Pressing the control deploys the spindle/arms and begins a slow turn; pressing again folds it. Whether it is a model, instrument, navigator, or something else remains unresolved.\nRule: transfer the toy-building grammar, not the lander's ontology.\n\nV1.62 ELECTRICAL-OFF BEFORE MECHANICAL-STOW\nShutdown ordering is now explicit. When the lander settles, semantic containment drops and the membrane performs its full double shutdown flicker while the mast and canopy remain completely deployed and motionless. Only after the second flicker has finished and the field is fully dark does the emitter transition into STOWING and begin canopy contraction / mast collapse.\nRule: electrical field shutdown completes before mechanical emitter stow begins.\n\nV1.61 SYMMETRIC BLISTER FLICKER\nThe blister now uses the same terse double-flicker vocabulary at both ends of its cycle: two establishment flashes before stable activation, and two dying flashes after containment deactivates. Semantic containment authority still begins only after startup flicker completes and drops immediately before shutdown flicker begins.\n\nV1.60 BLISTER IGNITION FLICKER\nThe air blister now has a deliberately tiny electrical establishment/failure cue. After the emitter mast and canopy finish deploying, the membrane flashes on/off twice before becoming continuously active. Those preview flashes are visual only: the semantic containment state remains CHARGING and the flight interlock does not treat the blister as established until the final continuous activation.\nOn shutdown, containment authority drops immediately and the membrane gives two brief dying after-flashes while the mechanical emitter begins stowing.\nThe effect is intentionally terse\u2014two startup coughs, one shutdown cough\u2014not a looping animation or new gameplay system.\n\nV1.59 HAIRLINE EMITTER GAP\nThe V1.58 separation between canopy and membrane was visually too large. The membrane top is raised back to within a hairline of the emitter canopy, retaining only enough spatial separation to avoid the previous additive/near-coplanar material collision. No other blister or lander behavior changed.\n\nV1.58 BLISTER EMITTER GAP\nThe energy membrane and its edge were meeting the telescoping canopy too closely, producing noisy additive/near-coplanar material interactions at the top of the blister. The field's upper boundary is lowered slightly while the physical canopy remains unchanged, creating a small clean separation between emitter hardware and projected containment. The canopy glow is also shifted slightly below the physical panel.\nNo field material, deployment behavior, cargo, or flight behavior changed.\n\nV1.57 ENERGY MEMBRANE AIR BLISTER\nThe V1.56 particle cloud failed to communicate containment because it removed the continuous inside/outside boundary that made the earlier glass version immediately legible.\nThe original containment geometry is visible again, but no longer uses glass-like transmission, thickness, or refraction. It is now an extremely faint additive blue membrane. A brighter additive edge is derived directly from the same envelope geometry, so activation reads as an instantaneous luminous boundary: pop, the volume is enclosed.\nThe free-floating field particles and their shimmer animation are removed entirely. The canopy retains a restrained stronger blue glow as the visible source of the field.\nRule: containment is communicated by a continuous boundary; energy styling modifies that boundary rather than replacing it with volumetric activity.\n\nV1.56 DIFFUSE AIR BLISTER\nThe air blister no longer renders as a transparent glass-like solid pane. Its existing extruded geometry is retained invisibly as the semantic containment envelope, while the visible field is now a sparse shell of soft additive blue procedural sprites concentrated around the perimeter and chamfered shoulders.\nThe field is intentionally diffuse and low-energy: cargo remains clearly readable through it. A restrained brighter blue strip immediately beneath the deployed canopy communicates the emitter source. Field particles have only a very slow low-amplitude local shimmer rather than a global pulse.\nBlister deployment/state semantics are unchanged: the diffuse field appears only when containment is active and disappears before the emitter mechanically stows.\n\nV1.55 STEADY PRIMARY DRIVE\nThe primary exhaust no longer breathes, accelerates, or decelerates during hover. Particle travel now uses one constant recycle rate, and hover uses one constant visual plume strength. The value is deliberately near the middle of the previous slow/fast impression.\nThis removes animation complexity that was not earning its keep at the fidelity of the surrounding toy. Flight motion and station-keeping behavior are unchanged.\n\nV1.54 QUIETER PRIMARY DRIVE\nThe primary lift plume is slimmer and substantially calmer. Its emitter radius, sprite size, particle count, opacity, and commanded thrust-visual strength are reduced. Hover no longer drives a rapid high-energy oscillation; it uses a low-amplitude slow variation instead.\nParticle advection is also slowed dramatically. Importantly, increasing visual thrust strength no longer makes particles race faster: stronger output now slightly slows the recycled particle travel, producing a steadier sustained plume rather than a frantic one. Lift and landing are toned down as well, while the actual lander motion/state timing is unchanged.\nThis is a visual-energy correction only; propulsion mechanics remain identical.\n\nV1.53 TAPERED SAFE-ENVELOPE THRUST\nScreenshot inspection established two desired visual/functional properties from the earlier solid-cone pass. First, the plume silhouette should taper away from the nozzle rather than expand: particles now begin broad, dense, bright, and relatively large at the nozzle mouth, then progressively narrow, shrink, fade, and become sparse downrange. Second, the four station-keeping jets deliberately cant downward and inward toward the lander's protected central plume envelope rather than outward toward surrounding dockworkers or infrastructure.\nThe explicit semantic exhaust-origin/direction architecture from V1.52 is retained; only the authored vectors and particle distribution changed. Thus direction remains independent of incidental nozzle mesh orientation while preserving the useful original vehicle design.\nRule refined: explicit semantic direction describes intended operational geometry; particle distribution describes the visible plume silhouette.\n\nV1.52 EXPLICIT EXHAUST VECTORS\nThe two sign-flip failures exposed the actual modeling error: exhaust direction was being inferred from incidental mesh/local-cylinder orientation. Thrusters now own explicit semantic exhaust origins and directions.\nThe center booster exhaust originates at its bell mouth and points straight down in lander-local space. Each station-keeping exhaust originates just outside its corner nozzle and points down plus radially outward from the vehicle center.\nParticle systems are parented to the lander and construct their own perpendicular cone basis from those semantic vectors, so nozzle mesh rotations cannot invert or redirect the exhaust. Existing propulsion timing and flight behavior remain unchanged.\nRule promoted: directional effects derive from explicit semantic direction, not incidental render-mesh orientation.\n\nV1.51 THRUSTER AXIS CORRECTION\nVisual inspection showed every particle exhaust cone traveling in the opposite direction from its nozzle. The particle emitter had assumed local -Y while this lander's thruster geometry is authored with exhaust along local +Y. Particle travel is now flipped to local +Y for both the center booster and all four canted station-keeping thrusters. No propulsion logic, pulse timing, or vehicle motion changed.\n\nV1.50 DIFFUSE PARTICLE THRUST\nThe lander's geometric cone plumes remain in the artifact as disabled fallback geometry, but propulsion now renders through a procedural particle exhaust system.\nA small CanvasTexture radial sprite supplies a blue-white emissive-looking particle vocabulary. The center lift engine emits a dense narrow cone of camera-facing particles: brightest and tightest at the nozzle, widening and fading with travel. Particle motion is deterministic and continuously recycled rather than allocated per frame.\nThe four canted station-keeping thrusters use the same emitter vocabulary at much smaller scale and particle count. Their existing hover-correction logic now drives short particle pulses instead of toggling solid cone meshes.\nNo new propulsion state is introduced: exhaust remains a visual consequence of the existing lift/hover/landing and attitude-correction states. This is intentionally cheap mobile-friendly exhaust, not volumetric simulation.\n\nV1.49 LIVING SPECIMEN CYLINDERS\nThe two previous domed-cylinder cargo objects are promoted into self-contained living specimen vessels derived from the Time Machine notebook's Organic / Biological catalog, using rhododendron as the first probe.\nEach vessel now has a shallow metal disc base, dark substrate/soil, a tiny procedural plant built from stems, branches, flattened leaf primitives, and a compact pink blossom cluster, plus a transparent cylindrical wall and shallow glass dome.\nThe botanical geometry is intentionally conservative: all stems, leaves, and blossoms are sized to remain completely inside the glass cylinder/dome envelope rather than clipping through it. The vessel glass uses transparent physical material with depthWrite disabled to reduce nested-transparency artifacts inside the larger pallet blister.\nThis remains primitive procedural geometry rather than botanical modeling. The question is whether a visibly living object inside a transparent, physically based specimen container materially changes the pallet's read.\n\nV1.48 TIME MACHINE MATERIAL SHIPMENT\nThe pallet's existing primitive cargo is now a first shipment from the established Time Machine Chapters I\u2013VII material notebook. Geometry is deliberately unchanged.\nSix procedural CanvasTexture material families are mapped across the existing boxes and cylinders: brass, nickel, granite, white marble, malachite, and wood. Their treatments emphasize worked-metal striation, mineral speckling, marble veining, malachite banding, and directional wood grain.\nEvery cargo root remains individually addressable and now carries a material identity plus provenance back to The Time Machine / Chapters I\u2013VII / Materials So Far. No bespoke meshes, labels, new cargo mechanics, or invented source claims are introduced.\nThis is the intended cheap probe: can primitive stock plus procedural surface identity make the pallet read as a shipment from the notebook?\n\nV1.47 BLISTER AS NORMAL LANDER CYCLE\nThe emitter is no longer a separately discoverable control. Mast/canopy tap behavior has been removed. The orange lander button now owns the complete operating sequence.\nThe resting landed state is cargo-accessible: emitter mast stowed flush, canopy collapsed, pressure field off. First orange-button press deploys containment: mast rises, then the rectangular canopy expands along its LONG X AXIS ONLY, then the blue field establishes. The lamp becomes cyan to communicate flight-ready.\nA second orange-button press may initiate flight only when both emitter and pressure field are fully active. Containment remains active through gear retraction, lift, hover, landing, and gear deployment.\nAfter landing is mechanically complete and the legs are down, containment automatically shuts down: blue field off, canopy contracts along X to zero, then mast telescopes to its fixed deck socket. The machine returns to cargo-accessible resting state.\nThis makes containment a required preflight/postflight phase of the lander's normal state machine rather than an optional subsystem. The flight invariant remains hard: no active blister, no launch.\n\nV1.46 BLISTER EMITTER MECHANISM REPAIR\nVisual review of deployed and hovering states exposed two concrete problems: the canopy plate extended too far horizontally, and although emitter stow/deploy functions existed, no physical interaction could actually invoke them.\nThe canopy is now a simple thin rectangle sized inside the pallet footprint.\nEmitter motion is explicitly sequential. On stow, the plate contracts horizontally to effectively zero first; only then does the mast shorten vertically into its fixed deck socket. Deployment reverses the sequence: mast rises first, then the plate expands. Neither operation can translate geometry below the pallet.\nFor this probe, tapping the mast or canopy while LANDED toggles emitter stow/deploy. The flight button remains separate and retains the hard invariant that flight can begin only while the emitter and pressure field are fully ACTIVE. Emitter hardware cannot be collapsed while airborne.\nThis physical-control mapping is provisional; it exists so the collapse mechanism can actually be experienced before control layout is redesigned.\n\nV1.45 CENTRAL BLISTER EMITTER + FLIGHT INVARIANT\nThe CargoStage experiment has been removed. Cargo is payload and remains permanently on the pallet deck; it never telescopes, translates, or stows into the chassis.\nThe Air Blister is now generated by one deployable central emitter: a mast fixed to a deck socket and a thin octagonal canopy at its top. Retraction is deliberately abstract and clipping-safe: the blue pressure field switches off, the canopy scales horizontally toward zero around the mast, then the mast shortens vertically toward its fixed deck base. No component translates below the lander. Deployment reverses those transforms and establishes the blue field only after the emitter is fully deployed.\nThe emitter is semantically independent from both cargo and the pressure field: `PalletLander001 -\u003e Cargo/*`, `PalletLander001 -\u003e BlisterEmitter -\u003e Mast + Canopy`, and `PalletLander001 -\u003e AirBlister -\u003e PressureField`.\nCRUCIAL FLIGHT INVARIANT: the pallet cannot initiate flight unless the blister field is ACTIVE and the emitter is fully ACTIVE. Flight no longer requires or triggers blister shutdown; containment remains active during gear retraction, lift, hover, landing, and gear deployment. The button only launches from the landed state when that invariant is satisfied.\nEmitter stow/deploy functions remain exposed for later physical-control experimentation, but the current flight button will never use them to create an uncontained flight state.\n\nV1.44 CARGO ENVELOPE + BLISTER SUPPORT REPAIR\nThe first telescoping pass exposed two physical-model errors.\nFirst, the cargo stage's stowed travel exceeded the placeholder chassis envelope, so the payload visibly translated below the lander. Stowed travel is now bounded to the current chassis depth (`stowedY=-0.36`) rather than pretending the chassis has invisible storage volume beneath itself. Exact packing/lid geometry remains intentionally unresolved.\nSecond, the Air Blister previously had only deck-perimeter rails, so deactivating its blue pressure skin left no convincing support apparatus. It now has explicit physical support hardware: four corner masts, a restrained upper perimeter, and short shoulder braces following the wrapped-present profile.\nPressure field and support hardware are now separate states. `setBlisterActive(false)` hides only the translucent blue pressure skin; the mechanical blister supports remain visible and descend with CargoStage.\nThese corrections preserve the hierarchy: PalletLander001 moves flight; CargoStage moves payload and containment apparatus; AirBlister independently controls pressure-field visibility.\n\nV1.43 TELESCOPING CARGO STAGE\nThe heterogeneous cargo field and Air Blister have been reparented beneath a new semantic/mechanical root: `pallet-lander-001.cargo-stage`. Individual cargo objects remain individually addressable; only their shared mechanical owner changed.\nThe cargo stage now has a lift platform and four simple telescoping rails. Stowing deactivates the blue pressure blister first, then lowers the entire stage\u2014including every cargo object\u2014into the chassis as one transform. Deploying reverses the stage motion and only reactivates the blister after the stage reaches full height.\nCargo is intentionally allowed to clip through the current placeholder chassis during this architecture pass. No attempt is made yet to solve lids, packing, cavities, or exact storage volume.\nFlight is now gated by cargo-stage state. The physical button sequence is:\nLANDED + DEPLOYED -\u003e STOWING -\u003e LANDED + STOWED -\u003e RETRACT GEAR / LIFT / HOVER -\u003e LAND -\u003e DEPLOY GEAR -\u003e DEPLOY CARGO -\u003e BLISTER ACTIVE.\nThe status lamp communicates the next action: cyan = stow cargo, amber = launch, blue = land, green reserved for deployed/return semantics, dim = transition.\nMost importantly, neither flight code nor any individual cargo object knows how cargo stowing works. Flight moves PalletLander001; cargo handling moves CargoStage; cargo objects simply inherit both transforms.\n\nV1.42 AIR BLISTER + BUTTON CYCLE CUE\nThe deployed cargo field is now enclosed by `pallet-lander-001.air-blister`, an independently addressable pressure-containment module beneath PalletLander001. Its translucent blue skin uses a broad box-like wrapped-present profile with chamfered shoulders and a shallow roof. Sparse perimeter rails explain its deck attachment without turning it into a cage.\nThe blister contains the cargo semantically but does not own or merge any cargo object. Cargo remains individually addressable beneath the cargo collection.\nThe existing physical button now demonstrates a tiny staged interaction while landed: with the blister active, the first press deactivates containment; with containment inactive, the next press begins the existing retract/lift/hover sequence. Landing completes by redeploying the legs and reactivating the blister, closing the current toy cycle.\nThe adjacent status lamp now communicates the button's next meaningful action rather than merely reporting vehicle state: cyan while containment is active and the next press will deactivate it; amber when containment is inactive and flight is armed; blue while hovering and the next press will land; dim during mechanical transitions.\nThis is temporary interaction plumbing for the prototype. It establishes that local physical controls can sequence nested systems without creating global UI.\n\nV1.41 HETEROGENEOUS CARGO LANDSCAPE\nPallet Lander 001 now carries a first heterogeneous cargo field. Every visible cargo item is an independently addressable semantic object beneath `pallet-lander-001.cargo`; none of the pile is baked into the chassis or represented as one merged mesh.\nInitial cargo vocabulary: individual cubes, rectangular cases/billets, three separate horizontal cylinders that visually form a bundle, two vertical tanks, and two domed cylinders. Each cargo root records a stable semantic ID, cargo kind, human-readable label, and unresolved provenance.\nThe collection currently rides directly on the chassis deck. Its metadata marks `cargo-stage` as the future parent boundary so a telescoping stage can adopt the cargo roots later without touching flight code.\nNo material identity is asserted yet. Surface differences are visual heterogeneity only.\nBecause cargo remains beneath PalletLander001, the existing flight substrate carries the entire collection without any flight-system changes.\n\nV1.40 LANDER CONTROL FACE + EYE TUNE\nThe Pallet Lander's physical flight button and status lamp now live on the front (+Z) chassis face as a right-justified local control cluster rather than on the deck. Their interaction semantics are unchanged.\nRoom 001's canonical eye is raised slightly again, from y=1.78 to y=1.88. The existing modest downward pitch remains unchanged.\n\nV1.39 TABLETOP COMPOSITION TUNE\nPallet Lander 001 is uniformly scaled to 75% at its root. Internal proportions, state machine, thruster behavior, and scene anchor are unchanged.\nRoom 001's canonical eye is raised modestly from y=1.62 to y=1.78 and its initial pitch is biased slightly downward (-0.095 rad). Existing one-finger look and pinch-dolly semantics are unchanged; no new gesture is introduced.\nThis is a composition correction discovered by the flight coupon: preserve the human-scale controller and make the tabletop readable before adding cargo detail.\n\nV1.38 TABLETOP TOY \u2014 PALLET LANDER FLIGHT SUBSTRATE\nRoom 001 now owns its first stateful content module: Pallet Lander 001. The current geometry is intentionally a crude flight coupon, not the finished cargo lander.\nSemantic hierarchy:\nRoom 001 -\u003e Contents -\u003e Pallet Lander 001 -\u003e Chassis / Legs / Main Thruster / Station-Keeping Thrusters / Controls.\nThe entire vehicle is parented beneath one PalletLander001 root. Flight motion is applied only to that root so future cargo, air blister, telescoping stage, drones, and other descendants inherit flight without modifying hover code.\nThe lander's current scene anchor is the middle of the workbench. This is a convenient scene-local anchor, not lore or resolved station geography.\nA physical button on the chassis owns the interaction. There is no new
