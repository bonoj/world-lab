/*

COLLABORATIVE DESIGN PHILOSOPHY

WORLD LAB is built through repeated collaboration between a human, models, and executable systems.
Its architecture should make that collaboration easier to continue rather than requiring each new
participant to reconstruct the reasoning that produced it.

BUILD THE SMALLEST THING THAT CAN TEACH US SOMETHING.
Prefer executable probes over speculative frameworks. A crude mechanism that produces evidence is
more valuable than an elegant abstraction whose need has not yet been demonstrated.

LET BEHAVIOR EARN ARCHITECTURE.
Repetition, friction, failure, and unexpected composition reveal concepts that deserve durable
representation. Promote those concepts to the lowest level that genuinely owns them. Do not
generalize merely because generalization is possible.

PRESERVE MEANING ALONGSIDE IMPLEMENTATION.
Code records how the system works. It does not necessarily record why responsibility lives where it
does, which constraints are intentional, or which apparent limitations are unresolved experiments.
Keep enough present-tense semantic context that another capable model can extend the artifact
coherently without replaying its entire history.

REVISE TRUTH; PRESERVE ARCHAEOLOGY.
Current documentation should describe the system as it is now. When architecture changes, revise
that description rather than accumulating contradictory layers of old truth. Preserve consequential
discoveries, failures, and promotions separately as archaeology when knowing how the system arrived
here will help future reasoning.

PREFER SEMANTIC EXTENSION TO SPECIAL CASES.
When new behavior exposes a missing concept, ask where that concept actually belongs before patching
the immediate symptom. A good extension leaves behind a useful idea that subsequent work can
naturally consume. But a local solution should remain local when the evidence does not justify
promotion.

KEEP OWNERSHIP LEGIBLE.
A model should be able to determine where a change belongs. Worlds own world truth. Cross-entity
rules belong to systems when they actually become cross-entity. Entities carry reusable properties
of entities. Individual things may own peculiar behavior. Presentation may communicate causality
without pretending to be simulation. These boundaries may evolve when executable evidence gives us
reason to change them.

COMPOSITION IS EVIDENCE.
Pay attention when independently simple mechanisms produce behavior nobody explicitly authored.
Those moments are often more informative than completion of the feature that exposed them. Preserve
the conditions that made the composition possible before attempting to formalize or productize the
result.

FAILURE SHOULD REMAIN CHEAP AND VISIBLE.
Experiments are expected to fail. Prefer structures that can be probed, inspected, reverted, and
replaced without destabilizing unrelated work. Fail visibly and diagnostically. Do not preserve a
failed implementation merely because effort was spent producing it; preserve the lesson instead.

MODELS ARE COLLABORATORS IN CONTINUITY, NOT JUST CODE GENERATORS.
Read the artifact's current semantics before extending it. Use implementation evidence to question
those semantics when necessary. After a meaningful architectural change, leave the artifact more
understandable to the next participant than you found it. The goal is not obedience to previous
decisions. It is informed continuation of the same investigation.

HUMAN STEERING REMAINS LIGHTWEIGHT.
Support a loop of proposing, building, observing, discussing, and revising without requiring the
human to specify every implementation decision. Models should exercise engineering judgment inside
established intent and constraints while surfacing decisions that materially change what the
project means.

Build evidence. Promote what earns meaning. Leave the system able to explain itself well enough to
keep going.


WORLD LAB ROOT ARCHAEOLOGY — COLLABORATIVE DESIGN PHILOSOPHY

The project had accumulated enough repeated evidence across independent labs to make its collaborative
development practice worth stating at root scope. This is deliberately lightweight rather than a
manifesto or fixed methodology. It exists primarily to orient a fresh model and empower coherent
human-model continuation.

The philosophy records practices already demonstrated by the work: executable probes before speculative
frameworks; behavior earning architecture; present-tense semantic truth plus separate archaeology;
ownership at the lowest level that genuinely owns a concept; composition treated as evidence; cheap,
visible failure; and models leaving artifacts more understandable for their successors.

"Semantic extension" is used descriptively inside the philosophy rather than promoted as a branded
project doctrine. The philosophy itself is expected to evolve when future evidence makes parts of it
false, incomplete, or unnecessarily restrictive.

WORLD LAB SEMANTIC DELTA — 3D · WORKS E1 PHASE 2C
Bearings remain diagnostic world matter, not a universal machinery objective. Tumbler now tests
conditional carry/release; Tendon tests contraction across attachment points; Leg tests planted
contact converting articulation into body displacement. This is a truth pass, not framework promotion.

WORLD LAB SEMANTIC DELTA — 3D · WORKS E1 PHASE 2B
Observed probe failures distinguished impulse, sustained contact, bilateral solidity, and persistent
support. The consolidation remains specimen-local: semantic forward repairs Flipper direction;
Tendon contact works on both stroke directions; Tumbler locally carries bearings through rotation;
Leg now falls continuously and can oppose gravity only through active foot/world contact. These are
candidate mechanical truths, not yet promoted framework abstractions.

WORLD LAB SEMANTIC DELTA — 3D · WORKS E1 PHASE 2
After the linear actuator passed its physical-work gate in user play, the separate PROBES cupboard
expanded into a comparative mechanical fan-out: FLIPPER, JAWS, TUMBLER, LEG, and TENDON. Each remains
a disposable specimen with local contact logic against ordinary authoritative bearings. The batch
tests translation, angular impulse, containment, continuous rotation, articulated support, and
contraction before any common mechanical alphabet is promoted.

WORLD LAB SEMANTIC DELTA — 3D · WORKS E1 PHASE 1
3D WORKS now contains a separate disposable PROBES cupboard alongside canonical PAYLOADS. Its first
mechanical specimen is a minimal linear actuator whose sole gate is physical displacement of ordinary
WORKS bearings. The local swept-contact implementation is explicitly experimental and earns no shared
mechanical abstraction until play produces evidence.

WORLD LAB SEMANTIC DELTA — 3D · WORKS T0.22
Turret articulation now expresses both azimuth and target elevation while remaining separate from
ballistic truth. Cannon bearings originate at the transformed physical muzzle, aligning visible
causality with projectile simulation without introducing hitscan or a generalized aiming framework.

WORLD LAB SEMANTIC DELTA — 3D · WORKS T0.21
FLOATER EGG now reaches hover through gradual lift acceleration rather than a fixed visual/support
offset, then oscillates gently around a terrain-relative datum while wandering. This remains local
creature behavior; one flying specimen does not earn a generalized flight system.

WORLD LAB SEMANTIC DELTA — 3D · WORKS T0.20
Observed behavior canonized the accidental T0.19 Floater as JUMPER EGG rather than repairing away its
erratic ballistic challenge. A true stable FLOATER EGG was added as a sibling. Repeated bearing-shower
death behavior earned one small reusable physical consequence, bearingBurst(origin,count), shared by
Jumper and Floater. Creature health/death architecture remains deliberately unpromoted.

WORLD LAB SEMANTIC DELTA — 3D · WORKS T0.19
FLOATER EGG adds a sibling autonomous target without promoting a creature/combat framework. Distinct
death consequences now compose with existing world semantics: Crawler destruction removes terrain;
Floater destruction releases ordinary bearings. Per-payload durability remains local evidence.

WORLD LAB SEMANTIC DELTA — 3D · WORKS T0.17
ENTITY-LEVEL SEMANTIC FORWARD: live entities now carry canonical local +Z forward. Directional
payload geometry and behavior consume that shared positional semantic; turret targeting no longer
contains a compensating PI sign hack. This is intentionally a seed convention, not a direction framework.
*/
/*
WORLD LAB SEMANTIC DELTA — 3D · WORKS E7.0
The E6 wonder field is preserved intact as a separate toggleable possibility probe. A new surface-civilization inspection field is added without replacing canonical payloads. Function-first brass/glass/timber structures test intake, sorting, fabrication, buffering, waterworks, habitation, interchange, relays and civilization-styled readings of existing machine propositions. Hollow process volumes visibly accept variable granular fill as an architectural probe; this does not yet claim authoritative bearing storage semantics.
*/

WORLD LAB DISTRIBUTION DELTA — INHERITANCE PASS 1
This build exposes only 3D · ORBITAL CONSTRUCTION and 3D · WORKS in the host selector and defaults to

Orbital Construction remains otherwise untouched. Its Orrery Seed implementation and archaeology are preserved, but the tabletop orrery is hidden in this quiet inheritance build so the first encounter stays focused on the station, rotation/tapping, and the pallet lander. This is distribution-state subtraction, not a change to Orbital Construction's canonical semantics.
*/

WORLD LAB SEMANTIC DELTA — MOM INHERITANCE PASS 3
WORKS first-contact controls are intentionally compressed without deleting laboratory capability.
The workbench starts collapsed; a persistent three-button play strip exposes world verb, deployment

*/

/*
WORLD LAB DISTRIBUTION DELTA — MOM INHERITANCE PASS 4
WORKS menu is closed in static markup before any lab JavaScript executes. The menu therefore never paints open during boot; its accumulated controls become renderable only after the user explicitly taps WORKS. No simulation, interaction, or machinery behavior changes.
*/
/*

The quiet two-lab inheritance build is now named world_lab_handoff_v0. WORKS source begins directly at

as preserved experimental archaeology; FOUNDRY becomes the active development surface. The fork

*/

croll-behavior-x:contain}#palette::-webkit-scrollbar{display:none}.swatch{flex:0 0 46px;width:46px;height:46px;padding:0;border-radius:50%;border:3px solid #ffffff26;box-sizing:border-box;touch-action:pan-x}.swatch.on{outline:3px solid #f2ead2;outline-offset:2px}.paletteAction{flex:0 0 auto;height:46px;padding:0 12px}#fail{display:none;position:fixed;z-index:99;left:10px;right:10px;bottom:10px;max-height:45%;overflow:auto;white-space:pre-wrap;background:#351717;color:#ffd2c8;border:1px solid #ff8c78;padding:12px;border-radius:8px;font:12px/1.4 ui-monospace,monospace}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003ccanvas id=\"c\"\u003e\u003c/canvas\u003e\n\u003cbutton id=\"toolToggle\" type=\"button\" aria-expanded=\"true\"\u003eWALK \u25be\u003c/button\u003e\n\u003cdiv id=\"hud\" class=\"open\"\u003e\u003cb\u003e2D \u00b7 EXTENSIBLE WORLD \u2014 FIRST INHABITED STRIP\u003c/b\u003e\n\u003cdiv id=\"status\"\u003ea road reaches a declining coast\u003c/div\u003e\n\u003cdiv class=\"row\"\u003e\u003cbutton data-mode=\"walk\" class=\"on\"\u003eWALK\u003c/button\u003e\u003cbutton data-mode=\"dig\"\u003eDIG\u003c/button\u003e\u003cbutton data-mode=\"timber\"\u003eTIMBER\u003c/button\u003e\u003cbutton data-mode=\"lamp\"\u003eLAMP\u003c/button\u003e\u003cbutton id=\"home\"\u003eFIND ME\u003c/button\u003e\u003cbutton id=\"reset\"\u003eRESET\u003c/button\u003e\u003cbutton id=\"export\"\u003eEXPORT EVIDENCE\u003c/button\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv id=\"hint\" style=\"bottom:74px\"\u003etap a color to finger-paint directly into world coordinates\u003cbr\u003epaint is evidence, not encoded semantics\u003c/div\u003e\n\u003cdiv id=\"palette\" aria-label=\"finger paint pigments\"\u003e\u003c/div\u003e\n\u003cpre id=\"fail\"\u003e\u003c/pre\u003e\n\u003cscript\u003e\nconst __toolToggle=document.getElementById('toolToggle'),__hud=document.getElementById('hud');\nfunction __setToolsOpen(open){__hud.classList.toggle('open',open);__toolToggle.setAttribute('aria-expanded',String(open));}\n__toolToggle.addEventListener('click',e=\u003e{e.stopPropagation();__setToolsOpen(!__hud.classList.contains('open'));});\n__hud.addEventListener('click',e=\u003e{const b=e.target.closest\u0026\u0026e.target.closest('[data-mode]');if(b)__toolToggle.textContent=b.textContent+' \u25be';});\n\n/*\n2D \u00b7 EXTENSIBLE WORLD \u2014 T0.6 / REUSABLE ATMOSPHERE KIT\n\nThis README is intentionally invisible at runtime and extensible in-place.\nIt is the lab's semantic continuity surface, not user-facing instructions.\n\nSTATUS\nIndependent primary World Lab laboratory. It does not inherit 2D \u00b7 SUBSTANCE.\nThe first registration-only T0 protected the ontology. T0.1 spends that freedom\non one bounded inhabited strip rather than on a general engine.\n\nCENTRAL QUESTION\nCan a crude persistent 2D world begin to feel like somewhere before a reader is\nvisible, using prose only as semantic pressure on what the substrate bothers to\nrepresent?\n\nCURRENT PROBE\nA horizontally traversable coastal strip with:\n- one persistent traveler;\n- several crude inhabitants with local wandering/rest behavior;\n- terrain that can be excavated;\n- timber that can be placed as world structure;\n- lamps that establish small local pools of night-readable space;\n- a road, river/bridge, declining settlement, marsh and sea as continuous places;\n- camera travel independent of traveler movement.\n\nThe point is not to illustrate Innsmouth. The prose is allowed to pressure the\nworld toward roads, decay, water, bridges, roofs, industry, sparse life and a\ncoast. Those become reusable world vocabulary rather than scene illustration.\n\nREADER\nThe reader is deliberately absent on-screen. A small public-domain prose seed\nfrom H. P. Lovecraft's The Shadow Over Innsmouth (Project Gutenberg #73181) is\nembedded below as source pressure. Later reading machinery should not be assumed\nto require rebuilding this world.\n\nOWNERSHIP\nterrain[] = authoritative editable ground profile.\nstructures[] = persistent placed/built world objects.\ntraveler = persistent situated moving body.\ninhabitants[] = cheap local agents; not an NPC architecture.\ncameraX = observer state, not world state.\npaintStrokes[] = persistent uninterpreted marks in world coordinates. Color carries no encoded meaning.\nsoilPatches[] = local ground material with moisture, not a global terrain repaint.\nplants[] = persistent individual living things whose growth responds to local moisture.\nweather = local atmospheric actors and precipitation state; rain is physical world-space evidence.\nworldTime = slow environmental phase used by light/weather/life, not a quest clock.\nbiomeRegions[] = soft world-local region descriptions whose visuals/affordances can differ without becoming a universal biome taxonomy.\nbackgroundRanges[] = non-walkable depth/composition evidence; mountains may remain cheap silhouettes until more fidelity is earned.\nlakes[] = world-local water regions that interrupt ordinary walking. Bridges can restore traversable continuity across them.\nforestBands[] = spatial vegetation pressure, currently realized as cheap layered tree masses rather than an ecology engine.\n\nINTERACTION\nWALK: tap traversable ground to commit the traveler to a destination.\nDIG: carve the local terrain profile.\nTIMBER: add a rough beam/platform where touched.\nLAMP: place a persistent light.\nDrag empty sky horizontally to inspect/travel without teleporting the traveler.\nPAINT: choosing any pigment enters one fixed finger-paint mode. No brush taxonomy, opacity, shape tools, or color semantics.\nEXPORT EVIDENCE: emits a self-contained HTML specimen containing the full world strip bitmap, current viewport bitmap, complete authoritative world state, all paint strokes, camera/viewport metadata, palette, and this lab semantic document. It is a handoff specimen, not a canonical save/load system.\n\nBOUNDARIES\nDo not generalize this into an infinite chunk engine, settlement simulator,\nreader framework, NPC framework, toy editor, or material taxonomy yet.\nThe strip is intentionally finite but wider than the screen. \"Extensible\" means\nthe substrate can gain vocabulary and space without changing identity; it does\nnot require literal infinity.\n\nFAILURE ARCHAEOLOGY \u2014 T0.1.1\n- T0.1 initially mounted its HTML/HUD but its world and controls were inert because\n  the lab script had a JavaScript parse error: unary '-' was applied directly to an\n  exponentiation expression in two Gaussian terrain terms. Since parsing failed before\n  the lab's own error handlers installed, the failure was silent inside the iframe.\n- Lesson: host-safe source encoding is not enough; embedded lab source also needs a\n  pre-mount syntax check or an outer iframe bootstrap capable of reporting parse failure.\n\nINVARIANTS\n- Independent lab, shared World Lab project.\n- Visible diagnostics.\n- World state and observer state remain distinct.\n- New affordances must earn themselves through use.\n- Prose pressures representation; it does not dictate a literal illustration.\n- Keep this README current as the lab learns.\n- Handoff capture is broader than the viewport: offscreen world state and marks are first-class evidence.\n- Paint is a spatial request language. Meaning is inferred from marks relative to each other and to world evidence; palette colors never map to built-in features.\n- No canonical save-state/migration machinery yet. Evolving implementations may reincarnate the world from evidence.\n\nT0.3 \u2014 CRAYON BECOMES CAUSAL WORLD\nThe first exported crayon specimen was interpreted by composition rather than palette legend: cloud forms above falling blue marks above a bounded brown ground patch containing several distinct living marks, with a sun sharing the sky. The cheapest honest promotion is causal, not cosmetic. A local soil patch can hold moisture; world-space clouds can precipitate; raindrops collide with terrain and wet soil; individual plants consume moisture and grow; a slow sun/time phase changes illumination and helps weather transition. These are intentionally tiny systems, not a generalized climate, hydrology, farming, biome, or material engine. The original paint vocabulary remains available and uninterpreted.\n\nT0.4 \u2014 WEATHER ESCAPES CONTAINMENT / CAUSAL LEGIBILITY\nA second painted specimen used large directional sky marks while observing the ecology probe. Subsequent verbal clarification confirmed the marks were asking for two related promotions: the sun should visibly traverse the sky as a compressed day/night cycle, and weather should operate across the entire strip rather than remain a garden demonstration. The sparse original rain and subtle plant changes also exposed a perceptual failure: causal state can exist without being available to play. T0.4 therefore makes the same tiny systems louder rather than deeper. A day lasts about 48 seconds; the sun crosses the observer sky and night visibly arrives; multiple world-space weather cells advect across the full strip; rain is dense and slanted by a crude shared wind; impacts leave temporary wet traces on any terrain and strongly wet local soil; plant growth and health transitions are accelerated and visually staged. No clock, moisture meter, weather icon, growth bar, forecast, farming UI, or generalized climate model is added. The world itself must make causality readable.\n\nT0.6 \u2014 REUSABLE ATMOSPHERE KIT / SOFT INFERRABLES\nA later crayon specimen was initially misread as another request for dynamics. Human clarification established a higher-level use: systems-mode drawing can teach the collaborating worldbuilder kinds of places and relationships it may later choose to instantiate from prose or other pressure. The marks suggested background mountains/depth, foreground forest, a lake whose water should not be ordinary walkable ground, a bridge that restores traversal across it, and a beach-like regional transition. The headline is BIOMES, but deliberately not as a rigid generator or pigment legend. A region may coherently vary terrain, vegetation, atmosphere, materials, structures, depth treatment, and affordances. Context decides whether a future mark means \u201clearn this vocabulary,\u201d \u201cbuild this here now,\u201d \u201cplan this,\u201d or something else. Geometry, color, adjacency, current activity, existing world state, recent history, and prose may all contribute evidence; none is individually authoritative.\n\nThis incarnation installs cheap reusable examples rather than a universal biome engine: layered background mountain silhouettes, a foreground forest band, a lake basin with non-walkable water, a spanning bridge that becomes the walkable surface across that interruption, and a beach transition before the coast. Existing weather/day systems remain intentionally legible. These representations are allowed to stay ugly while new. Later beauty work should add higher-fidelity registers without deleting the cheap ancestors.\n\nTRANSFERABLE LESSON\nA system is not successfully externalized merely because its state exists. Its causal behavior must be perceptually available at the spatial scale and temporal tempo of play. Spatial marks can request forces, transformations, extent, and legibility\u2014not only entities.\n\nNEW QUESTION\nCan world-scale weather and compressed environmental time become legible enough that the player can reason about causality by watching, then steer the next system by marking the world again?\n\nT0.6.13 \u2014 FIXED PRECIPITATION CLOCK\nThe first clean rebuild still visibly reversed. Inspection found the actual chronology\nbug: candidate birth interval was derived from current rain amount. As rain intensity\nchanged, the interval changed, which renumbered generations and retroactively changed\ntheir computed birth times. Current fall speed also varied with rain amount. The renderer\ntherefore violated its own apparent `y = startY + vy * age` invariant because both `age`\nand `vy` were being recomputed from changing weather.\n\nCandidate precipitation now uses one immutable 80 ms world-time birth clock. Cell +\ngeneration permanently identify an event and its seeded birth offset and vertical speed.\nRain amount is only a density gate over those fixed candidates; it cannot alter their\nbirth chronology or vertical motion. Natural vertical velocity is event-owned, positive,\nand constant. Present weather may change opacity, streak appearance, and severe horizontal\nwind response, but never Y position.\n\nThis is the first rain repair based on the actual observed reversal mechanism rather than\na presumed sign/wind/phase failure.\n\nT0.6.12 \u2014 PRECIPITATION RESET / BABY-BATHWATER REBUILD\nThe accumulated wind/rain renderer from T0.6.5\u2013T0.6.11 was discarded after repeated\nfield-wide stop-and-reverse behavior survived local trajectory repairs. Cloud appearance,\natmospheric regions, their evolution, and the sixty-second observational specimen were\npreserved.\n\nRain was rebuilt from a deliberately smaller contract. Atmospheric precipitation exposes\nonly amount plus an explicit severe-wind register. Amount controls births. Every natural\ndrop has one bounded positive vertical speed and exactly one vertical-motion equation:\n`y = startY + vy * age`, with `vy \u003e 0`. Camera, density, cloud state, wind and drawing\ncannot modify the sign. There is no modulo trajectory, vertical phase, gravity flag,\ngeneral wind inheritance, per-drop wandering wind, or reverse-rain path in the ordinary\nrenderer.\n\nWind was rebuilt as precipitation response rather than shared motion. Rain ignores it\nentirely below a high severe-wind threshold. Above threshold it contributes only a\ncoherent positive horizontal X component; it never enters Y. Visual streak length is\nbounded separately from physical speed.\n\nFuture anomalous upward rain remains a desirable capability, but it is intentionally\nabsent from this natural-rain implementation. When revisited it should be a separate\nexplicit anomalous precipitation behavior rather than a latent sign switch inside\nordinary weather.\n\nT0.6.11 \u2014 COHERENT GALE THRESHOLD\nPer-drop birth wind was rejected because it removed synchronized oscillation by making\nrain direction locally wishy-washy. Ordinary rain should be gravity-dominant and visually\ncoherent.\n\nCloud/system drift and precipitation deflection now have separate response curves.\nRain has a strong-wind dead zone: ordinary atmospheric motion can move weather and clouds\nwithout visibly canting drops. Only coherent local rain wind beyond a gale-like threshold\ncontributes horizontal velocity. Above that threshold nearby drops share one direction,\nwith only tiny seeded variance for texture.\n\nThe sixty-second specimen keeps rain essentially vertical through its lower and middle\nregisters. A one-direction coherent wind develops only during the severe late phase,\nproducing slashing rain, then eases without reversing. This tests gale deflection without\nmaking changing wind direction part of the precipitation probe.\n\nT0.6.15 \u2014 CLEANUP REGRESSION REPAIR\nv0.11.2 incorrectly removed the `precipParticles=[]` declaration while retaining live\naliases/export references to that presentation array. The declaration is restored.\nNo rain chronology, motion, wind, cloud, or rendering behavior is changed.\n\nT0.6.14 \u2014 CLEAN WEATHER BASELINE\nDead legacy rain helpers/state/export fields removed. No behavioral change.\n\nT0.6.10\u2013T0.6.13 \u2014 RAIN ARCHAEOLOGY \u2192 CLEAN BASELINE\nSeveral successive rain probes exposed a chronology bug rather than a gravity/sign bug.\nThe failed lineage tried birth-sampled wind, bounded velocity, deterministic generations,\na gale threshold, and finally a precipitation reset. The decisive failure was allowing\ncurrent rain intensity to alter the event interval: generation numbering and computed\nbirth times changed underneath already-visible rain, producing coherent slow \u2192 stop \u2192\nreverse motion despite locally positive vertical velocity.\n\nCURRENT RAIN CONTRACT:\n- Candidate births use one immutable 80 ms world-time clock.\n- `(world cell, generation)` permanently identifies a candidate event.\n- Seeded birth offset and vertical velocity are stable for that event.\n- Natural `vy` is positive and constant; `y = startY + vy * age` is the sole Y-motion law.\n- Rain amount gates candidate visibility/density only; it does not own chronology or motion.\n- Ordinary atmospheric/cloud drift does not steer rain.\n- Explicit severe-wind response has a large dead zone and affects X only.\n- Streak appearance is bounded presentation and cannot feed back into position.\n- Shelter clips rain against world geometry.\n- Upward/anomalous precipitation is intentionally absent from ordinary rain. If restored,\n  it should be a separate explicit behavior, not a latent sign switch.\n\nThe cloud/atmospheric field and retained 60-second weather specimen remain authoritative;\nthis cleanup changes no weather behavior.\n\nT0.6.4 \u2014 RETAINED WEATHER SPECIMEN\nThe visible vertical sampling grid from the first field renderer was rejected as a\npresentation artifact. The scalar field remains authoritative but invisible; broad\ngradient consequences replace column-by-column field visualization.\n\nOne intentionally retained testCycle atmospheric region sits near the starting locus.\nIt traverses fair/building/overcast/hard-rain/weakening/clearing regimes in roughly\n20 seconds, continuously rather than through buttons or named runtime states. This is\nan observational specimen: a cheap persistent way to inspect the entire atmospheric\nvocabulary while it evolves. It is not a universal weather clock or player command.\n\nT0.6.3 \u2014 ATMOSPHERIC FIELD / PAINTERLY INTERPRETATION\nThe prior cloud-as-emitter model was rejected after inspection. weatherCells[] now\nrepresent evolving world-space atmospheric regions, not visible cloud objects.\nTheir broad weighted influence produces coherent non-rectangular weather edges.\nA region can build, rain, weaken, and clear without being replaced by a different\nontological object.\n\nPresentation is deliberately split across spaces. World weather space is authoritative.\nPainterly cloud masses and middle-distance haze interpret it. Individual rain streaks\nare cheap ephemeral viewport presentation sampled from atmosphereAt(worldX), so free\ncamera pan does not detach rain from geography. Substantial roofs/terrain provide a\ncheap rain-blocking height query so precipitation does not visibly pass through shelter.\nThe camera remains independent of the traveler in this lab; that is an affordance of\nthis experiment, not a World Lab rule.\n\nClouds render through a low-resolution aggregate surface so construction primitives\ncollapse into broad masses rather than procedural cauliflower. Beauty is evaluated at\nthe composition level: silhouette, value, mass, illuminated edge, haze, and transition.\n\nT0.6.2 \u2014 TOUCH ARBITRATION / LEGIBLE STORM ENCOUNTER\nLab controls start open and retain user-controlled disclosure state; selecting a tool\ndoes not collapse the workbench. Canvas touch begins ambiguous: crossing a small\nmovement threshold promotes the gesture to camera manipulation and cancels the tap\naction for that gesture. This arbitration belongs to the lab, not the host.\n\nWeather must be perceptually available at play tempo. One moving storm is deliberately\nassertive enough to read as an approaching regional event: cloud mass, distant rain\ncurtain, local streaks, impacts/wetness, then departure. There is no weather command;\nthe point is encounter, not demonstration. Cloud morphology and precipitation remain\nrelated atmospheric facts rather than one object type implying the other.\n\nT0.6.1 \u2014 LAB-OWNED CONTROLS / FULL-STAGE WORLD\nThe host chooses laboratories; this lab alone owns its experimental controls.\nIts control surface collapses by default and expands temporarily over the world.\nThis is a lab-local interface decision, not a host toolbar convention.\n\nT0.6 \u2014 REUSABLE ATMOSPHERE KIT / TEMPORARY PRODUCTIONIZATION\nThe strip has outlived its role as a destination. It is now primarily a proving\nground for discovering what toy worlds can look and feel like. This pass therefore\ndoes not repair every incongruity in the inherited geography. It productionizes\na few earned atmospheric systems so the worldbuilder can wield them later at a\nhigher visual register.\n\nATMOSPHERE OWNERSHIP\nweatherCells[] own moving regional atmospheric conditions: cloud family,\ncoverage/intensity, precipitation kind, and local phase. They do not own terrain,\nplants, the sun, or traversal.\nprecipParticles[] own short-lived rain/snow presentation and motion.\nwind remains a small shared world field sampled independently by clouds and\nprecipitation; future smoke, foliage, waves, cloth, debris, etc. may sample the\nsame field without Weather knowing they exist.\nworldTime/daylight remain environmental facts. This pass does not redesign the\nexisting sun trajectory. Atmosphere samples available light; it does not own it.\nSurface wetness and soil moisture continue to react to rain impacts as separate\nworld systems.\n\nCLOUD VOCABULARY\nWeather cells can now realize several cheap particle/puff families: wispy high\ncloud, fair cumulus, broad overcast, and heavy storm mass. These are procedural\nvisual grammars rather than baked assets. Coverage, depth, softness, altitude,\nscale, and internal drift vary per cell.\n\nPRECIPITATION VOCABULARY\nPrecipitation is no longer synonymous with one cyan rain stroke. Cells may be\ndry, drizzle/light rain, heavy rain, or snow. Rain ranges from fine/fuzzy depth\nstreaks to discrete heavy drops; snow drifts and visibly samples wind. Intensity\nis continuous enough to produce variation without creating a meteorology engine.\n\nFIDELITY LESSON\nUgly-but-legible remains the preferred birth state for new ideas. Earned systems\nmay later gain reusable presentation grammars without deleting their cheap\nancestors. The worldbuilder should eventually be able to choose gesture, sketch,\nprimitive system, established grammar, or authored composition according to the\nworld and activity.\n\nCOMMUNICATION LESSON\nFinger paint and full evidence export are affordances, not privileged protocols.\nUse the cheapest communication channel that preserves relevant evidence: a mark,\na screenshot, a sentence, raw state, or a complete handoff specimen. Spatial\nevidence remains valuable when spatial ambiguity is the information.\n\nCURRENT DIRECTION\nThe valuable product of this proving ground is not its geography. It is portable\nworldbuilding vocabulary, composition constraints, interaction lessons, and\nmultiple fidelity registers. Future blank-world tests should ask what survives\nwhen this particular strip is discarded.\n\nPROSE PRESSURE \u2014 PUBLIC DOMAIN IN THE USA / PROJECT GUTENBERG #73181\n\"The vast huddle of sagging gambrel roofs and peaked gables conveyed with\noffensive clearness the idea of wormy decay...\"\n\"Stretching inland I saw the rusted, grass-grown line of the abandoned railway...\"\n\"Here and there the ruins of wharves jutted out from the shore...\"\n*/\nconst fail=document.querySelector('#fail');\nfunction showFail(kind,e){fail.style.display='block';fail.textContent='2D EXTENSIBLE WORLD \u2014 VISIBLE FAILURE\\n['+kind+']\\n'+(e?.stack||e?.message||String(e));}\naddEventListener('error',e=\u003eshowFail('window.error',e.error||e.message));\naddEventListener('unhandledrejection',e=\u003eshowFail('unhandledrejection',e.reason));\n\nconst c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false});\nlet W=1,H=1,dpr=1,cameraX=0,mode='walk',drag=null,last=performance.now(),capturingFullStrip=false;\nconst PALETTE=['#e53935','#f57c00','#f6d743','#9acd32','#2e9b50','#168f88','#28c7d9','#2868d7','#7048b8','#d13fa6','#f07aa8','#7b5233','#d2b48c','#8b9297','#f3efe2','#151719'];\nlet paintStrokes=[],paintColor=PALETTE[6],activeStroke=null;\nconst WORLD=5200, SEA_START=4420, BASE=0.69;\nlet terrain=[],structures=[],traveler,inhabitants=[],stars=[];\nlet soilPatches=[],plants=[],precipParticles=[],rainDrops=precipParticles,weatherCells=[],surfaceWetness=[],worldTime=0,wind=18;\nlet biomeRegions=[],backgroundRanges=[],lakes=[],forestBands=[];\nconst ECO_X0=505,ECO_X1=760;\n\n\nfunction rnd(seed){let x=seed|0;return()=\u003e{x^=x\u003c\u003c13;x^=x\u003e\u003e\u003e17;x^=x\u003c\u003c5;return((x\u003e\u003e\u003e0)/4294967296)}}\nconst R=rnd(1927);\nfunction groundSeed(x){\n  let y=BASE*H;\n  y+=Math.sin(x*.0031)*18+Math.sin(x*.0107)*7;\n  y-=42*Math.exp(-(((x-850)/430)**2));\n  y+=22*Math.exp(-(((x-2600)/500)**2));\n  if(x\u003e3650)y+=(x-3650)*.025;\n  // A cheap lake basin: terrain still exists beneath water, but ordinary walking does not treat it as ground.\n  if(x\u003e2050\u0026\u0026x\u003c2420){const t=(x-2050)/370;y+=54*Math.sin(t*Math.PI)}\n  if(x\u003eSEA_START)y=H*.72;\n  return y;\n}\nfunction gy(x){\n  x=Math.max(0,Math.min(WORLD-1,Math.round(x)));\n  return terrain[x] ?? groundSeed(x);\n}\nfunction reset(){\n  terrain=new Array(WORLD);\n  for(let x=0;x\u003cWORLD;x++)terrain[x]=groundSeed(x);\n  structures=[];paintStrokes=[];activeStroke=null;\n  // Bridge and settlement are world structures, not painted backdrop.\n  structures.push({k:'bridge',x:1770,w:190,y:gy(1770)-18});\n  // T0.5: one explicit lake interruption and a spanning bridge that restores traversal.\n  structures.push({k:'lakeBridge',x:2050,w:370,deckY:H*.645});\n  const houses=[\n    [2920,125,88],[3090,105,72],[3240,145,102],[3430,92,68],[3560,130,86],[3750,112,74],[3910,150,94]\n  ];\n  houses.forEach((q,i)=\u003estructures.push({k:'house',x:q[0],w:q[1],h:q[2],decay:.15+(i%4)*.18,seed:i+2}));\n  structures.push({k:'mill',x:4050,w:210,h:122,seed:44});\n  structures.push({k:'wharf',x:4330,w:330, imen. Rain amount is independent of motion.\n      let dev=.08,moist=.08,rainAmount=0,severeWind=0;\n      if(t\u003c.14){const u=t/.14;dev=.08+.12*u;moist=.08+.08*u}\n      else if(t\u003c.28){const u=(t-.14)/.14;dev=.20+.36*u;moist=.16+.28*u}\n      else if(t\u003c.38){const u=(t-.28)/.10;dev=.56+.10*u;moist=.44+.12*u;rainAmount=.02+.10*u}\n      else if(t\u003c.50){const u=(t-.38)/.12;dev=.66+.10*u;moist=.56+.16*u;rainAmount=.12+.22*u}\n      else if(t\u003c.62){const u=(t-.50)/.12;dev=.76+.10*u;moist=.72+.12*u;rainAmount=.34+.30*u}\n      else if(t\u003c.74){const u=(t-.62)/.12;dev=.86+.10*u;moist=.84+.14*u;rainAmount=.64+.32*u;severeWind=.15+.85*u}\n      else if(t\u003c.82){const u=(t-.74)/.08;dev=.96-.10*u;moist=.98-.10*u;rainAmount=.96-.16*u;severeWind=1-u}\n      else if(t\u003c.91){const u=(t-.82)/.09;dev=.86-.30*u;moist=.88-.35*u;rainAmount=.80-.62*u}\n      else {const u=(t-.91)/.09;dev=.56-.48*u;moist=.53-.45*u;rainAmount=.18*(1-u)}\n      w.development=dev;w.moisture=moist;w.rainAmount=rainAmount;w.severeWind=severeWind;\n      w.turbulence=Math.max(.05,Math.min(.90,.06+dev*.30+severeWind*.38));\n      w.cover=Math.max(.06,Math.min(.98,.08+dev*.70+moist*.18));\n    }else{\n      // Ordinary regions evolve continuously without named state transitions.\n      const life=.5+.5*Math.sin(w.phase*.47+w.seed*.013);\n      const pulse=.5+.5*Math.sin(w.phase*.19+w.seed*.031);\n      w.development=Math.max(.08,Math.min(.98,(w.seed===203?.40:.20)+life*(w.seed===203?.58:.38)));\n      w.moisture=Math.max(.05,Math.min(.98,(w.seed===203?.46:.18)+pulse*(w.seed===203?.50:.48)));\n      w.cover=Math.max(.10,Math.min(.96,.16+w.development*.68+w.moisture*.18));\n    }\n  }\n  // Falling rain is reconstructible presentation. Consequences sample the authoritative field directly.\n  for(let i=0;i\u003csurfaceWetness.length;i++){\n    const wx=i*65+32,a=atmosphereAt(wx);\n    if(a.rain\u003e.05)surfaceWetness[i]=Math.min(1,(surfaceWetness[i]||0)+dt*.00012*a.rain);\n  }\n  for(const soil of soilPatches){\n    const a=atmosphereAt((soil.x+soil.x2)*.5);\n    if(a.rain\u003e.05)soil.moisture=Math.min(soil.capacity,soil.moisture+dt*.000055*a.rain);\n  }\n  for(let i=0;i\u003csurfaceWetness.length;i++)surfaceWetness[i]=Math.max(0,surfaceWetness[i]-dt*.000035);\n  for(const soil of soilPatches)soil.moisture=Math.max(0,soil.moisture-dt*.000018);\n  for(const p of plants){const soil=soilAt(p.x);if(!soil)continue;const drink=Math.min(soil.moisture,dt*.000018);soil.moisture-=drink;p.health=Math.max(.18,Math.min(1,p.health+(soil.moisture\u003e.10?dt*.00011:-dt*.00004)));p.age+=dt*.000045;p.growth=Math.min(1,p.growth+drink*2.8*p.health)}\n  const dx=traveler.target-traveler.x;if(Math.abs(dx)\u003e2)traveler.x+=Math.sign(dx)*Math.min(Math.abs(dx),dt*.10);traveler.y=walkSurfaceY(traveler.x)-13;\n  for(const a of inhabitants){a.phase+=dt*.001;a.rest-=dt*.001;if(a.rest\u003c=0\u0026\u0026Math.abs(a.target-a.x)\u003c4){a.target=a.home+(R()-.5)*170;a.rest=.8+R()*3}\n    const d=a.target-a.x;if(a.rest\u003c=0\u0026\u0026Math.abs(d)\u003e2)a.x+=Math.sign(d)*dt*.018;a.y=gy(a.x)-11}\n}\nfunction draw(){\n  drawSky();drawBackground();drawWeather();drawTerrain();drawBiomes();drawEcology();\n  for(const o of structures)drawStructure(o);\n  for(const a of inhabitants)drawPerson(a,false);drawPerson(traveler,true);drawPaint();\n  // foreground marsh grass near coast\n  g.strokeStyle='#5e6654';g.lineWidth=1;for(let x=Math.max(4200,Math.floor(cameraX/18)*18);x\u003cMath.min(WORLD,cameraX+W);x+=18){const X=sx(x),Y=gy(x);g.beginPath();g.moveTo(X,Y);g.lineTo(X-3,Y-12-(x%11));g.moveTo(X,Y);g.lineTo(X+4,Y-9-(x%7));g.stroke()}\n}\nfunction frame(now){const dt=Math.min(40,now-last);last=now;update(dt);draw();requestAnimationFrame(frame)}\nfunction setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=\u003eb.classList.toggle('on',b.dataset.mode===m));document.querySelector('#status').textContent=m==='walk'?'the traveler can commit to a destination':m==='dig'?'touch the earth to cut it':m==='timber'?'drag across the world to lay a beam':m==='lamp'?'touch the world to leave a lamp':'finger paint: marks persist in world coordinates'}\ndocument.querySelectorAll('[data-mode]').forEach(b=\u003eb.onclick=()=\u003esetMode(b.dataset.mode));\ndocument.querySelector('#home').onclick=()=\u003e{cameraX=Math.max(0,Math.min(WORLD-W,traveler.x-W*.35))};\ndocument.querySelector('#reset').onclick=reset;\ndocument.querySelector('#export').onclick=exportEvidence;\nbuildPalette();\n\nfunction resolveWalkTarget(from,to){if(isWalkable(to))return Math.max(10,Math.min(SEA_START-40,to));const l=lakeAt(to);if(!l)return to;const b=structures.find(o=\u003eo.k==='lakeBridge'\u0026\u0026o.x\u003c=l.x\u0026\u0026o.x+o.w\u003e=l.x2);if(b)return Math.max(b.x+8,Math.min(b.x+b.w-8,to));return from\u003cl.x?l.x-8:l.x2+8}\nfunction worldPoint(e){return{x:e.clientX+cameraX,y:e.clientY}}\nconst DRAG_SLOP=12;\nfunction commitTapGesture(d,p,e){\n  if(mode==='walk'\u0026\u0026e.clientY\u003egy(p.x)-65)traveler.target=resolveWalkTarget(traveler.x,p.x);\n  else if(mode==='dig'\u0026\u0026e.clientY\u003egy(p.x)-35){for(let x=Math.max(0,p.x-34);x\u003cMath.min(WORLD,p.x+34);x++){const q=(x-p.x)/34;terrain[Math.floor(x)]+=24*(1-q*q)}}\n  else if(mode==='lamp')structures.push({k:'lamp',x:p.x,y:Math.min(p.y,gy(p.x))-2});\n  else if(mode==='timber')structures.push({k:'timber',x:d.wx,y:Math.min(d.wy,gy(d.wx)-3),x2:p.x,y2:Math.min(p.y,gy(p.x)-3)});\n  else if(mode==='paint'){paintStrokes.push({color:paintColor,points:[p]});}\n}\nc.addEventListener('pointerdown',e=\u003e{c.setPointerCapture?.(e.pointerId);const p=worldPoint(e);drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,lastX:e.clientX,wx:p.x,wy:p.y,moved:false,dragging:false};});\nc.addEventListener('pointermove',e=\u003e{if(!drag||drag.id!==e.pointerId)return;\n  const total=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy);\n  if(!drag.dragging\u0026\u0026total\u003e=DRAG_SLOP){drag.dragging=true;drag.moved=true;activeStroke=null;}\n  if(drag.dragging){const dx=e.clientX-drag.lastX;cameraX=Math.max(0,Math.min(WORLD-W,cameraX-dx));}\n  drag.lastX=e.clientX;\n});\nc.addEventListener('pointerup',e=\u003e{if(!drag||drag.id!==e.pointerId)return;const p=worldPoint(e);\n  if(!drag.dragging)commitTapGesture(drag,p,e);\n  activeStroke=null;drag=null;\n});\nc.addEventListener('pointercancel',()=\u003e{drag=null;activeStroke=null});\nc.addEventListener('wheel',e=\u003e{e.preventDefault();cameraX=Math.max(0,Math.min(WORLD-W,cameraX+e.deltaY+e.deltaX))},{passive:false});\naddEventListener('resize',resize,{passive:true});\nresize();\nstars.length=0;for(let i=0;i\u003c90;i++)stars.push({x:R()*W,y:25+R()*H*.35});\nrequestAnimationFrame(frame);\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"extensible-world-handoff\"\u003e\n2D EXTENSIBLE WORLD \u2014 T0.1 / FIRST INHABITED STRIP\n=================================================\nThe executable README lives in the source comment above and should be extended\nthere as the lab changes. Keep this text/plain node as a short archaeological\nmarker for tools that search handoff blocks.\n\nT0 protected the lab by registering an empty independent substrate.\nT0.4 extends the causal ecology/weather probe for perceptual legibility.\nThe sun visibly crosses a compressed day/night sky; weather cells travel the full strip;\nrain is dense enough to read, slants with shared wind, and temporarily wets any terrain;\nlocal soil holds moisture and individual plants visibly grow in response. These remain tiny systems,\nnot generalized climate, hydrology, farming, biome, or material engines. Paint remains\nuninterpreted world-coordinate evidence for the next request.\n\u003c/script\u003e\n\u003cscript type=\"text/plain\" id=\"extensible-world-handoff\"\u003e\n2D \u00b7 EXTENSIBLE WORLD \u2014 T0.2 PURPLE CRAYON HANDOFF\nFinger paint is an uninterpreted spatial request language. Sixteen pigments have no encoded semantics. The human may paint desired world state or desired capability directly over the running world. Future implementation should infer meaning from composition, adjacency, repetition, world context, and prose pressure rather than decode colors as a legend. Export Evidence captures complete authoritative strip state, all marks including offscreen marks, observer viewport/camera metadata, a full-strip raster, viewport raster, palette, and this handoff. It is evidence for the next incarnation, not a canonical save/load contract. Do not add brush taxonomy or save migration until play earns them.\n\u003c/script\u003e\n\u003c/body\u003e\u003c/html\u003e"},{"id":"2d-substance","title":"2D \u00b7 SUBSTANCE","kind":"2D Canvas","source":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\" /\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\" /\u003e\n\u003ctitle\u003eWorld Lab \u2014 2D V0 \u00b7 Stable Substance\u003c/title\u003e\n\u003cstyle\u003e\n  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;touch-action:none;font-family:system-ui,sans-serif}\n  canvas{display:block;width:100%;height:100%;touch-action:none}\n  #hud{position:fixed;left:10px;top:10px;z-index:3;color:#eee;background:#101217cc;border:1px solid #ffffff25;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.35;pointer-events:none;max-width:min(420px,75vw)}\n  #buttons{position:fixed;right:10px;top:10px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:52vw}\n  button{touch-action:none;border:1px solid #ffffff35;background:#171a20;color:#eee;border-radius:999px;padding:9px 12px;font-weight:700}\n  button.active{background:#eee;color:#111}\n  #fail{display:none;position:fixed;inset:0;z-index:99;background:#160b0bee;color:#ffb8b8;padding:18px;white-space:pre-wrap;overflow:auto;font:13px ui-monospace,monospace}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003ccanvas id=\"c\"\u003e\u003c/canvas\u003e\n\u003cdiv id=\"hud\"\u003e\u003cb\u003eWORLD LAB \u2014 2D V0 \u00b7 STABLE SUBSTANCE\u003c/b\u003e\u003cbr\u003eRIP: one finger reshapes; two fingers pull topology apart.\u003cbr\u003eLAVA: drag to spray ballistic material. Double-tap: reset.\u003c/div\u003e\n\u003cdiv id=\"buttons\"\u003e\u003cbutton id=\"rip\" class=\"active\"\u003eRIP\u003c/button\u003e\u003cbutton id=\"lava\"\u003eLAVA\u003c/button\u003e\u003cbutton id=\"reset\"\u003eRESET\u003c/button\u003e\u003c/div\u003e\n\u003cdiv id=\"fail\"\u003e\u003c/div\u003e\n\u003cscript\u003e\n/*\nTOUCH PROBE T0.1 \u2014 STABLE SUBSTANCE / DETACHED DEBRIS\nHYPOTHESIS\n- The world is a persistent solid field, not a granular pile under gravity.\n- Touch edits topology directly. Only material liberated by a violent rip becomes dynamic debris.\n- Lava is independent ballistic matter and may accumulate on the current solid boundary.\nINTERACTION\n- RIP / one finger: directly gouge or shove the solid field.\n- RIP / two fingers: increasing separation opens a tear between the contacts.\n- LAVA: finger trajectory is an emitter; velocity is preserved rather than classified as a swipe.\nOWNERSHIP\n- solid: authoritative terrain occupancy bitmap. It never falls merely because gravity exists.\n- debris: detached transient matter, owns gravity.\n- lava: independent hot particles, owns ballistic motion/cooling/deposition.\nLESSON FROM T0\n- Treating every terrain sample as an unconstrained Verlet particle caused the entire authored world to collapse at boot.\n- Stability is therefore a substrate property. Gravity applies only after matter has been explicitly detached.\nINVARIANTS\n- No external libraries/assets. Single file. Visible diagnostics.\n- Preserve finger wobble as expressive input.\n- A probe must not silently redefine the substrate it is testing.\n*/\nconst fail=document.querySelector('#fail');\nfunction showFail(kind,e){fail.style.display='block';fail.textContent='WORLD LAB 2D \u2014 VISIBLE FAILURE\\\\n['+kind+']\\\\n'+(e?.stack||e?.message||String(e));}\naddEventListener('error',e=\u003eshowFail('window.error',e.error||e.message));\naddEventListener('unhandledrejection',e=\u003eshowFail('unhandledrejection',e.reason));\n\nconst canvas=document.querySelector('#c'),ctx=canvas.getContext('2d',{alpha:false});\nlet W=1,H=1,dpr=1,mode='rip',lastTap=0;\nconst pointers=new Map(), debris=[], lava=[];\nlet solid,mask,MW=1,MH=1,S=5,groundY=1;\n\nfunction resize(){\n  dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;\n  canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);\n  reset();\n}\nfunction idx(x,y){return y*MW+x}\nfunction inside(x,y){return x\u003e=0\u0026\u0026y\u003e=0\u0026\u0026x\u003cMW\u0026\u0026y\u003cMH}\nfunction isSolidCell(x,y){x=Math.floor(x);y=Math.floor(y);return inside(x,y)\u0026\u0026solid[idx(x,y)]!==0}\nfunction worldSolid(x,y){return isSolidCell(x/S,y/S)}\nfunction setSolidCell(x,y,v){if(inside(x,y))solid[idx(x,y)]=v?1:0}\nfunction reset(){\n  debris.length=0;lava.length=0;pointers.clear();\n  S=Math.max(4,Math.min(6,Math.round(Math.min(W,H)/130)));\n  MW=Math.ceil(W/S);MH=Math.ceil(H/S);solid=new Uint8Array(MW*MH);mask=new Uint8Array(MW*MH);\n  groundY=Math.floor(H*.66/S);\n  for(let x=0;x\u003cMW;x++){\n    const wx=x*S;\n    const h=(32*Math.exp(-Math.pow((wx-W*.32)/(W*.12),2))+45*Math.exp(-Math.pow((wx-W*.72)/(W*.15),2)))/S;\n    const top=Math.max(2,Math.floor(groundY-h));\n    for(let y=top;y\u003cMH;y++)solid[idx(x,y)]=1;\n  }\n}\nfunction carveDisk(wx,wy,r,liberate=0,impulseX=0,impulseY=0){\n  const cx=wx/S,cy=wy/S,rr=r/S, xmin=Math.floor(cx-rr),xmax=Math.ceil(cx+rr),ymin=Math.floor(cy-rr),ymax=Math.ceil(cy+rr);\n  for(let y=ymin;y\u003c=ymax;y++)for(let x=xmin;x\u003c=xmax;x++){\n    if(!inside(x,y)||!solid[idx(x,y)])continue;\n    const dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy\u003err*rr)continue;\n    solid[idx(x,y)]=0;\n    if(liberate\u0026\u0026Math.random()\u003cliberate\u0026\u0026debris.length\u003c1000){\n      const d=Math.hypot(dx,dy)||1;\n      debris.push({x:(x+.5)*S,y:(y+.5)*S,vx:impulseX+(dx/d)*(1+Math.random()*2),vy:impulseY+(dy/d)*(1+Math.random()*2)-1.5,life:280+Math.random()*220,r:1.4+Math.random()*2.2});\n    }\n  }\n}\nfunction depositDisk(wx,wy,r){\n  const cx=wx/S,cy=wy/S,rr=r/S;\n  for(let y=Math.floor(cy-rr);y\u003c=Math.ceil(cy+rr);y++)for(let x=Math.floor(cx-rr);x\u003c=Math.ceil(cx+rr);x++){\n    if(!inside(x,y))continue;const dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy\u003c=rr*rr)setSolidCell(x,y,1);\n  }\n}\nfunction gouge(x,y,dx,dy){\n  const speed=Math.hypot(dx,dy), steps=Math.max(1,Math.ceil(speed/5));\n  for(let i=0;i\u003c=steps;i++){\n    const t=i/steps,px=x-dx*(1-t),py=y-dy*(1-t);\n    carveDisk(px,py,13+Math.min(10,speed*.18),speed\u003e12?.045:0,dx*.045,dy*.045);\n    // Material is pushed to the far side of the gesture rather than making the whole world dynamic.\n    if(speed\u003e2)depositDisk(px+dx*.75,py+dy*.75,7+Math.min(6,speed*.1));\n  }\n}\nfunction tear(a,b,pa,pb){\n  const sep=Math.hypot(a.x-b.x,a.y-b.y),old=Math.hypot(pa.x-pb.x,pa.y-pb.y);if(sep\u003c=old+.4)return;\n  const grow=Math.min(18,sep-old), mx=(a.x+b.x)/2,my=(a.y+b.y)/2;\n  const vx=(b.x-a.x)/(sep||1),vy=(b.y-a.y)/(sep||1),nx=-vy,ny=vx;\n  // Open a slit perpendicular to the line joining the two grabbing fingers. As hands separate, the slit widens.\n  const length=Math.min(150,Math.max(36,sep*.8));\n  for(let t=-length/2;t\u003c=length/2;t+=S*.7){\n    const px=mx+nx*t,py=my+ny*t;\n    carveDisk(px,py,5+Math.min(16,grow*.8),.055,vx*(Math.random()\u003c.5?-1:1)*grow*.12,-grow*.05);\n  }\n}\nfunction spray(x,y,vx,vy){\n  const base=Math.atan2(vy,vx||.001),gesture=Math.min(16,Math.hypot(vx,vy));\n  for(let i=0;i\u003c4;i++){\n    const ang=base+(Math.random()-.5)*.5,sp=3.5+Math.random()*4.5+gesture*.12;\n    lava.push({x,y,vx:Math.cos(ang)*sp+vx*.18,vy:Math.sin(ang)*sp+vy*.18-1.2,life:480+Math.random()*360,r:2.2+Math.random()*3.2,hot:1});\n  }\n  if(lava.length\u003e2200)lava.splice(0,lava.length-2200);\n}\nfunction collideParticle(q,canDeposit){\n  if(!worldSolid(q.x,q.y))return false;\n  // Back out along velocity until just outside the solid.\n  for(let k=0;k\u003c8\u0026\u0026worldSolid(q.x,q.y);k++){q.x-=q.vx*.16;q.y-=q.vy*.16;}\n  if(canDeposit\u0026\u0026q.hot\u003e.22\u0026\u0026Math.random()\u003c.018){depositDisk(q.x,q.y,Math.max(2,q.r*.65));q.life=0;return true;}\n  q.vx*=.45;q.vy*=-.18;q.hot*=.96;return true;\n}\nfunction step(){\n  for(let i=debris.length-1;i\u003e=0;i--){const q=debris[i];q.vy+=.18;q.vx*=.995;q.x+=q.vx;q.y+=q.vy;q.life--;\n    if(worldSolid(q.x,q.y)){q.y-=q.vy;q.vy*=-.22;q.vx*=.5;if(Math.abs(q.vy)\u003c.3){depositDisk(q.x,q.y,q.r);q.life=0;}}\n    if(q.y\u003eH+20||q.life\u003c=0)debris.splice(i,1);\n  }\n  for(let i=lava.length-1;i\u003e=0;i--){const q=lava[i];q.vy+=.13;q.vx*=.998;q.x+=q.vx;q.y+=q.vy;q.life--;q.hot*=.9975;collideParticle(q,true);\n    if(q.y\u003eH+30||q.x\u003c-30||q.x\u003eW+30||q.life\u003c=0)lava.splice(i,1);\n  }\n}\nfunction buildSurfaceMask(){\n  mask.fill(0);\n  for(let y=0;y\u003cMH;y++)for(let x=0;x\u003cMW;x++)if(solid[idx(x,y)]){\n    if(!isSolidCell(x,y-1)||!isSolidCell(x-1,y)||!isSolidCell(x+1,y)||!isSolidCell(x,y+1))mask[idx(x,y)]=1;\n  }\n}\nfunction draw(){\n  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#11151c');sky.addColorStop(.65,'#17141a');sky.addColorStop(1,'#080808');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);\n  buildSurfaceMask();\n  ctx.fillStyle='#594535';\n  for(let y=0;y\u003cMH;y++){let run=-1;for(let x=0;x\u003c=MW;x++){const on=x\u003cMW\u0026\u0026solid[idx(x,y)];if(on\u0026\u0026run\u003c0)run=x;if((!on||x===MW)\u0026\u0026run\u003e=0){ctx.fillRect(run*S,y*S,(x-run)*S,S+.5);run=-1;}}}\n  ctx.fillStyle='#8b684c';\n  for(let y=0;y\u003cMH;y++)for(let x=0;x\u003cMW;x++)if(mask[idx(x,y)])ctx.fillRect(x*S,y*S,S,S*.42);\n  // detached earth\n  ctx.fillStyle='#9b7757';ctx.beginPath();for(const q of debris){ctx.moveTo(q.x+q.r,q.y);ctx.arc(q.x,q.y,q.r,0,Math.PI*2)}ctx.fill();\n  // lava glow + core\n  ctx.globalCompositeOperation='lighter';for(const q of lava){ctx.fillStyle=`rgba(255,50,5,${.1*Math.max(0,q.hot)})`;ctx.beginPath();ctx.arc(q.x,q.y,q.r*3.2,0,Math.PI*2);ctx.fill();}\n  ctx.fillStyle='#ff6516';ctx.beginPath();for(const q of lava){ctx.moveTo(q.x+q.r,q.y);ctx.arc(q.x,q.y,q.r,0,Math.PI*2)}ctx.fill();\n  ctx.fillStyle='#ffd66f';ctx.beginPath();for(let i=0;i\u003clava.length;i+=3){const q=lava[i];ctx.moveTo(q.x+1.1,q.y);ctx.arc(q.x,q.y,1.1,0,Math.PI*2)}ctx.fill();ctx.globalCompositeOperation='source-over';\n  if(mode==='rip'\u0026\u0026pointers.size===2){const a=[...pointers.values()];ctx.strokeStyle='#ffffff55';ctx.lineWidth=1;ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(a[0].x,a[0].y);ctx.lineTo(a[1].x,a[1].y);ctx.stroke();ctx.setLineDash([]);}\n}\nfunction frame(){step();draw();requestAnimationFrame(frame)}\nfunction setMode(m){mode=m;document.querySelector('#rip').classList.toggle('active',m==='rip');document.querySelector('#lava').classList.toggle('active',m==='lava');}\ndocument.querySelector('#rip').onclick=()=\u003esetMode('rip');document.querySelector('#lava').onclick=()=\u003esetMode('lava');document.querySelector('#reset').onclick=reset;\ncanvas.addEventListener('pointerdown',e=\u003e{canvas.setPointerCapture(e.pointerId);const now=performance.now();if(now-lastTap\u003c280\u0026\u0026pointers.size===0)reset();lastTap=now;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY});if(mode==='lava')spray(e.clientX,e.clientY,0,-11);});\ncanvas.addEventListener('pointermove',e=\u003e{const p=pointers.get(e.pointerId);if(!p)return;const ox=p.x,oy=p.y;p.px=ox;p.py=oy;p.x=e.clientX;p.y=e.clientY;const dx=p.x-ox,dy=p.y-oy;if(mode==='lava')spray(p.x,p.y,dx*1.45,dy*1.45-2.5);else if(pointers.size===1)gouge(p.x,p.y,dx,dy);else if(pointers.size===2){const v=[...pointers.values()];tear(v[0],v[1],{x:v[0].px,y:v[0].py},{x:v[1].px,y:v[1].py});}});\nfunction up(e){pointers.delete(e.pointerId)}canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);\naddEventListener('resize',resize);resize();frame();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"id":"3d-volumetric","title":"3D \u00b7 VOLUMETRIC","kind":"Three.js","source":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\"\u003e\n\u003ctitle\u003eWorld Lab \u2014 V0 Shared Spatial Laboratory\u003c/title\u003e\n\u003cstyle\u003e\nhtml,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9c8c7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;left:10px;top:10px;z-index:10;max-width:min(650px,calc(100vw - 20px));padding:8px 10px;border:1px solid #31413a33;border-radius:9px;background:#eee7d1d8;color:#26352e;font-size:10px;line-height:1.35}#hud b{font-size:11px;letter-spacing:.04em}.row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}button{font:10px ui-monospace,monospace;border:1px solid #52605788;border-radius:6px;background:#f3eddc;color:#26352e;padding:6px 9px}button.on{background:#394c42;color:#f5f0df}#status{opacity:.72;margin-top:4px}#gpu{opacity:.58;margin-top:2px}#note{position:fixed;right:10px;bottom:9px;color:#273a3277;font-size:10px;pointer-events:none;text-align:right}#fault{display:none;position:fixed;z-index:100;left:10px;right:10px;bottom:10px;max-height:45vh;overflow:auto;white-space:pre-wrap;padding:12px;border:2px solid #76261e;border-radius:8px;background:#f5dfcf;color:#501a16;font:12px/1.35 ui-monospace,monospace}\n\u003c/style\u003e\u003cscript\u003e(function(){window.__LM_FAIL__=(scope,err)=\u003e{const e=document.getElementById('fault');if(!e)return;const m=err\u0026\u0026(err.stack||err.message)?(err.stack||err.message):String(err);e.style.display='block';e.textContent='LIVING MINIATURES \u2014 VISIBLE FAILURE\\n['+scope+']\\n'+m};addEventListener('error',e=\u003ewindow.__LM_FAIL__('window.error',e.error||e.message));addEventListener('unhandledrejection',e=\u003ewindow.__LM_FAIL__('unhandledrejection',e.reason));})();\u003c/script\u003e\u003c/head\u003e\u003cbody\u003e\n\u003ccanvas id=\"stage\"\u003e\u003c/canvas\u003e\u003cdiv id=\"hud\"\u003e\u003cb\u003eWORLD LAB \u2014 V0 \u00b7 SHARED SPATIAL LABORATORY\u003c/b\u003e\u003cdiv class=\"row\"\u003e\u003cbutton data-mode=\"orbit\"\u003eLOOK\u003c/button\u003e\u003cbutton id=\"viewPreset\"\u003eVIEW \u00b7 MINIATURE\u003c/button\u003e\u003cbutton data-mode=\"raise\"\u003eRAISE\u003c/button\u003e\u003cbutton data-mode=\"carve\" class=\"on\"\u003eCARVE\u003c/button\u003e\u003cbutton data-mode=\"smooth\"\u003eSMOOTH\u003c/button\u003e\u003cbutton id=\"meteor\"\u003e\u2604 METEOR\u003c/button\u003e\u003cbutton id=\"swords\"\u003e\u2694 SWORDS\u003c/button\u003e\u003cbutton id=\"recover\" title=\"Rebuild renderer after a recoverable graphics failure\"\u003eRECOVER\u003c/button\u003e\u003cbutton id=\"reset\"\u003eRESET\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"status\"\u003ebooting volumetric field\u2026\u003c/div\u003e\u003cdiv id=\"gpu\"\u003egraphics: starting\u2026\u003c/div\u003e\u003c/div\u003e\u003cpre id=\"fault\"\u003e\u003c/pre\u003e\u003cdiv id=\"note\"\u003eone persistent world \u00b7 VIEW changes lens, not world\u003cbr\u003eterrain is substance \u00b7 two fingers pan/pinch \u00b7 wheel/pinch zoom\u003c/div\u003e\n\u003cscript type=\"module\"\u003e\nimport * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';\nconst canvas=document.getElementById('stage'),status=document.getElementById('status'),fail=(s,e)=\u003ewindow.__LM_FAIL__(s,e),clamp=(x,a,b)=\u003eMath.max(a,Math.min(b,x));\nclass RNG{constructor(s=1){this.s=s\u003e\u003e\u003e0||1}next(){let x=this.s;x^=x\u003c\u003c13;x^=x\u003e\u003e\u003e17;x^=x\u003c\u003c5;this.s=x\u003e\u003e\u003e0;return this.s/4294967296}}\nfunction hash2(x,y,s=0){let n=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;n^=n\u003e\u003e\u003e13;n=Math.imul(n,1274126177);return((n^(n\u003e\u003e\u003e16))\u003e\u003e\u003e0)/4294967295}function noise(x,y,s=0){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=hash2(ix,iy,s),b=hash2(ix+1,iy,s),c=hash2(ix,iy+1,s),d=hash2(ix+1,iy+1,s);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a,b,u),THREE.MathUtils.lerp(c,d,u),v)}function fbm(x,y,s=0){let v=0,a=.55,f=1;for(let i=0;i\u003c4;i++){v+=a*noise(x*f,y*f,s+i*19);f*=2.03;a*=.48}return v}\nclass Atelier{static rock(seed=91){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),r=new RNG(seed);g.fillStyle='#80745d';g.fillRect(0,0,256,256);for(let i=0;i\u003c7000;i++){const q=r.next(),x=r.next()*256,y=r.next()*256,w=.5+r.next()*4;g.globalAlpha=.025+r.next()*.12;g.fillStyle=q\u003e.5?'#b2a078':'#4b5044';g.beginPath();g.ellipse(x,y,w*2.4,w*.5,r.next()*Math.PI,0,Math.PI*2);g.fill()}g.globalAlpha=.13;g.strokeStyle='#45473d';for(let i=0;i\u003c45;i++){let x=r.next()*256,y=r.next()*256;g.beginPath();g.moveTo(x,y);for(let k=0;k\u003c5;k++){x+=10+r.next()*28;y+=(r.next()-.5)*13;g.lineTo(x,y)}g.stroke()}g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(7,7);t.anisotropy=4;return t}}\nconst NX=30,NY=22,NZ=30, MIN=new THREE.Vector3(-45,-24,-45),MAX=new THREE.Vector3(45,30,45),field=new Float32Array(NX*NY*NZ),initial=new Float32Array(field.length);const idx=(x,y,z)=\u003ex+NX*(y+NY*z),wp=(x,y,z)=\u003enew THREE.Vector3(THREE.MathUtils.lerp(MIN.x,MAX.x,x/(NX-1)),THREE.MathUtils.lerp(MIN.y,MAX.y,y/(NY-1)),THREE.MathUtils.lerp(MIN.z,MAX.z,z/(NZ-1)));\nfunction seedField(){for(let z=0;z\u003cNZ;z++
