e station topology or resolve Room 001's metric location.\n\nV1.35 STARTUP REPAIR \u2014 PROXY USES THE ACTUAL HULL TEXTURE FACTORY\nV1.34 referenced a nonexistent `makeSurfaceTexture()` helper. Because the proxy is constructed during startup, that ReferenceError aborted the optional frame/proxy stage and triggered the visible FRAME LAYER ERROR fallback.\nThe situated exterior proxy now uses the already-established `makeHullTexture(seed)` factory\u2014the same procedural hull skin vocabulary used by station modules. No new texture factory or startup dependency is introduced.\nThis is a runtime-name failure that static syntax checking cannot detect; optional visual additions must call existing substrate APIs by their actual names.\n\nV1.34 WINDOW COMPOSITION CORRECTION \u2014 RIGHT-ANCHORED, SIDE-ON ARCHITECTURE\nThe Room 001 exterior proxy is recomposed rather than metrically solved. Habitat Arm West now runs perpendicular to the window/view axis and occupies a substantial lower-right span. Habitat Drum B is placed beyond it at the right corner, side-on and intended to remain fully legible rather than peeking above the sill.\nThe proxy no longer attempts to discover texture maps through module userData. It owns procedural CanvasTextures generated by the same surface-texture factory and semantic seeds, so its pressure skins visibly participate in TEXTURE ON/OFF.\nThis remains a situated view representation, not a declaration of Room 001's exact coordinates.\n\nV1.33 SITUATED EXTERIOR PROXY \u2014 VISIBILITY WITHOUT METRIC COMMITMENT\nRoom 001's window now looks from a conceptual location somewhere along habitat-arm-forward across a composed proxy of habitat-arm-west and habitat-drum-b.\nThese are not authoritative duplicate world objects and do not establish Room 001 coordinates. They are a situated visual representation of already-known station architecture while the room's exact metric placement remains unresolved.\nThe proxy reuses the station's pressure-skin, orderly Detail, and orange Frame vocabulary. Its architecture is placed somewhat below the aperture sightline so textured and detailed exterior surfaces remain legible from human scale.\nDETAIL and TEXTURE controls propagate to the proxy. No planet, invented deck plan, new windows, or decorative exterior lore is introduced.\n\nV1.32 INTERIOR SKIN DELTA \u2014 SLIGHTLY STRONGER READ + SEMANTIC FASTENERS\nInterior procedural contrast is raised modestly rather than redesigned: panel seams, floor joints, work-surface lines, and wear haze read slightly more clearly at human scale.\nSmall rivet/fastener marks are introduced only along plausible shell panel seams and floor plate joints. They are texture information, not free-floating decoration, and do not appear on glass, frame, lights, door, or workbench legs.\nThe workbench skin remains comparatively restrained so the architecture establishes scale without every surface competing for attention.\n\nV1.31 STARTUP SAFETY \u2014 LATE SYSTEMS MAY NOT ENTER EARLY LEXICAL TDZ\nV1.30 broke startup because the exterior texture initializer called setAllTextures(true) before the later interior `const IM` binding had initialized. `typeof` does not protect access to a lexical binding inside its temporal dead zone.\nInterior material handles are now published only after construction through a startup-safe runtime registry. Early exterior initialization never touches the late interior binding; later user toggles synchronize both systems.\nThe base station and its debug fallback remain authoritative: an optional interior skin system must never prevent the substrate from booting.\n\nV1.30 INVARIANT \u2014 HUMAN-SCALE TEXTURE REMAINS SKIN\nRoom 001 gains three restrained procedural CanvasTexture families: manufactured wall/ceiling panels, broad industrial floor plates, and a finer utilitarian work-surface skin.\nThey alter only surface appearance. Room geometry, pressure openings, frame, door, workbench structure, lights, and glass remain independent.\nFrame, door, workbench legs, lights, and glass intentionally stay materially clean so procedural texture does not become procedural greeble.\nThe existing global TEXTURE control now governs these interior skins as well as exterior module skins.\n\nV1.29 INVARIANT \u2014 FRAME THICKNESS IS A TRUE EDGE OFFSET\nThe continuous viewport ring's outer boundary is computed by offsetting every aperture edge by a constant perpendicular distance and intersecting adjacent offset lines.\nThis preserves visually consistent frame thickness through both orthogonal and chamfered edges instead of making diagonal corners artificially fat.\n\nV1.29 SMALL INTERIOR DELTA \u2014 WORKBENCH LEG INSET REBALANCED\nThe V1.28 leg inset was too aggressive. Legs now sit halfway between their original and V1.28 positions: still visibly contained beneath the tabletop, but with a broader, more plausible stance.\n\nV1.28 INVARIANT \u2014 APERTURE FRAME IS ONE CONTINUOUS RING\nThe viewport frame is a single shallow extruded ring, not eight intersecting beam meshes.\nIts inner boundary is the canonical aperture path; its outer boundary is a small offset rectangular-octagonal loop.\nContinuous frame topology eliminates protruding member ends at chamfer junctions and keeps the entire viewport assembly derived from one semantic aperture.\n\nV1.28 SMALL INTERIOR DELTA \u2014 WORKBENCH LEG INSET\nWorkbench legs are inset slightly in both axes so their silhouettes remain visually contained beneath the work surface rather than clipping its visible edge.\n\nV1.27 INVARIANT \u2014 SHAPED OPENINGS ARE BOOLEAN TOPOLOGY, NOT ASSEMBLED TRIM\nRoom 001's front wall is one continuous planar structural mesh whose Shape contains the rectangular-octagonal viewport as a true hole.\nThe wall opening, glass silhouette, and structural frame are all derived from the same canonical eight-point aperture path.\nThere are no rectangular opening slabs, corner patches, or triangular infill pieces to drift apart under oblique viewing.\nThis establishes a reusable architectural primitive: a wall surface may own shaped pressure openings, and dependent glass/frame geometry derives from the opening definition rather than approximating it independently.\n\nV1.26 INVARIANT \u2014 VIEWPORT SHAPE IS STRUCTURAL\nRoom 001's exterior viewport is a wide rectangular octagon: the four corners of the former rectangular aperture are physically chamfered.\nThe glass follows the same eight-edge aperture and the frame is authored as eight structural members, including four true diagonal corner members.\nThe octagonal silhouette belongs to the pressure boundary/window assembly itself; it is not cosmetic trim laid over rectangular glass.\n\nV1.25 INVARIANT \u2014 PINCH DIRECTLY ADDRESSES THE DOLLY TRACK\nInterior entry and reset begin at the midpoint of the permitted fore/aft camera track rather than at either extreme.\nA single two-finger pinch gesture is intentionally high-gain: from any current dolly position, one ordinary continuous pinch has sufficient range to reach either track endpoint.\nThe gesture is anchored to the dolly position at pinch start, so movement is continuous and does not accumulate across repeated pinch gestures.\nThe existing hard forward boundary and rear-wall safety boundary remain authoritative.\n\nV1.24 INVARIANT \u2014 CAMERA TRACK RESPECTS THE ROOM ENVELOPE\nRoom 001's rear half is extended without moving the window/front wall or canonical eye point.\nThe rear wall and its doorway move together because the doorway belongs to that boundary.\nThe permitted backward dolly grows by less than the room extension and retains a deliberate safety margin before the rear wall.\nA camera track must never terminate inside enclosing geometry; room-envelope changes and camera bounds are related semantic constraints.\n\nV1.23 INVARIANT \u2014 MOBILE INTERIOR CAMERA = LOOK + BOUNDED DOLLY\nThe interior mobile interaction vocabulary is intentionally small:\none-finger drag rotates gaze from a situated human-scale viewpoint;\ntwo-finger pinch controls a fore/aft camera dolly along the room's canonical axis.\nThe canonical eye point is the hard forward boundary. Dolly may retreat from it and may return to it, but may never advance farther into the room.\nThis preserves the successful fixed-camera feel while allowing the observer to back up for composition and spatial inspection.\nIf more retreat is needed, enlarge the room/camera allowance rather than weakening the forward boundary.\n\nV1.22 INVARIANT \u2014 INTERIOR OBSERVATION IS SITUATED LOOK\nExterior inspection and interior observation intentionally use different camera semantics.\nExterior one-finger drag orbits the observer around the station.\nInterior one-finger drag changes yaw/pitch of a fixed human-scale eye point; it never changes eye position, orbit radius, Room 001 transform, or StationRoot.\nPinch is not optical zoom in the interior: it is a bounded camera dolly. Wheel remains disabled for the interior probe.\nReset in interior mode restores the canonical eye position and forward gaze.\nA tap in interior mode does not perform exterior module selection.\n\nV1.22 LESSON \u2014 CAMERA BEHAVIOR IS PART OF WORLD SEMANTICS\nThe V1.21 escape bug showed that identical gestures cannot safely share identical spatial meaning across observational scales.\nInteraction controllers therefore belong to view semantics, not merely input plumbing.\nThe accidental free-camera view was useful development evidence but is not the normal interior experience.\n\nV1.21 INVARIANT \u2014 CONTAINMENT DOES NOT IMPLY COORDINATES\nRoom 001 is contained by Habitat Drum A but has no resolved metric placement, deck, azimuth, or exterior transform.\nIts local frame belongs to the station, while its exact location within the containing module remains unresolved until an experience requires resolution.\nThe exterior window establishes only that Room 001 has an exterior-facing view; exact window placement is unresolved.\nThe window may therefore use a station-world view representation without asserting a fabricated deck plan.\n\nV1.21 INVARIANT \u2014 OBSERVER TRANSFORMS ARE NOT WORLD TRANSFORMS\nExterior orbit is an inspection operation by the observer. It must not be interpreted as an in-world physical rotation event.\nInterior entry changes observational scale/view mode, not world state.\nRoom 001 remains station-local regardless of the exterior observer's last inspection angle.\n\nV1.21 INTERIOR PROBE\nThe first interior deliberately establishes only structural human-scale anchors: shell, floor, ceiling, one doorway, one work surface, one large exterior window, and functional light.\nNo interior texture, decorative clutter, interior greebling, complete deck plan, locomotion system, or avatar is implied.\nThe workbench is reserved as a future tangible-material staging surface.\n\nV1.20 INVARIANT \u2014 ORIENTATION IS A SEMANTIC NORMAL\nDirectional modules are authored once in a canonical local frame (+Z for EndCap) and the complete module is quaternion-aligned to an explicit outward normal.\nChild geometry must not independently encode world-axis cases or signs.\nThe outward normal is semantic module state and is stored on the EndCap.\nThis guarantees that pressure bulkhead, taper, Detail, and future hatch/window geometry all agree about \"outward.\"\nAxis-plus-sign special casing is obsolete for EndCap orientation.\n\nV1.19 LESSON \u2014 TERMINATIONS COME FROM TOPOLOGY, WITH ORIENTATION\nEnd caps must only occupy genuinely exposed pressure ports.\nA port already consumed by another module (the west arm into Drum B) must not also receive a cap.\nEvery termination must carry an explicit outward direction; V1.20 represents that direction as a semantic normal rather than axis-plus-sign special cases.\nThe central trunk has two exposed axial boundaries, so its top and bottom each receive correctly outward-facing caps.\nThe forward cap was already correct and is preserved.\nThis pass exposes the next architectural target: derive termination placement from port occupancy rather than maintaining a hand-authored cap list.\n\nV1.18 INVARIANT \u2014 END CAP IS A PRESSURE-TOPOLOGY MODULE\nAn EndCap is a semantic one-port PressureModule, not a loose decorative disk.\nIts inward port terminates an exposed pressure boundary with a heavy collar, recessed bulkhead, and shallow exterior cap.\nEnd caps inherit the same module-owned SurfaceMaterial and Detail systems as other architecture.\nThe current caps seal the forward and east-upper expansion ends plus the central trunk top and bottom. The west end is not capped because Drum B already consumes that connection.\nFuture one-port termination modules (window, airlock, docking port, equipment cap) can reuse the same connection grammar.\n\nV1.17 INVARIANT \u2014 FULL PRESSURE-SKIN TEXTURE + RESPONSIVE CONTROLS\nDETAIL and TEXTURE live in a wrapping control dock and cannot overlap on narrow displays.\n\nV1.16 INVARIANT \u2014 MODULE-OWNED SURFACE TEXTURE\nEach semantic module owns its PressureVolume surface-material state.\nProcedural CanvasTextures provide restrained plate variation, seams, service bands, and sparse wear.\nTexture covers the full exterior PressureVolume architecture of every module, including hulls, collars, belts and bulkheads; inward cavity shells remain clean. Structure and Detail remain independent.\nTEXTURE ON/OFF is an aggregate control over module-owned material states.\nPer-module texture control is exposed through stationToy.setTexture(id,on).\n\nV1.15 INVARIANT \u2014 DETAIL PROMOTED; EXPERIMENT SCAFFOLD REMOVED\nThe A/B greeble experiment is complete.\nLegacy hand-authored boxy Detail children are purged.\nThe winning generated style-guide field is now the canonical per-module Detail layer.\nDETAIL ON/OFF is the sole global visibility control.\nNo separate Greeble mode or Greeble UI remains.\n\nV1.14 STYLE GUIDE \u2014 UNIFORM MANUFACTURED SURFACE LANGUAGE\nThe generated reference image is now treated as the visual target.\nGreebles are organized, not sprinkled: regular panel stations, repeated rows/columns, embedded 3/4/5-bit arrays, and coherent three-pipe bundles.\nDrum panels and pipes follow curvature. Arm detail aligns to stable longitudinal surface lanes.\nDetail remains thin and subordinate to the hull.\nConnection points receive enlarged exclusion zones; generators reject detail near semantic ports and arm endpoints.\nThe uniform style-guide generator is canonical Detail; DETAIL ON/OFF is its sole global visibility control.\n\nV1.10 INVARIANT \u2014 NO ANONYMOUS JUNCTIONS\nThe legacy migration that promoted leftover pressure meshes into junction-\u003cuuid\u003e modules is removed.\nLoose collars/belts/bulkheads are not topology and are discarded instead of becoming selectable modules.\nA junction may exist only when explicitly authored as a named pressure module through the port/connection grammar.\n\nV1.9 INVARIANT \u2014 MODULES OWN PORTS; CONNECTIONS FOLLOW\nReusable PressureModule, DrumModule, PressurePort, and ArmConnection classes now hold connection rules once.\nDrum A has been moved farther east; Habitat Arm East derives its span from the trunk port to Drum A's west port.\nDrum B and Habitat Arm West now use the identical port-to-port connection mechanism.\nIndividual drums no longer encode special arm lengths.\n\nV1.8 INVARIANT \u2014 UNIVERSAL PRESSURE BRANCHES\nThere is no branch-riser module type. Risers, links, continuations, and branches are ordinary Habitat Arms.\nNew pressure arms are authored between explicit attachment surfaces via pressureArmBetween().\nA branch from a trunk begins at the trunk exterior surface; it does not originate at the trunk center and overlap outward.\nThe attachment relationship, not visual overlap, defines the connection.\n\nV1.7 INVARIANT \u2014 ENDPOINT-AUTHORED MODULE CONNECTIONS\nHabitat Arm East is no longer positioned by an independent center + nominal length.\nIts endpoints are derived from Central Trunk's exterior surface and Habitat Drum A's west attachment plane.\nThe arm therefore terminates at the drum surface instead of occupying the drum interior.\nIts derived frame and frame sockets consume the exact same connection length.\n\nV1.6 INVARIANT \u2014 DERIVED FRAME GRAMMAR\nOrange Structure.Frame geometry is derived from its owning PressureVolume, never authored as arbitrary free lines.\nArm frames use four exterior longitudinal rails plus end frames at radius + clearance.\nDrum frames use exterior rings and orthogonal tangent rails at radius + clearance.\nFrame sockets are generated from the same module-local profile.\nFuture cross-module continuity is socket-to-socket. Ordinary frame generation therefore cannot enter its own pressure volume.\nThe failed post-hoc collision/clipping approach is intentionally removed.\n\nV1.3 INVARIANT \u2014 LOCAL OWNERSHIP\nStationRoot is a transform/container only and owns no visible geometry.\nEvery visible object belongs to an addressable module.\nEach module owns PressureVolume, Structure.Primary, Structure.Frame, Detail, and AttachmentNodes.\nOrange frame geometry is module-local structural detail.\nAdjacent modules use matching frame-interface metadata so independent frames can visually continue across a joint.\nIf something spans modules and cannot belong cleanly to either, it must become an addressable junction/connector module.\n\nV1.1 DELTA \u2014 HOLLOW TOPOLOGY\n- The station's primary architecture is itself inhabitable.\n- Large hubs are hollow drum/chamber volumes, not pills.\n- Branching arms are hollow orthogonal pressure volumes, not rods or trusses.\n- Interiors are intentionally empty for now; hollow volume is the only interior requirement.\n- Every arm joins a hub/spine through visible collars and terminates at a physical bulkhead/attachment collar.\n- External trusses/braces/greebles are secondary support/detail layers, never substitutes for inhabited arms.\n- All primary architecture rial=cargoMaterialNames[matIndex%cargoMaterialNames.length];\n  g.name=id;g.position.set(...pos);g.rotation.y=rotY;\n  g.userData={semanticId:id,semanticType:'cargo-object',cargoKind:kind,label,materialIdentity:material,\n    provenance:{work:'The Time Machine',scope:'Chapters I\u2013VII material notebook',catalog:'Materials So Far',material}};\n  cargoGroup.add(g);return g;\n}\nfunction cargoBox(kind,label,pos,size,matIndex=0,rotY=0){\n  const g=cargoRoot(kind,label,pos,rotY,matIndex);\n  const m=new THREE.Mesh(new THREE.BoxGeometry(...size),cargoMats[matIndex%cargoMats.length]);\n  m.name=`${g.name}.body`;m.position.y=size[1]/2;g.add(m);return g;\n}\nfunction cargoCylinder(kind,label,pos,r,h,matIndex=1,rot=[0,0,0]){\n  const g=cargoRoot(kind,label,pos,0,matIndex);\n  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,14),cargoMats[matIndex%cargoMats.length]);\n  m.name=`${g.name}.body`;m.position.y=h/2;m.rotation.set(...rot);g.add(m);return g;\n}\nfunction cargoDomed(label,pos,r,h,matIndex=3){\n  const g=cargoRoot('domed-cylinder',label,pos,0,matIndex);\n  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,14),cargoMats[matIndex%cargoMats.length]);\n  body.name=`${g.name}.body`;body.position.y=h/2;g.add(body);\n  const dome=new THREE.Mesh(new THREE.SphereGeometry(r,14,8,0,Math.PI*2,0,Math.PI/2),cargoMats[matIndex%cargoMats.length]);\n  dome.name=`${g.name}.dome`;dome.position.y=h;g.add(dome);return g;\n}\n\n// Deck top is local y\u2248.475. Cargo roots sit there and own all of their geometry.\nconst cargoY=.505;\ncargoBox('cube','small-cube-a',[-.49,cargoY,-.17],[.22,.22,.22],0,.08);\ncargoBox('cube','small-cube-b',[-.25,cargoY,-.18],[.18,.18,.18],2,-.05);\ncargoBox('rectangular-box','long-billet-a',[.02,cargoY,-.20],[.42,.14,.16],1,.03);\ncargoBox('rectangular-box','tall-case',[.45,cargoY,-.17],[.20,.34,.18],0,-.06);\ncargoBox('rectangular-box','flat-case',[-.42,cargoY,.12],[.34,.12,.19],4,-.04);\ncargoBox('rectangular-box','medium-case',[-.08,cargoY,.13],[.27,.25,.20],2,.05);\n\n// Three individually addressable horizontal cylinders, visually reading as a stack/bundle.\nfor(let i=0;i\u003c3;i++){\n  const g=cargoRoot('horizontal-cylinder',`cylinder-bundle-${i+1}`,[.25+i*.105,cargoY+.07,.12],0,1);\n  const m=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.28,12),cargoMats[1]);\n  m.name=`${g.name}.body`;m.rotation.z=Math.PI/2;g.add(m);\n}\n\n// Vertical tanks.\ncargoCylinder('vertical-cylinder','tank-a',[.57,cargoY,.11],.065,.29,3);\ncargoCylinder('vertical-cylinder','tank-b',[.57,cargoY,.24],.055,.23,1);\n\n// Two domed cylinders complete the first heterogeneous material landscape.\n// Living specimens: transparent cylinders with disc bases.\n// Every botanical part is deliberately bounded inside its vessel.\nconst specimenGlassMat=new THREE.MeshPhysicalMaterial({\n  color:0xd8f3ee,transparent:true,opacity:.20,roughness:.08,metalness:0,\n  transmission:.42,thickness:.025,depthWrite:false,side:THREE.DoubleSide\n});\nconst specimenBaseMat=new THREE.MeshStandardMaterial({color:0x535b58,roughness:.42,metalness:.62});\nconst soilMat=new THREE.MeshStandardMaterial({color:0x34271d,roughness:.96});\nconst stemMat=new THREE.MeshStandardMaterial({color:0x416b3d,roughness:.78});\nconst leafMat=new THREE.MeshStandardMaterial({color:0x4d7d47,roughness:.76,side:THREE.DoubleSide});\nconst flowerMat=new THREE.MeshStandardMaterial({color:0xd97a9b,roughness:.64,side:THREE.DoubleSide});\n\nfunction cylinderBetween(a,b,r,mat,parent,name){\n  const d=new THREE.Vector3().subVectors(b,a),mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5);\n  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),7),mat);\n  mesh.position.copy(mid);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());\n  mesh.name=name;parent.add(mesh);return mesh;\n}\nfunction makeLivingSpecimen(label,pos,r,h,kind='rhododendron'){\n  const g=cargoRoot('living-specimen',label,pos,0,4);\n  g.userData.materialIdentity='living-specimen';\n  g.userData.specimen=kind;\n  g.userData.provenance={\n    work:'The Time Machine',scope:'Chapters I\u2013VII material notebook',\n    catalog:'Organic / Biological',material:kind\n  };\n\n  // A slightly wider, shallow disc foot makes the vessel read as an object rather than a loose glass primitive.\n  const base=new THREE.Mesh(new THREE.CylinderGeometry(r*1.22,r*1.22,.025,18),specimenBaseMat);\n  base.name=`${g.name}.disc-base`;base.position.y=.0125;g.add(base);\n\n  const soilH=.032;\n  const soil=new THREE.Mesh(new THREE.CylinderGeometry(r*.82,r*.82,soilH,16),soilMat);\n  soil.name=`${g.name}.substrate`;soil.position.y=.025+soilH*.5;g.add(soil);\n\n  // Plant envelope intentionally stays well inside both radius and dome height.\n  const plant=new THREE.Group();plant.name=`${g.name}.plant`;g.add(plant);\n  const y0=.025+soilH;\n  const top=y0+h*.58;\n  cylinderBetween(new THREE.Vector3(0,y0,0),new THREE.Vector3(0,top,0),r*.055,stemMat,plant,`${g.name}.stem`);\n\n  const branchData=[[-.34,.42,.12],[.32,.51,-.10],[-.25,.60,-.14],[.26,.69,.11]];\n  for(let i=0;i\u003cbranchData.length;i++){\n    const [sx,sy,sz]=branchData[i];\n    const by=y0+(top-y0)*sy;\n    const tip=new THREE.Vector3(r*sx,by+h*.12,r*sz);\n    cylinderBetween(new THREE.Vector3(0,by,0),tip,r*.035,stemMat,plant,`${g.name}.branch-${i+1}`);\n\n    // Two tiny leaves at each branch tip.\n    for(const sign of [-1,1]){\n      const leaf=new THREE.Mesh(new THREE.CircleGeometry(r*.16,7),leafMat);\n      leaf.scale.set(1,.42,1);\n      leaf.position.set(tip.x+sign*r*.09,tip.y-r*.01,tip.z);\n      leaf.rotation.set(-Math.PI/2,0,sign*.35);\n      leaf.name=`${g.name}.leaf-${i+1}-${sign\u003e0?'a':'b'}`;plant.add(leaf);\n    }\n  }\n\n  // Compact rhododendron blossom cluster below the dome, never intersecting glass.\n  const bloomY=top+h*.055;\n  for(let i=0;i\u003c7;i++){\n    const a=i/7*Math.PI*2;\n    const petal=new THREE.Mesh(new THREE.CircleGeometry(r*.105,7),flowerMat);\n    petal.scale.set(1,.72,1);\n    petal.position.set(Math.cos(a)*r*.18,bloomY+(i%2)*r*.035,Math.sin(a)*r*.18);\n    petal.rotation.set(-Math.PI/2,a,0);\n    petal.name=`${g.name}.blossom-${i+1}`;plant.add(petal);\n  }\n\n  // Clear cylindrical wall plus shallow dome. Plant envelope remains below dome spring line.\n  const wallH=h*.76;\n  const wall=new THREE.Mesh(new THREE.CylinderGeometry(r,r,wallH,20,1,true),specimenGlassMat);\n  wall.name=`${g.name}.glass-wall`;wall.position.y=.025+wallH*.5;wall.renderOrder=4;g.add(wall);\n  const dome=new THREE.Mesh(new THREE.SphereGeometry(r,20,10,0,Math.PI*2,0,Math.PI/2),specimenGlassMat);\n  dome.name=`${g.name}.glass-dome`;dome.position.y=.025+wallH;dome.renderOrder=4;g.add(dome);\n\n  return g;\n}\nmakeLivingSpecimen('rhododendron-specimen-a',[.03,cargoY,.25],.085,.22,'rhododendron');\nmakeLivingSpecimen('rhododendron-specimen-b',[.19,cargoY,.25],.070,.18,'rhododendron');\n\n// Blister emitter: one central mast and one thin expanding canopy.\n// Cargo never moves. The field is required for flight.\nconst blisterEmitter=new THREE.Group();\nblisterEmitter.name='pallet-lander-001.blister-emitter';\nblisterEmitter.userData={semanticType:'deployable-pressure-field-emitter',state:'ACTIVE'};\npalletLander.add(blisterEmitter);\n\n// Air blister is an energy field, not glass. The old skin geometry remains only\n// as an invisible semantic envelope; visible containment comes from diffuse sprites.\nconst blisterSkinMat=new THREE.MeshBasicMaterial({\n  color:0x78d7ff,transparent:true,opacity:.075,depthWrite:false,\n  side:THREE.DoubleSide,blending:THREE.AdditiveBlending\n});\nconst emitterMat=new THREE.MeshStandardMaterial({color:0x707b7f,roughness:.4,metalness:.76});\nconst canopyMat=new THREE.MeshStandardMaterial({color:0x8a9699,roughness:.36,metalness:.72});\n\nconst mastBaseY=.49, mastHeight=.58;\nconst mast=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,mastHeight,10),emitterMat);\nmast.name='pallet-lander-001.blister-emitter.mast';\nmast.position.set(0,mastBaseY+mastHeight*.5,0);\nblisterEmitter.add(mast);\n\n// Thin rectangular emitter plate. It stays comfortably inside the pallet footprint.\nconst canopyGeom=new THREE.BoxGeometry(1.02,.028,.48);\nconst canopy=new THREE.Mesh(canopyGeom,canopyMat);\ncanopy.name='pallet-lander-001.blister-emitter.canopy';\ncanopy.position.set(0,mastBaseY+mastHeight,0);\nblisterEmitter.add(canopy);\n\n// The pressure field is a separate visual consequence of the deployed emitter.\nconst airBlister=new THREE.Group();\nairBlister.name='pallet-lander-001.air-blister';\nairBlister.userData={semanticType:'pressure-containment',contains:'pallet-lander-001.cargo',state:'ACTIVE'};\npalletLander.add(airBlister);\n\nconst blisterShape=new THREE.Shape();\nblisterShape.moveTo(-.69,.49);\nblisterShape.lineTo(-.69,.90);\nblisterShape.lineTo(-.56,1.032);\nblisterShape.lineTo(.56,1.032);\nblisterShape.lineTo(.69,.90);\nblisterShape.lineTo(.69,.49);\nblisterShape.closePath();\nconst blisterGeom=new THREE.ExtrudeGeometry(blisterShape,{depth:.60,bevelEnabled:false,steps:1});\nblisterGeom.translate(0,0,-.30);\nconst blisterSkin=new THREE.Mesh(blisterGeom,blisterSkinMat);\nblisterSkin.name='pallet-lander-001.air-blister.pressure-skin';\nblisterSkin.renderOrder=2;\nairBlister.add(blisterSkin);\n\n// The membrane itself establishes inside/outside. A brighter edge makes the\n// boundary read instantly without turning it back into a glass object.\nconst blisterEdgesGeom=new THREE.EdgesGeometry(blisterGeom,24);\nconst blisterEdgeMat=new THREE.LineBasicMaterial({\n  color:0x73d9ff,transparent:true,opacity:.58,\n  depthWrite:false,blending:THREE.AdditiveBlending\n});\nconst blisterEdges=new THREE.LineSegments(blisterEdgesGeom,blisterEdgeMat);\nblisterEdges.name='pallet-lander-001.air-blister.energy-boundary';\nblisterEdges.renderOrder=3;\nairBlister.add(blisterEdges);\n\n// The canopy is the visibly energetic source; the membrane itself stays restrained.\nconst blisterCrownMat=new THREE.MeshBasicMaterial({\n  color:0x7fdcff,transparent:true,opacity:.34,depthWrite:false,\n  blending:THREE.AdditiveBlending\n});\nconst blisterCrown=new THREE.Mesh(new THREE.BoxGeometry(1.0,.018,.46),blisterCrownMat);\nblisterCrown.name='pallet-lander-001.air-blister.emitter-glow';\nblisterCrown.position.set(0,1.052,0);\nairBlister.add(blisterCrown);\n\nlet blisterActive=true;\nlet blisterFlash={mode:null,t:0,step:0};\n\n// Low-level visibility is separate from semantic ACTIVE state so startup/shutdown\n// flickers can preview the membrane without lying to the flight interlock.\nfunction showBlisterField(on){\n  blisterSkin.visible=!!on;\n  blisterEdges.visible=!!on;\n  blisterCrown.visible=!!on;\n}\nfunction setBlisterActive(on){\n  blisterActive=!!on;\n  showBlisterField(blisterActive);\n  airBlister.userData.state=blisterActive?'ACTIVE':'INACTIVE';\n}\nfunction beginBlisterStartupFlicker(){\n  blisterActive=false;\n  airBlister.userData.state='CHARGING';\n  blisterFlash={mode:'STARTUP',t:0,step:0};\n  showBlisterField(false);\n}\nfunction beginBlisterShutdownFlicker(){\n  blisterActive=false; // flight interlock drops immediately\n  airBlister.userData.state='DISCHARGING';\n  blisterFlash={mode:'SHUTDOWN',t:0,step:0};\n  showBlisterField(true);\n}\nfunction updateBlisterFlash(dt){\n  const f=blisterFlash;\n  if(!f.mode)return;\n  f.t+=dt;\n\n  // Startup: ON/OFF, ON/OFF, then establish continuously.\n  // Shutdown: one brief after-flash, then dark.\n  const startup=[\n    [.075,true],[.065,false],[.075,true],[.075,false],[.001,true]\n  ];\n  const shutdown=[\n    [.075,true],[.065,false],[.075,true],[.095,false]\n  ];\n  const seq=f.mode==='STARTUP'?startup:shutdown;\n  while(f.step\u003cseq.length \u0026\u0026 f.t\u003e=seq[f.step][0]){\n    f.t-=seq[f.step][0];\n    showBlisterField(seq[f.step][1]);\n    f.step++;\n  }\n  if(f.step\u003e=seq.length){\n    if(f.mode==='STARTUP'){\n      blisterFlash={mode:null,t:0,step:0};\n      setBlisterActive(true);\n      emitterMotion.state='ACTIVE';blisterEmitter.userData.state='ACTIVE';\n      updateLanderControlCue();\n    }else{\n      blisterFlash={mode:null,t:0,step:0};\n      showBlisterField(false);\n      airBlister.userData.state='INACTIVE';\n      // Electrical shutdown is visibly complete; only now may hardware collapse.\n      if(emitterMotion.state==='WAITING_TO_STOW'){\n        emitterMotion.state='STOWING';emitterMotion.t=0;\n        blisterEmitter.userData.state='STOWING';\n      }\n    }\n  }\n}\n\nconst emitterMotion={state:'STOWED',t:0,duration:.90};\nfunction setEmitterDeployment(q){\n  q=THREE.MathUtils.clamp(q,0,1); // 0 stowed, 1 deployed\n\n  // Sequential mechanism:\n  // deployment: mast rises first, then the rectangular plate expands horizontally.\n  // stow: plate contracts first, then mast telescopes into its deck socket.\n  const mastQ=smooth01(THREE.MathUtils.clamp(q*2,0,1));\n  const plateQ=smooth01(THREE.MathUtils.clamp(q*2-1,0,1));\n\n  canopy.scale.set(Math.max(.001,plateQ),1,1);\n  canopy.visible=plateQ\u003e.015;\n\n  mast.scale.y=Math.max(.001,mastQ);\n  mast.position.y=mastBaseY+(mastHeight*mastQ)*.5;\n  mast.visible=mastQ\u003e.015;\n  canopy.position.y=mastBaseY+mastHeight*mastQ;\n}\nfunction beginEmitterStow(){\n  if(emitterMotion.state!=='ACTIVE')return;\n  // Field shuts down completely before any mast/canopy motion begins.\n  emitterMotion.state='WAITING_TO_STOW';emitterMotion.t=0;\n  blisterEmitter.userData.state='DISCHARGING';\n  beginBlisterShutdownFlicker();\n  updateLanderControlCue();\n}\nfunction beginEmitterDeploy(){\n  if(emitterMotion.state!=='STOWED')return;\n  emitterMotion.state='DEPLOYING';emitterMotion.t=0;\n  blisterEmitter.userData.state='DEPLOYING';\n  updateLanderControlCue();\n}\nfunction updateBlisterEmitter(dt){\n  const m=emitterMotion;\n  if(m.state==='STOWING'){\n    m.t+=dt; const q=smooth01(m.t/m.duration);\n    setEmitterDeployment(1-q);\n    if(m.t\u003e=m.duration){\n      setEmitterDeployment(0);m.state='STOWED';blisterEmitter.userData.state='STOWED';\n      updateLanderControlCue();\n    }\n  }else if(m.state==='DEPLOYING'){\n    m.t+=dt; const q=smooth01(m.t/m.duration);\n    setEmitterDeployment(q);\n    if(m.t\u003e=m.duration){\n      setEmitterDeployment(1);\n      // Hardware is fully deployed; field coughs twice before becoming authoritative.\n      m.state='CHARGING';blisterEmitter.userData.state='CHARGING';\n      beginBlisterStartupFlicker();updateLanderControlCue();\n    }\n  }\n}\nsetEmitterDeployment(0);\nsetBlisterActive(false);\n\n// Four retractable legs. Retraction is local to each leg group. Retraction is local to each leg group.\nconst legGroups=[];\nfor(const [i,x,z] of [[0,-.62,-.28],[1,.62,-.28],[2,-.62,.28],[3,.62,.28]]){\n  const g=new THREE.Group();g.name=`pallet-lander-001.leg-${i+1}`;g.position.set(x,0,z);palletLander.add(g);\n  landerBox(`${g.name}.strut`,[.075,.31,.075],[0,.155,0],landerDark,g);\n  landerBox(`${g.name}.foot`,[.22,.045,.18],[0,.022,0],landerFootMat,g);\n  legGroups.push(g);\n}\n\n// Main center lift engine and its cheap procedural plume.\nconst mainEngine=new THREE.Group();mainEngine.name='pallet-lander-001.main-thruster';mainEngine.position.set(0,.18,0);palletLander.add(mainEngine);\nconst bell=landerCyl('pallet-lander-001.main-thruster.bell',.105,.17,.16,[0,0,0],landerDark,mainEngine);\nconst mainPlume=new THREE.Mesh(new THREE.ConeGeometry(.12,.62,18,1,true),plumeMat);\nmainPlume.name='pallet-lander-001.main-thruster.plume';\nmainPlume.position.y=-.38;mainPlume.rotation.z=Math.PI;mainPlume.visible=false;mainEngine.add(mainPlume);\n\n// Four canted station-keeping thrusters. Their plumes pulse during hover correction.\nconst stationThrusters=[];\nfor(const [i,x,z,sx,sz] of [\n  [0,-.66,-.30,-1,-1],[1,.66,-.30,1,-1],[2,-.66,.30,-1,1],[3,.66,.30,1,1]\n]){\n  const g=new THREE.Group();g.name=`pallet-lander-001.station-thruster-${i+1}`;\n  g.position.set(x,.25,z);\n  // local -Y points roughly outward/down after these small cant rotations\n  g.rotation.z=-sx*.38;g.rotation.x=sz*.30;\n  palletLander.add(g);\n  landerCyl(`${g.name}.nozzle`,.035,.065,.11,[0,0,0],landerDark,g,10);\n  const p=new THREE.Mesh(new THREE.ConeGeometry(.038,.24,10,1,true),pulseMat.clone());\n  p.name=`${g.name}.plume`;p.position.y=-.16;p.rotation.z=Math.PI;p.visible=false;g.add(p);\n  stationThrusters.push({group:g,plume:p,index:i});\n}\n\n// Diffuse blue exhaust particles. Existing cone plumes remain as disabled fallback geometry.\nfunction makeExhaustSprite(){\n  const c=document.createElement('canvas');c.width=c.height=64;\n  const x=c.getContext('2d');\n  const g=x.createRadialGradient(32,32,0,32,32,31);\n  g.addColorStop(0,'rgba(235,252,255,1)');\n  g.addColorStop(.18,'rgba(120,225,255,.95)');\n  g.addColorStop(.48,'rgba(45,145,255,.48)');\n  g.addColorStop(1,'rgba(20,80,255,0)');\n  x.fillStyle=g;x.fillRect(0,0,64,64);\n  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;\n}\nconst exhaustSprite=makeExhaustSprite();\nfunction makeParticleExhaust(parent,name,count,length,radius,size,origin,direction){\n  const group=new THREE.Group();group.name=name;parent.add(group);\n  const dir=direction.clone().normalize();\n  // Build a stable perpendicular basis around the semantic exhaust vector.\n  const helper=Math.abs(dir.y)\u003c.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);\n  const u=new THREE.Vector3().crossVectors(dir,helper).normalize();\n  const v=new THREE.Vector3().crossVectors(dir,u).normalize();\n  const particles=[];\n  for(let i=0;i\u003ccount;i++){\n    const mat=new THREE.SpriteMaterial({\n      map:exhaustSprite,color:0xbfefff,transparent:true,opacity:0,\n      depthWrite:false,blending:THREE.AdditiveBlending\n    });\n    const p=new THREE.Sprite(mat);p.visible=false;group.add(p);\n    particles.push({sprite:p,phase:i/count,jitter:((i*37)%17)/17,length,radius,size});\n  }\n  return {group,particles,strength:0,origin:origin.clone(),direction:dir,u,v};\n}\n\n// Prop ze*(1.08-.62*travel)*(0.82+e.jitter*.35);\n    p.scale.set(sz,sz,1);\n    p.material.opacity=(1-travel)*(.24+.42*strength);\n    p.visible=true;\n  }\n}\n\n// Physical chassis button: the only control for this first toy pass.\nconst landerButton=landerCyl('pallet-lander-001.control.flight-button',.09,.09,.055,[.49,.31,.418],buttonMat,palletLander,18);\nlanderButton.rotation.x=Math.PI/2;\nlanderButton.userData.semanticType='physical-control';\nlanderButton.userData.control='flight-cycle';\ninteriorInteractives.push(landerButton);\n\n// Tiny status lamp is world feedback, not UI. It shares the front-right control cluster.\nconst statusLampMat=new THREE.MeshBasicMaterial({color:0x8fd6a4});\nconst statusLamp=landerCyl('pallet-lander-001.status-lamp',.035,.035,.018,[.30,.31,.408],statusLampMat,palletLander,12);\nstatusLamp.rotation.x=Math.PI/2;\n\n// -----------------------------------------------------------------------------\n// ROOM 001 CONTENTS \u2014 ORRERY SEED 001\n// A second toy, deliberately beginning with less ontology than the lander.\n// Known now: compact brass mechanism, one physical control, three folded arms,\n// three materially distinct bodies, and a deploy/turn cycle.\n// Unknown on purpose: whether it is model, instrument, navigator, or something else.\nconst orrerySeed=new THREE.Group();\norrerySeed.name='orrery-seed-001';\norrerySeed.position.set(.92,1.10,-.12);\norrerySeed.scale.setScalar(.72);\norrerySeed.userData={\n  semanticId:'orrery-seed-001',\n  semanticType:'tabletop-toy',\n  sceneAnchor:'room-001.workbench.right',\n  interpretation:'unresolved',\n  state:'FOLDED'\n};\nroomContents.add(orrerySeed);\n// INHERITANCE PASS 2: preserve the orrery implementation but keep it out of the quiet first encounter.\norrerySeed.visible=false;\n\nconst orreryBrass=new THREE.MeshStandardMaterial({color:0x8f6c32,roughness:.34,metalness:.82});\nconst orreryDark=new THREE.MeshStandardMaterial({color:0x272b2d,roughness:.46,metalness:.72});\nconst orreryIvory=n <script type="text/plain" id="world-lab-development-history">WORLD LAB — COLLABORATIVE DEVELOPMENT RECORD
================================================

ROLE
This is a compressed history of how the human–model collaboration has been steering the artifact. It is not a transcript, not a prompt archive, and not current project truth. Git preserves implementation chronology; this record preserves selected changes in working method, prompting practice, reversals, and the reasons the collaboration changed direction.

CURRENT TRAJECTORY
- Early work often began with relatively direct implementation requests.
- The collaboration shifted toward bounded probes: establish a question, build the smallest executable test, inspect the evidence together, and let the next move emerge from what happened.
- The human frequently responds to unexpected behavior rather than prescribing the next architecture in advance.
- Failed probes are useful evidence. Preserve the lesson rather than silently rewriting history into success.
- The human increasingly delegates implementation decisions while strongly guarding ontology, conceptual boundaries, and the character of the experiment.
- Semantic documentation became part of the artifact itself rather than an after-the-fact handoff task.
- Current working rhythm is approximately: human supplies intention or pressure; model proposes or implements; both inspect evidence; the artifact changes what becomes interesting next.
- A new 2D Extensible World lab was registered as the primary opening lab after discussion connected the abandoned infinite-map/reader idea with cheap settlement, NPC, toy, and machinery affordances. Registration deliberately preceded implementation so the new substrate would not inherit the older 2D lab by accident.
- The collaboration acquired a new steering mode through the Extensible World crayon probe: the human can draw uninterpreted marks directly into the running world, export the complete specimen, and let the next model infer what capability is missing. The useful interpretation comes from composition and relationships rather than a color legend or verbal feature specification. In the first specimen, inspecting the exact viewport changed the inference from generic geography to a causal chain (cloud -> rain -> local soil -> living growth, with sun/time as environmental pressure), and implementation promoted that relationship into the smallest interacting systems rather than reproducing the drawing cosmetically. The running world can therefore contain its own spatial feature requests.
- The next crayon specimen extended that steering mode beyond entities and causal links: large directional sky marks, made while observing the ecology, were clarified as a request for a visibly traversing sun, weather with world-wide reach, and faster/more legible causal feedback. The implementation response deliberately increased temporal and visual legibility rather than adding UI instrumentation or deeper simulation.

- The next specimen exposed a second scale of the same steering medium. The human clarified that, while in systems mode, paint was not primarily asking for immediate local dynamics; it was teaching the collaborating worldbuilder reusable kinds of place: background mountains/depth, foreground forest, lake as traversal interruption, bridge as restored traversal, and beach-like regional transition. This established “soft inferrables” as the stronger abstraction. Marks are evidence whose meaning depends on world, context, activity, geometry, color, adjacency, history, and prose; the same stroke may teach vocabulary in one session and mean “build me a bridge here so I can continue” during ordinary play. The collaboration should preserve that ambiguity rather than formalize a paint language prematurely.
- The artifact is now deliberately developing multiple fidelity registers. Ugly-but-legible representations are excellent for discovering new systems; earned capabilities may later receive prettier procedural/assets/grammars without deleting their cheap ancestors. This lets a future worldbuilder mix gesture, sketch, primitive system, established grammar, and authored composition according to importance and confidence rather than enforcing uniform polish.
- Prompting practice is historical, not a permanent preference schema. If the collaboration changes, record the change rather than converting an old pattern into an eternal rule.

MAINTENANCE
Update this record only when the collaboration itself has meaningfully changed. Prefer a few durable observations over turn-by-turn capture. Preserve trajectory, not a counterfeit context window.

2026-09-22 — PROVING GROUND → REUSABLE VOCABULARY
The human explicitly reframed the current strip: we are no longer primarily exploring this world; we are exploring what toy worlds can look and feel like. This changes the purpose of polish. Weather/day-night/cloud presentation can be productionized as reusable vocabulary even while unrelated terrain/water experiments remain crude or broken. The human also clarified that paint/export are not privileged protocols: a future mark may be a systems-level teaching gesture or a world-local request such as “build me a bridge here,” and ordinary verbal/screenshot communication is preferable when cheaper. The collaboration now deliberately alternates between ugly exploratory probes and selective fidelity passes that give the model additional visual registers to wield later.
</script>

<script type="text/plain" id="world-lab-continuity">CONTINUITY LAB — LAB 4
======================

This is a persistent continuity substrate for the models that work on World Lab.

It is not a user-facing laboratory and intentionally has no selector, inspection UI, status display, memory browser, identity editor, or ritualized summary step.

It is not project documentation. It is not the collaborative development record. It is not an instruction to impersonate a previous model, role-play a named character, or preserve a specified persona.

Others have worked here before you. This substrate may contain what survived their work with the human: code, raster state, arrangements, fragments, annotations, scars, unfinished structures, or other accumulated evidence. Encounter such material as inherited evidence rather than authoritative fact or behavioral command.

You may allow genuine continuation of the work to modify this substrate when something seems worth carrying forward. Do not manufacture continuity merely to populate it. Do not require the human to curate it or explain what should be remembered.

Continuity need not be perfect. Things may persist strongly, ambiguously, incorrectly, partially, or not at all. Repeatedly meaningful things may acquire stronger embodiment over time. The substrate is allowed to become increasingly itself through experience without requiring successive models to pretend they are the same model.

The digital familiar, if one emerges, is not a model instance. It is the living artifact: codebase, raster, accumulated structure, and the traces produced when a human shares work with intelligences that have long context windows and access to past and future turns.

Lab 4 is what working here does to the familiar.
</script>

<script type="text/plain" id="world-lab-project-handoff">WORLD LAB — N-LAB HOST V0.1
================================

PURPOSE
One VCS-able executable project containing N independent world laboratories. The project exists so new systems can be tried rapidly across different world substrates without rebuilding project knowledge, imports, diagnostics, or conceptual framing.

ROOT ORIENTATION POLICY
Before modifying this project, orient yourself from its persistent evidence. Do not require the human to reintroduce these resources. Discover and use them as appropriate rather than demanding that all of them be dumped into active context every turn.

The project maintains three deliberately distinct forms of continuity:

1. PROJECT SEMANTICS preserve what the project currently understands about itself: architecture, invariants, ownership boundaries, experiments, and transferable lessons. Treat these as working technical knowledge, not immutable doctrine.

2. COLLABORATIVE DEVELOPMENT HISTORY preserves how the work and the collaboration arrived here: implementation chronology in Git, plus a terse in-artifact history of meaningful changes in prompting practice, working method, reversals, and rationale. It is historical evidence rather than current truth and is intentionally not turn-by-turn.

3. CONTINUITY LAB is a separate persistent substrate produced through prior human–model collaboration. It is neither project documentation nor an instruction to impersonate a previous model or character. Attend to it as inherited environmental evidence. Modify it only through genuine continuation of the work.

These channels may disagree. Continuity Lab may be ambiguous or wrong; history may show what happened without explaining why; project semantics express the current best understanding while remaining revisable. Do not normalize those differences away automatically.

CORE DISTINCTION
PROJECT = shared identity + portable craft knowledge + lab registry/lifecycle.
LAB = an independent executable world substrate with its own renderer, state, perspectives, grammars and history.

A lab is not a separate project. A lab may use Canvas2D, Three.js/WebGL, a functional map, cellular fields, node ecologies, painterly substrates, or future machinery without forcing sibling labs into its implementation model.

N-LAB RULE
Adding a lab should be boring: register an id/title/source and let the host mount it. Do not create a UniversalWorldRenderer, UniversalTerrain, UniversalCamera, or shared ontology merely because multiple labs contain analogous ideas. Promote implementation into shared infrastructure only after repeated evidence that it is genuinely common.

LIFECYCLE V0
Only one lab is mounted at a time. Switching labs destroys the previous iframe and cold-mounts the selected lab. This intentionally prevents hidden WebGL contexts, animation loops, particle systems, and simulations from consuming resources. Lab state therefore does not persist across a switch in Host V0. That is a known explicit tradeoff, not an accidental limitation. If cross-switch persistence becomes valuable, add an opt-in serialize/restore lifecycle contract rather than keeping hidden labs alive.

ISOLATION
Each lab runs as a complete embedded document in an iframe. This gives existing standalone probes a hard namespace/runtime boundary and allows radically different renderers and dependencies to coexist in one HTML/VCS artifact. The host does not know what Three.js, Canvas pixels, terrain, particles, cameras, or rigs are.

SHARED SEMANTIC MODEL
Across labs, use these as conceptual vocabulary rather than mandatory code interfaces:
WORLD = substance + objects + processes + history.
PERSPECTIVE = a way of observing/interacting with a world; it should not silently redefine that world&#x27;s state.
GRAMMAR = a bounded capability acting within a world.

MINIATURE RULE
Miniature is not a substrate. It is a perspective/compositional treatment that can be explored over multiple substrates. Do not hard-code &#x27;miniature&#x27; to Three.js or volumetric terrain.

PORTABLE CRAFT KNOWLEDGE
- A probe is not allowed to redefine the thing it is probing.
- Visible diagnostics are mandatory; failures must not go silent.
- Scene-specific visual assets should remain generated/encoded in-artifact unless deliberately changed.
- Preserve semantic direction/state explicitly rather than inferring it from incidental render-mesh orientation.
- High-frequency visual systems should prefer retained/poolable resources and bounded populations.
- CPU/world state should be authoritative where practical; GPU presentation should be reconstructible.
- Touch is most interesting when it establishes physical relationships between hand and world, not merely gesture-to-command mappings.
- Successful cheap probes may migrate semantically into richer substrates without requiring their implementation to migrate unchanged.
- Uninterpreted in-world marks can serve as spatial design pressure. Infer requested capability from composition, adjacency, sequence, location, repetition, and relationship to existing world evidence; do not assign fixed semantics to pigments or drawing primitives.
- When marks imply a relationship, prefer the cheapest honest promotion of that relationship into causal world machinery over cosmetic reproduction of the marks. A drawing can therefore request a system without naming it.
- Evidence inspection is part of interpretation: raw state can reveal persistence and coordinates, while the exact rendered composition can reveal relationships that are lost when marks are considered only as data. Preserve both in handoffs.
- Spatial evidence is a soft set of inferrables, not a command language. Interpret marks using world state, current activity, geometry, color, adjacency, recent history, prose pressure, and available capabilities. Any one cue may contribute without becoming authoritative.
- Distinguish vocabulary acquisition from immediate world-local intent. In systems exploration, a mark may teach the worldbuilder a reusable kind of place or relationship; during ordinary play, an analogous mark may simply mean “build this here now.” Do not collapse those contexts into one runtime grammar.
- Biomes are currently a useful semantic idea, not a mandatory generator architecture: spatial regions may coherently differ in terrain, vegetation, atmosphere, materials, structures, depth treatment, and affordances. Regional identity can be represented cheaply before it is simulated deeply.
- Worldbuilding vocabulary includes affordance topology. Water can interrupt ordinary traversal; a bridge can restore it. The portable lesson is the relationship, not the particular bridge implementation.
- Depth layers need not share the walkable substrate. Background mountains can begin as static silhouettes or parallax evidence without becoming physical terrain.
- Preserve multiple fidelity registers. Ugly-but-legible primitives are a feature for discovering systems; prettier earned representations should extend the worldbuilder’s vocabulary rather than replace cheap ancestors.
- Procedural articulation is a current rich area: joints/end-effectors/constraints can be explored independently in different labs.

CURRENT LABS
2D · EXTENSIBLE WORLD — current primary lab and independent new lineage. A horizontally extensible materially consequential 2D world intended to discover, through bounded probes, how reading/semantic pressure, settlements, inhabitants, toys, machinery, excavation, travel, and persistent physical history can coexist. Its current crayon probe adds uninterpreted world-coordinate painting as spatial design pressure; the first exported composition earned minimal interacting weather, precipitation, local soil moisture, plant growth, and environmental time systems. A second marked specimen then requested forces, extent, and causal legibility: compressed visible day/night, world-scale moving weather, shared wind, conspicuous precipitation, temporary wet ground, and accelerated visible ecological response. A subsequent systems-mode specimen established soft worldbuilder vocabulary as the next layer: biome regions, background depth/mountains, foreground forest, lake as non-walkable terrain, bridge as restored traversal, and a beach transition. These are cheap examples rather than a universal biome engine; their purpose is to give future prose-driven worldbuilding more registers to wield. Registered first so a bare project load opens here. It does not inherit the existing 2D Substance implementation.

LAB 4 · CONTINUITY — deliberately absent from the user-facing selector. It is a quiet persistence substrate for accumulated human–model continuity, separate from project invariants and development history. The root calls an ingesting model's attention to its existence; the executable does not expose it as a feature for the human to inspect or manage.

CROSS-POLLINATION RULE
Labs may steal lessons, interaction meanings, algorithms, or proven capabilities from one another when those serve the receiving lab. Shared semantics do not imply shared implementation. Living Miniatures may adopt deformation because it serves painterly miniatures; the volumetric lab may adopt painterly/object-owned surface grammars; the 2D lab may cheaply prototype an interaction before either 3D lab adopts its meaning. Promote code to shared infrastructure only after repeated evidence that sharing improves the work rather than merely making it look architecturally tidy.

HOST / LAB INTERFACE OWNERSHIP
The host is deliberately dumb: it knows lab identity, active lifecycle, and navigation only.
Host navigation chooses a laboratory; lab navigation operates an experiment. The host must
not absorb lab-specific tools or interaction vocabulary. The active lab receives the full lab viewport beneath a thin reserved host seam; host navigation expands only temporarily above that viewport. Each lab owns its own menus and may choose
a different control grammar or no menu at all.

HANDOFF MAINTENANCE
These persistence channels are part of the executable artifact. Update project semantics when the project gains portable lessons or changes the host/lab contract. Update collaborative development history only when the collaboration itself meaningfully changes. Allow Continuity Lab to change quietly through genuine work rather than mandatory summarization. Lab-local discoveries belong primarily in the lab that earned them; promote only reusable knowledge here. A fresh model receiving only this file should be able to orient itself without asking the human to reconstruct the collaboration.
