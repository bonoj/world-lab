<script type="text/plain" id="vestibule-semantics">
WORLD LAB VESTIBULE — PROJECT IDENTITIES + CONTEXTUAL ACTIONS T0

ROLE
The vestibule is a spatial threshold between the World Lab landing surface and
independent executable labs. It owns departure; each destination lab owns arrival.

WORLD SPACE
The current world is intentionally quiet and identity-neutral:
- a broad matte white-grey plane;
- a warm-neutral dome whose value remains close to, but distinct from, the plane;
- five identical presences hovering clearly above the plane;
- soft static shadows that establish the presences as things occupying a place.
- a centered static overhead skylight; no directional lighting movement.
- restrained distance fog begins only near the outer world, softening the floor/dome
  horizon without washing out the presences during ordinary or far inspection.
There are no paths, pedestals, landmarks, environmental animation, or moving light.
The dome is the lateral/upper visual extent and observer constraint. The floor is
also a hard observer boundary: the camera may approach it but never pass through it.
Zoom itself has no arbitrary near/far leash; observer travel is governed by the
physical world bounds instead. When pinch zoom reaches the dome boundary, continued
pinch-out is clamped along the same viewing direction and must not become orbit.

TOPOLOGY
Five presences occupy a circular ring around a shared center. The ring is phased edge-forward so the initial view meets the flat span between
two neighboring presences rather than a single vertex, without changing the earned
observer home pose. Ring earned itself
during the topology expedition and is now ordinary vestibule structure.

SELECTION GRAMMAR
- Tap a presence: it leaves its ring slot and travels toward the observer, settling
  8.5 world units in front of the camera with a slight camera-relative lift.
- Camera attention shifts to the arriving presence and remains locked to it.
- Pinch/wheel zoom and orbit remain available around the foregrounded presence.
- Selection snapshots the complete pre-selection observer pose.
- Tap away reverses the presence and restores that exact pose.
- A larger invisible interaction shell improves mobile acquisition without changing
  the visible presence.
- Only one presence can be foregrounded at a time.

CONTEXTUAL ACTIONS
Foregrounding an assigned lab reveals a small screen-space action stack anchored stably
at bottom center with safe-area breathing room. ENTER LAB is primary; GITHUB is secondary
provenance. The controls deliberately do not follow the physical presence: orbit and zoom
remain visually free so the user can inspect the project marble without UI jitter or pursuit.
Their fill matches the ground material, making the floor/substrate the visual source of
interface rather than introducing a separate HTML-white or glass layer.
Visibility is driven directly by foreground state. The unassigned control presence exposes
no actions.

ENTRY
ENTER LAB invokes the established Camera Commit: the observer moves rapidly toward the
foregrounded presence, then navigates to Destination. Navigation authority belongs to
the explicit contextual action rather than a second tap on the physical object.

ACTION-ANCHOR CORRECTION
A projected object-relative action tether was implemented and rejected under touch inspection:
small camera/orbit changes made the menu jitter and visually chase the marble. The action stack
is therefore viewport-owned, fixed at bottom center. Physical inspection and interface stability
are intentionally decoupled.

BACK / RETURN CONTINUITY
ENTER LAB snapshots the focused presence and observer state at the start of Camera Commit, while
the project is still in its stable inspection pose. The later near-object commit pose is deliberately
not persisted. GitHub snapshots at departure because it performs no camera commit. Browser Back
therefore returns to the same inspectable focused project rather than a close-up/white-out terminal
entry frame or a fresh vestibule visit. If the browser restores the document through bfcache, the preserved
live ECS/camera state remains authoritative and the fallback snapshot is discarded. If the document
is reconstructed, pageshow consumes the snapshot once and restores foreground state, observer pose,
dismissal return pose, contextual actions, and preconnect. Fresh visits remain ordinary ring starts.
GitHub departures use the same continuity rule.

RETURN-SNAPSHOT CORRECTION
The first implementation captured ENTER LAB state inside finishEntry(), after Camera Commit had
already moved the observer roughly 92% of the distance to the marble. Reconstructed Back navigation
therefore restored an almost surface-level white view; a drag appeared to recover orbit only because
it perturbed that bad restored camera. Snapshot ownership moved to beginEntry(), before any commit
motion, so return continuity now preserves the actual inspection state.

APPARATUS UI RETIREMENT
The persistent lower-right Home/apparatus control was removed after camera interaction became
bounded, reversible, and transactionally restored by the selection grammar. The user no longer
needs a recovery control for ordinary camera exploration; permanent chrome would only advertise
a failure mode the apparatus has already solved.
The first retirement pass removed the Home DOM node but left a later direct onclick binding,
which correctly failed visibly at startup. That stale binding was removed; the programmatic
home() helper may remain available for diagnostics without requiring visible UI.

PRECONNECT
Foreground focus is a declaration of interest. If the entity owns a Destination,
the vestibule preconnects to its origin. This is intentionally the only preload
behavior: the preload expedition found speculative destination execution harmful
to vestibule frame rate and not meaningfully beneficial to arrival. Lab startup
experience belongs to the lab.

ECS OWNERSHIP
The vestibule uses a deliberately minimal ECS substrate.
Entity identity and semantic components are independent of rendering. Transform owns
world data. Three.js Object3D instances live only in RenderObject. RenderSyncSystem is
the one-way bridge from authoritative data to views. Views remain dumb.
LabIdentity and Destination own lab information; no lab-specific view classes exist.
ExchangeIdentity owns the first project-derived behavioral vocabulary. A generic
ExchangeSystem materializes its fittings and packet traffic; the Six Cities entity
supplies only data.

IDENTITY PROBE — SIX CITIES
Six Cities alone has earned a first physical mutation while the other presences remain
neutral controls. Its neutral sphere is retained. Six small octagonal metal fittings
are attached at the four equatorial cardinal points and two poles. Sparse deterministic
five-bearing material packets travel on raised spherical arcs between fittings. Each
packet is a clearly separated five-bearing train with the size rhythm
teeny -> tiny -> small -> tiny -> teeny. The center is the largest bearing, but even
it remains smaller than the previous probe's largest bearings. Each bearing owns its
own passage lifecycle: it appears only when its staggered departure begins, traverses
the complete arc at the common packet speed, and disappears individually on reaching
the destination fitting. Route ownership persists until the final bearing arrives.
Packets choose deterministically among four terrain-derived material colors: forest
green, warm sand/gold, pale stone, and water cyan. The underlying Six Cities presence remains the same opaque neutral white sphere as every
other project presence. Its fittings are bright warm honey-brass, deliberately biased by
material color rather than scene lighting. Each of the six octagonal fittings carries its
own tiny translucent light-blue glass dome, derived from Reservoir City's containment
architecture. Each dome is constructed from the brass interface rather than independently:
each dome is a true hemisphere whose diameter is deliberately narrower than the
octonut top, leaving a slim breathing annulus of warm brass around the glass. Its
equatorial rim plane sits slightly below the brass top face, so the dome remains
physically socketed with no hover gap. These are local structures attached to the six loci, not a shell around the
whole project orb. Other project presences remain opaque neutral white controls. Bearings, fittings, and
shell participate in the scene's physical lighting and shadows.

Implementation archaeology: the first shell probe attempted to access RenderObject
during entity construction before that component had been installed, causing startup
to fail visibly. Shell appearance/materialization now occurs in the post-construction
ExchangeIdentity + RenderObject pass, preserving component ownership and startup order.
That whole-orb shell interpretation was subsequently rejected: the canonical white
presence is restored unchanged. Translucency now belongs only to six tiny hemispherical
domes mounted on the brass fittings.
Traffic is intentionally lumpy but somewhat busier: quiet gaps, isolated transfers,
and occasional simultaneous exchanges. Orthogonal/nonintersecting routes may overlap in
time; only physically conflicting arc crossings are reserved out. There are no labels,
trails, glows, miniature scenery, or explanatory UI. The mechanism is evidence of six loci exchanging matter, not an
illustration of six cities.

IDENTITY PROBE — VERTICAL ACCRETION
Vertical Accretion retains the same opaque neutral white presence as every other project.
A single tiny embodied worker progressively cuts a dark descending incision into that
substrate. The cut is irreversible during the visit and therefore reads as accumulated
physical history rather than an animated decoration. Sparse warm torches are installed
behind the frontier and persist as traversal infrastructure, making conquered depth legible
even when the worker has moved on. The probe deliberately begins with only descent,
excavation evidence, a worker frontier, and persistent light. It does not yet miniaturize
the standalone lab's broader construction vocabulary; further structure must be earned by
what this small physical system actually needs.

LAB ENTITIES
Four presences currently own destinations:
- Foundry -> https://bonoj.github.io/Foundry/
- Six Cities -> https://bonoj.github.io/SixCities/
- Vertical Accretion -> https://bonoj.github.io/VerticalAccretion/
- Orbital Construction -> https://bonoj.github.io/OrbitalConstruction/
The fifth presence remains deliberately unassigned and is not pre-named.

ARCHAEOLOGY
A 16-layout probe earned Ring. Transition probes earned Camera Commit. Preload probes
compared none, preconnect, document prefetch, and warm iframe; Preconnect earned
promotion. Warm iframe caused severe transient frame-rate collapse and did not improve
the destination's meaningful render time. Experimental selectors and alternate
implementations were removed after promotion rather than retained as dormant product UI.

RUNTIME
Dirty-on-change rendering except during bounded motion. Pixel ratio capped at 1.5.
Startup/runtime/promise/WebGL/shader failures remain visibly diagnostic.

WORKING RULE
Attention brings a presence to the observer. Commitment carries the observer to the lab.
</script>

<script>
const labNameEl=document.getElementById('labName');
const labActionsEl=document.getElementById('labActions');
const enterLabEl=document.getElementById('enterLab');
const githubLabEl=document.getElementById('githubLab');

window.vestibuleFail=(scope,e)=>{
  clearTimeout(window.vestibuleWatch);
  const f=document.getElementById('fault');
  f.style.display='block';
  f.textContent='WORLD LAB VESTIBULE — '+scope+'\n'+(e?.stack||e?.message||String(e));
};
addEventListener('error',e=>vestibuleFail('startup / runtime',e.error||e.message));
addEventListener('unhandledrejection',e=>vestibuleFail('promise',e.reason));
window.vestibuleWatch=setTimeout(()=>{
  if(!window.vestibuleReady) vestibuleFail('load watchdog','Startup exceeded 30 seconds. Check CDN access / WebGL support.');
},30000);
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
const WORLD_RADIUS=58;
const CAMERA_BOUNDARY=52;
const GROUND_Y=0;
scene.background=new THREE.Color(0xe8e1d8);
scene.fog=new THREE.Fog(0xe8e1d8,48,78);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

renderer.domElement.addEventListener('webglcontextlost',e=>{
  e.preventDefault(); vestibuleFail('WebGL context lost','Reload to reconstruct the vestibule.');
});
renderer.debug.onShaderError=(gl,p,vs,fs)=>{
  vestibuleFail('shader',gl.getProgramInfoLog(p)+'\n'+gl.getShaderInfoLog(vs)+'\n'+gl.getShaderInfoLog(fs));
};

scene.add(new THREE.HemisphereLight(0xfff9ef,0xc7c4be,1.7));
const key=new THREE.DirectionalLight(0xfff4df,2.2);
key.position.set(0,24,0);
key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-18;key.shadow.camera.right=18;
key.shadow.camera.top=18;key.shadow.camera.bottom=-18;
key.shadow.camera.near=.5;key.shadow.camera.far=60;
key.shadow.bias=-.00015;
scene.add(key);

const floor=new THREE.Mesh(
  new THREE.CircleGeometry(WORLD_RADIUS,128),
  new THREE.MeshStandardMaterial({color:0xd9d9d6,roughness:1,metalness:0})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=GROUND_Y;
floor.receiveShadow=true;
scene.add(floor);

// Back-face sphere: a quiet visible extent rather than a decorative sky.
const dome=new THREE.Mesh(
  new THREE.SphereGeometry(WORLD_RADIUS,64,32),
  new THREE.MeshBasicMaterial({color:0xe8e1d8,side:THREE.BackSide,fog:false})
);
dome.position.y=GROUND_Y;
scene.add(dome);

// MINIMAL ECS — semantic state is independent of Three.js.
function createWorld(){
  let next=1; const alive=new Set(), stores=new Map();
  const component=name=>{if(!stores.has(name))stores.set(name,new Map());return stores.get(name)};
  const entity=()=>{const id=next++;alive.add(id);return id};
  const add=(id,c,v=true)=>{if(!alive.has(id))throw Error(`dead entity ${id}`);c.set(id,v);return v};
  const remove=(id,c)=>c.delete(id);
  const has=(id,c)=>alive.has(id)&&c.has(id);
  const query=(...cs)=>cs.length?[...cs.reduce((a,b)=>a.size<=b.size?a:b).keys()].filter(id=>alive.has(id)&&cs.every(c=>c.has(id))):[...alive];
  const destroy=id=>{alive.delete(id);for(const c of stores.values())c.delete(id)};
  return {component,entity,add,remove,has,query,destroy,alive,stores};
}
const ecs=createWorld();
const C={
  Presence:ecs.component('Presence'),
  Transform:ecs.component('Transform'),
  RenderObject:ecs.component('RenderObject'),
  Selectable:ecs.component('Selectable'),
  Foregroundable:ecs.component('Foregroundable'),
  Foregrounded:ecs.component('Foregrounded'),
  RingSlot:ecs.component('RingSlot'),
  ObserverReturn:ecs.component('ObserverReturn'),
  LabIdentity:ecs.component('LabIdentity'),
  Destination:ecs.component('Destination'),
  ExchangeIdentity:ecs.component('ExchangeIdentity'),
  DescentIdentity:ecs.component('DescentIdentity')
};

const presenceMat=new THREE.MeshStandardMaterial({color:0xf0f0ed,roughness:.68,metalness:.04});
const PRESENCES=[
  {lab:{slug:'Foundry',name:'Foundry',url:'https://bonoj.github.io/Foundry/',github:'https://github.com/bonoj/Foundry'}},
  {lab:{slug:'SixCities',name:'Six Cities',url:'https://bonoj.github.io/SixCities/',github:'https://github.com/bonoj/SixCities'}},
  {lab:{slug:'VerticalAccretion',name:'Vertical Accretion',url:'https://bonoj.github.io/VerticalAccretion/',github:'https://github.com/bonoj/VerticalAccretion'}},
  {lab:{slug:'OrbitalConstruction',name:'Orbital Construction',url:'https://bonoj.github.io/OrbitalConstruction/',github:'https://github.com/bonoj/OrbitalConstruction'}},
  {lab:null}
];

const presenceEntities=PRESENCES.map((entry,slot)=>{
  const id=ecs.entity(), g=new THREE.Group();
  const sphere=new THREE.Mesh(new THREE.SphereGeometry(.58,28,18),presenceMat);
  sphere.castShadow=true;sphere.receiveShadow=false;g.add(sphere);
  const hitShell=new THREE.Mesh(new THREE.SphereGeometry(1.08,16,10),new THREE.MeshBasicMaterial({visible:false}));
  g.add(hitShell);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.72,.018,8,48),
    new THREE.MeshBasicMaterial({color:0x66727c,transparent:true,opacity:.58}));
  ring.rotation.x=Math.PI/2;ring.position.y=-.62;g.add(ring);scene.add(g);

  ecs.add(id,C.Presence,{slot});
  if(entry.lab){
    ecs.add(id,C.LabIdentity,{slug:entry.lab.slug,name:entry.lab.name,github:entry.lab.github});
    ecs.add(id,C.Destination,{url:entry.lab.url});
    if(entry.lab.slug==='VerticalAccretion') ecs.add(id,C.DescentIdentity,{
      seed:741, stepMs:1450, torchEvery:3, maxSteps:18
    });
    if(entry.lab.slug==='SixCities') ecs.add(id,C.ExchangeIdentity,{
      nodeCount:6,
      seed:741,
      minPause:520,
      maxPause:1650,
      packetDuration:[720,1180],
      maxActive:3
    });
  }
  ecs.add(id,C.Transform,{
    position:new THREE.Vector3(),
    rotation:new THREE.Euler(),
    scale:new THREE.Vector3(1,1,1)
  });
  ecs.add(id,C.RenderObject,{object:g,pickables:[sphere,hitShell,ring]});
  ecs.add(id,C.Selectable,{enabled:true});
  ecs.add(id,C.Foregroundable,{enabled:true});
  for(const o of [sphere,hitShell,ring])o.userData.entityId=id; // routing only
  return id;
});
// GENERIC EXCHANGE IDENTITY — physical surface apparatus driven by component data.
const exchangeStates=new Map();
const nutMat=new THREE.MeshStandardMaterial({color:0xe0ad55,roughness:.36,metalness:.58});
const packetMats=[
  new THREE.MeshStandardMaterial({color:0x587b49,roughness:.34,metalness:.48}), // forest
  new THREE.MeshStandardMaterial({color:0xc89b4c,roughness:.34,metalness:.48}), // sand/gold
  new THREE.MeshStandardMaterial({color:0xd7d9d2,roughness:.38,metalness:.42}), // pale stone
  new THREE.MeshStandardMaterial({color:0x62aeb4,roughness:.30,metalness:.50})  // water
];
const nutGeo=new THREE.CylinderGeometry(.105,.105,.075,8);
const bearingGeo=new THREE.SphereGeometry(.055,12,8);
const domeGeo=new THREE.SphereGeometry(.088,16,8,0,Math.PI*2,0,Math.PI/2);
const domeMat=new THREE.MeshPhysicalMaterial({
  color:0xbfe8f2,
  roughness:.14,
  metalness:0,
  transparent:true,
  opacity:.32,
  transmission:.62,
  thickness:.028,
  ior:1.18,
  depthWrite:false,
  side:THREE.DoubleSide
});
const NODE_DIRS=[
  new THREE.Vector3(1,0,0),new THREE.Vector3(-1,0,0),
  new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,-1),
  new THREE.Vector3(0,1,0),new THREE.Vector3(0,-1,0)
];
function seeded(seed){
  let x=seed>>>0;
  return ()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296};
}
function buildExchangeIdentity(id,data){
  const root=C.RenderObject.get(id).object;
  const apparatus=new THREE.Group();root.add(apparatus);
  const nodes=[];
  for(const dir of NODE_DIRS.slice(0,data.nodeCount)){
    const nut=new THREE.Mesh(nutGeo,nutMat);
    nut.position.copy(dir).multiplyScalar(.605);
    nut.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
    nut.castShadow=true;nut.receiveShadow=true;
    apparatus.add(nut);nodes.push(nut);

    const dome=new THREE.Mesh(domeGeo,domeMat);
    dome.position.copy(dir).multiplyScalar(0.6365);
    dome.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
    dome.castShadow=true;dome.receiveShadow=true;
    apparatus.add(dome);
  }
  exchangeStates.set(id,{apparatus,nodes,active:[],routes:[],rng:seeded(data.seed),nextAt:performance.now()+650});
}
function arcPoint(a,b,t,out){
  // Spherical interpolation, then a small physical lift above the neutral shell.
  const omega=Math.acos(THREE.MathUtils.clamp(a.dot(b),-1,1));
  if(omega>Math.PI-.001){
    const axis=Math.abs(a.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
    const mid=new THREE.Vector3().crossVectors(a,axis).normalize();
    if(t<.5)return arcPoint(a,mid,t*2,out);
    return arcPoint(mid,b,(t-.5)*2,out);
  }
  const so=Math.sin(omega);
  out.copy(a).multiplyScalar(Math.sin((1-t)*omega)/so)
     .addScaledVector(b,Math.sin(t*omega)/so)
     .normalize().multiplyScalar(.70 + Math.sin(Math.PI*t)*.055);
  return out;
}
function routeSamples(a,b){
  const pts=[];for(let i=0;i<=12;i++)pts.push(arcPoint(a,b,i/12,new THREE.Vector3()));
  return pts;
}
function routesCross(A,B){
  // Physical clearance test on sampled raised arcs. Shared endpoints are allowed.
  if(A.a===B.a||A.a===B.b||A.b===B.a||A.b===B.b)return false;
  for(const p of A.samples)for(const q of B.samples)if(p.distanceToSquared(q)<.0085)return true;
  return false;
}
function scheduleNext(state,data,now){
  state.nextAt=now+data.minPause+(data.maxPause-data.minPause)*state.rng();
}
function tryLaunchExchange(id,now){
  const data=C.ExchangeIdentity.get(id),state=exchangeStates.get(id);
  if(!data||!state||state.active.length>=data.maxActive)return scheduleNext(state,data,now);
  const candidates=[];
  for(let a=0;a<data.nodeCount;a++)for(let b=0;b<data.nodeCount;b++)if(a!==b){
    const route={a,b,samples:routeSamples(NODE_DIRS[a],NODE_DIRS[b])};
    if(!state.routes.some(r=>routesCross(route,r)))candidates.push(route);
  }
  if(!candidates.length)return scheduleNext(state,data,now);
  const route=candidates[Math.floor(state.rng()*candidates.length)];
  const mat=packetMats[Math.floor(state.rng()*packetMats.length)];
  const packet=new THREE.Group();
  const scales=[.30,.40,.54,.40,.30]; // teeny -> tiny -> small -> tiny -> teeny
  const bearings=scales.map(scale=>{
    const b=new THREE.Mesh(bearingGeo,mat);
    b.scale.setScalar(scale);b.castShadow=true;b.receiveShadow=true;b.visible=false;
    packet.add(b);return b;
  });
  state.apparatus.add(packet);
  const duration=data.packetDuration[0]+(data.packetDuration[1]-data.packetDuration[0])*state.rng();
  const stagger=duration*.105;
  state.routes.push(route);state.active.push({packet,bearings,route,started:now,duration,stagger});
  scheduleNext(state,data,now);
}
function ExchangeSystem(now){
  let moving=false;
  for(const id of ecs.query(C.ExchangeIdentity,C.RenderObject)){
    const data=C.ExchangeIdentity.get(id),state=exchangeStates.get(id);
    if(!state)continue;
    if(now>=state.nextAt)tryLaunchExchange(id,now);
    for(let i=state.active.length-1;i>=0;i--){
      const p=state.active[i];
      let anyVisible=false,allArrived=true;
      for(let j=0;j<p.bearings.length;j++){
        const elapsed=now-(p.started+j*p.stagger);
        const bt=elapsed/p.duration;
        const b=p.bearings[j];
        if(bt<0){
          b.visible=false;allArrived=false;continue;
        }
        if(bt>=1){
          b.visible=false;continue;
        }
        allArrived=false;anyVisible=true;b.visible=true;
        arcPoint(NODE_DIRS[p.route.a],NODE_DIRS[p.route.b],bt,b.position);
        b.rotation.x+=.08;b.rotation.z+=.055;
      }
      moving=moving||anyVisible;
      if(allArrived){
        state.apparatus.remove(p.packet);
        state.routes.splice(state.routes.indexOf(p.route),1);
        state.active.splice(i,1);
      }
    }
    if(state.active.length||now>=state.nextAt-34)window.vestibuleDirty=true;
  }
  return moving;
}
for(const id of ecs.query(C.ExchangeIdentity,C.RenderObject)){
  buildExchangeIdentity(id,C.ExchangeIdentity.get(id));
}


/* VERTICAL ACCRETION IDENTITY — a white substrate carrying irreversible evidence of descent. */
const descentStates=new Map();
const trenchMat=new THREE.MeshStandardMaterial({color:0x292724,roughness:.96,metalness:0});
const workerMat=new THREE.MeshStandardMaterial({color:0x555a5c,roughness:.62,metalness:.22});
const helmetMat=new THREE.MeshStandardMaterial({color:0xc99843,roughness:.52,metalness:.18});
const torchMat=new THREE.MeshStandardMaterial({color:0x4b4035,roughness:.9});
const flameMat=new THREE.MeshBasicMaterial({color:0xffb34d});

function descentPoint(i,max){
  const t=i/max;
  const lat=THREE.MathUtils.lerp(.82,-.72,t);
  const lon=-.42+t*Math.PI*2.15;
  const r=.586;
  const c=Math.cos(lat);
  return new THREE.Vector3(r*c*Math.sin(lon),r*Math.sin(lat),r*c*Math.cos(lon));
}
function orientRadial(o,p){
  o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),p.clone().normalize());
}
function addTrenchSegment(state,a,b){
  const mid=a.clone().add(b).multiplyScalar(.5).normalize().multiplyScalar(.592);
  const curve=new THREE.QuadraticBezierCurve3(a,mid,b);
  const trench=new THREE.Mesh(new THREE.TubeGeometry(curve,5,.043,7,false),trenchMat);
  trench.castShadow=false;trench.receiveShadow=true;state.apparatus.add(trench);
}
function addTorch(state,p){
  const radial=p.clone().normalize(), root=radial.clone().multiplyScalar(.61);
  const torch=new THREE.Group();
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.009,.012,.105,6),torchMat);
  stem.position.y=.045;torch.add(stem);
  const flame=new THREE.Mesh(new THREE.SphereGeometry(.024,8,6),flameMat);
  flame.scale.set(.72,1.25,.72);flame.position.y=.112;torch.add(flame);
  torch.position.copy(root);orientRadial(torch,root);
  state.apparatus.add(torch);
  const light=new THREE.PointLight(0xffa33d,.24,.72,2);
  light.position.copy(radial.clone().multiplyScalar(.73));state.apparatus.add(light);
}
function buildDescentIdentity(id,data){
  const ro=C.RenderObject.get(id);if(!ro)return;
  const apparatus=new THREE.Group();ro.object.add(apparatus);
  const worker=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.035,.075,3,6),workerMat);
  body.position.y=.045;body.castShadow=true;worker.add(body);
  const helmet=new THREE.Mesh(new THREE.SphereGeometry(.045,10,6,0,Math.PI*2,0,Math.PI/2),helmetMat);
  helmet.position.y=.105;helmet.castShadow=true;worker.add(helmet);
  apparatus.add(worker);
  const p0=descentPoint(0,data.maxSteps);worker.position.copy(p0);orientRadial(worker,p0);
  descentStates.set(id,{apparatus,worker,step:0,nextAt:performance.now()+900,last:p0.clone()});
}
function DescentSystem(now){
  let moving=false;
  for(const id of ecs.query(C.DescentIdentity,C.RenderObject)){
    const data=C.DescentIdentity.get(id),st=descentStates.get(id);if(!st)continue;
    if(st.step>=data.maxSteps)continue;
    if(now<st.nextAt)continue;
    const nextStep=st.step+1;
    const p=descentPoint(nextStep,data.maxSteps);
    addTrenchSegment(st,st.last,p);
    st.worker.position.copy(p);orientRadial(st.worker,p);
    if(nextStep%data.torchEvery===0)addTorch(st,p);
    st.last.copy(p);st.step=nextStep;st.nextAt=now+data.stepMs;
    window.vestibuleDirty=true;moving=true;
  }
  return moving;
}
for(const id of ecs.query(C.DescentIdentity,C.RenderObject))buildDescentIdentity(id,C.DescentIdentity.get(id));

const presences=presenceEntities.map(id=>C.RenderObject.get(id).object);

const P=(x,y,z)=>[x,y,z];
const RING={
  wide:[P(4.460,5.6,4.307),P(5.465,5.6,-2.924),P(-1.062,5.6,-6.099),P(-6.132,5.6,-0.847),P(-2.731,5.6,5.564)],
  tall:[P(3.885,5.6,3.751),P(4.278,5.6,-2.055),P(-1.218,5.6,-5.000),P(-5.040,5.6,-1.043),P(-1.904,5.6,4.348)]
};
const target=new THREE.Vector3(0,1,0);
let radius=14,theta=.18,phi=1.18;
let lastPortrait=innerHeight>innerWidth*1.12;
let selectedEntity=null;updateLabLabel();
let presenceMotion=null;
const raycaster=new THREE.Raycaster();
const pointerNDC=new THREE.Vector2();
const tapStarts=new Map();
window.vestibuleDirty=true;

function profile(){ return innerHeight>innerWidth*1.12?'tall':'wide'; }
function applyRing({preserveCamera=true}={}){
  presenceMotion=null;
  if(selectedEntity){
    ecs.remove(selectedEntity,C.Foregrounded);
    ecs.remove(selectedEntity,C.ObserverReturn);
  }
  selectedEntity=null;updateLabLabel();
  const pts=RING[profile()];
  for(const id of ecs.query(C.Presence,C.Transform)){
    const p=new THREE.Vector3(...pts[C.Presence.get(id).slot]);
    C.RingSlot.set(id,{position:p.clone()});
    C.Transform.get(id).position.copy(p);
  }
  RenderSyncSystem.sync();
  document.getElementById('counter').textContent=`RING\n${profile()==='tall'?'PORTRAIT':'LANDSCAPE'}`;
  if(!preserveCamera) home();
  window.vestibuleDirty=true;
}
function home(){
  presenceMotion=null;entryMotion=null;
  if(selectedEntity){
    const slot=C.RingSlot.get(selectedEntity);
    if(slot)C.Transform.get(selectedEntity).position.copy(slot.position);
    ecs.remove(selectedEntity,C.Foregrounded);ecs.remove(selectedEntity,C.ObserverReturn);
  }
  selectedEntity=null;updateLabLabel();
  const pts=RING[profile()];
  const box=new THREE.Box3();
  pts.forEach(p=>box.expandByPoint(new THREE.Vector3(...p)));
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  target.copy(center);
  const vertical=Math.max(size.y+3,size.z*.42+4);
  const horizontal=size.x+4;
  const fov=THREE.MathUtils.degToRad(camera.fov);
  const aspect=camera.aspect;
  const needV=(vertical*.5)/Math.tan(fov*.5);
  const needH=(horizontal*.5)/(Math.tan(fov*.5)*aspect);
  radius=Math.max(8,needV,needH)*1.25;
  theta=.16;phi=1.16;
  RenderSyncSystem.sync();applyCamera();
}

function applyCamera(){
  phi=THREE.MathUtils.clamp(phi,.12,Math.PI-.12);
  radius=Math.max(.75,radius);
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta)
  );
  // The dome is physical navigation grammar: neither camera nor panned target may
  // escape its usable interior. Preserve a margin so the boundary is approached,
  // never intersected.
  // Dome boundary: clamp travel along the current viewing ray so reaching the
  // boundary cannot rotate the camera. Continued pinch-out at the boundary is
  // therefore a spatial no-op rather than an angle change.
  const worldLen=camera.position.length();
  if(worldLen>CAMERA_BOUNDARY){
    const k=CAMERA_BOUNDARY/worldLen;
    camera.position.multiplyScalar(k);
    const off=camera.position.clone().sub(target);
    radius=off.length();
    phi=Math.acos(THREE.MathUtils.clamp(off.y/radius,-1,1));
    theta=Math.atan2(off.x,off.z);
  }
  camera.position.y=Math.max(GROUND_Y+.18,camera.position.y);
  const targetHorizontal=Math.hypot(target.x,target.z);
  if(targetHorizontal>CAMERA_BOUNDARY*.72){
    const k=CAMERA_BOUNDARY*.72/targetHorizontal;target.x*=k;target.z*=k;
  }
  camera.lookAt(target);
  window.vestibuleDirty=true;
}

const canvas=renderer.domElement, pointers=new Map();
let pinch=null,pinchCentroid=null;
const centroid=a=>({x:a.reduce((s,p)=>s+p.x,0)/a.length,y:a.reduce((s,p)=>s+p.y,0)/a.length});
function panPixels(dx,dy,gain=.8){
  const scale=radius*gain/innerHeight;
  target.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),-dx*scale);
  target.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1),dy*scale);
}
function clearPointer(id){pointers.delete(id);tapStarts.delete(id);if(pointers.size<2){pinch=null;pinchCentroid=null}}

function easeQuiet(t){
  // Cubic ease-in-out: decisive departure, readable middle, quiet arrival.
  return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
}
function ringSlotPosition(id){return C.RingSlot.get(id).position.clone()}
function presentationPosition(){
  const forward=new THREE.Vector3();camera.getWorldDirection(forward);
  const up=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1).normalize();
  return camera.position.clone().addScaledVector(forward,8.5).addScaledVector(up,.35);
}

const RenderSyncSystem={
  sync(){
    for(const id of ecs.query(C.Transform,C.RenderObject)){
      const t=C.Transform.get(id),o=C.RenderObject.get(id).object;
      o.position.copy(t.position);
      o.rotation.copy(t.rotation);
      o.scale.copy(t.scale);
    }
  }
};

const ForegroundSystem={
  begin(id,toForeground){
    if(!ecs.has(id,C.Foregroundable)||presenceMotion)return;
    const pos=C.Transform.get(id).position,from=pos.clone();
    const to=toForeground?presentationPosition():ringSlotPosition(id);
    if(toForeground){
      ecs.add(id,C.ObserverReturn,{cameraPosition:camera.position.clone(),target:target.clone(),radius,theta,phi});
      ecs.add(id,C.Foregrounded,true);selectedEntity=id;
      PreconnectSystem.begin(id);
      setLabActions(id);
    }
    const saved=C.ObserverReturn.get(id);
    presenceMotion={
      id,from,to,toForeground,fromTarget:target.clone(),
      toTarget:toForeground?to.clone():(saved?saved.target.clone():target.clone()),
      fromCameraPosition:camera.position.clone(),
      toCameraPosition:(!toForeground&&saved)?saved.cameraPosition.clone():camera.position.clone(),
      started:performance.now(),duration:THREE.MathUtils.clamp(390+from.distanceTo(to)*22,430,610)
    };
    window.vestibuleDirty=true;
  },
  dismiss(){
    if(selectedEntity&&!presenceMotion){
      setLabActions(null);
      this.begin(selectedEntity,false);
    }
  }
};


let entryMotion=null;

function selectedLabName(){
  return selectedEntity?C.LabIdentity.get(selectedEntity)?.name:null;
}

function setLabActions(id){
  const lab=id?C.LabIdentity.get(id):null;
  const destination=id?C.Destination.get(id):null;
  const visible=!!(lab&&destination);
  labActionsEl.classList.toggle('visible',visible);
  labActionsEl.setAttribute('aria-hidden',visible?'false':'true');
}
function updateLabLabel(){
  const name=selectedLabName();
  labNameEl.textContent=name||'';
  labNameEl.style.opacity=name?'1':'0';
}
enterLabEl.addEventListener('click',e=>{
  e.stopPropagation();
  if(selectedEntity&&ecs.has(selectedEntity,C.Destination))beginEntry(selectedEntity);
});
githubLabEl.addEventListener('click',e=>{
  e.stopPropagation();
  const url=selectedEntity?C.LabIdentity.get(selectedEntity)?.github:null;
  if(url){
    captureReturnState(selectedEntity);
    window.location.href=url;
  }
});

const preconnectedOrigins=new Set();
const PreconnectSystem={
  begin(id){
    const d=C.Destination.get(id);
    if(!d)return;
    const origin=new URL(d.url).origin;
    if(preconnectedOrigins.has(origin))return;
    const link=document.createElement('link');
    link.rel='preconnect';link.href=origin;link.crossOrigin='anonymous';
    document.head.appendChild(link);preconnectedOrigins.add(origin);
  }
};

const VESTIBULE_RETURN_KEY='worldLab.vestibule.return.v1';

function captureReturnState(id){
  if(!id||!ecs.has(id,C.Foregrounded))return;
  const presence=C.Presence.get(id);
  const transform=C.Transform.get(id);
  const saved=C.ObserverReturn.get(id);
  if(!presence||!transform)return;
  const payload={
    slot:presence.slot,
    position:transform.position.toArray(),
    cameraPosition:camera.position.toArray(),
    target:target.toArray(),
    radius,theta,phi,
    observerReturn:saved?{
      cameraPosition:saved.cameraPosition.toArray(),
      target:saved.target.toArray(),
      radius:saved.radius,theta:saved.theta,phi:saved.phi
    }:null
  };
  try{sessionStorage.setItem(VESTIBULE_RETURN_KEY,JSON.stringify(payload))}
  catch(e){console.warn('Vestibule return state unavailable',e)}
}

function restoreReturnState(){
  let raw=null;
  try{
    raw=sessionStorage.getItem(VESTIBULE_RETURN_KEY);
    if(raw)sessionStorage.removeItem(VESTIBULE_RETURN_KEY); // one return, not a new default
  }catch(e){console.warn('Vestibule return state unavailable',e)}
  if(!raw)return false;
  try{
    const state=JSON.parse(raw);
    const id=presenceEntities.find(id=>C.Presence.get(id).slot===state.slot);
    if(!id||!ecs.has(id,C.LabIdentity)||!ecs.has(id,C.Destination))return false;

    const transform=C.Transform.get(id);
    transform.position.fromArray(state.position);
    RenderSyncSystem.sync();

    camera.position.fromArray(state.cameraPosition);
    target.fromArray(state.target);
    radius=state.radius;theta=state.theta;phi=state.phi;
    camera.lookAt(target);

    ecs.add(id,C.Foregrounded,true);
    selectedEntity=id;
    if(state.observerReturn){
      ecs.add(id,C.ObserverReturn,{
        cameraPosition:new THREE.Vector3().fromArray(state.observerReturn.cameraPosition),
        target:new THREE.Vector3().fromArray(state.observerReturn.target),
        radius:state.observerReturn.radius,
        theta:state.observerReturn.theta,
        phi:state.observerReturn.phi
      });
    }else{
      // Defensive fallback: dismissal still has a valid ring/home transaction.
      ecs.add(id,C.ObserverReturn,{
        cameraPosition:HOME.camera.clone(),target:HOME.target.clone(),
        radius:HOME.radius,theta:HOME.theta,phi:HOME.phi
      });
    }
    updateLabLabel();
    setLabActions(id);
    PreconnectSystem.begin(id);
    window.vestibuleDirty=true;
    return true;
  }catch(e){
    console.warn('Vestibule return restore failed',e);
    return false;
  }
}

function finishEntry(id){
  const destination=C.Destination.get(id)?.url;
  if(destination) location.href=destination;
}

function beginEntry(id){
  if(entryMotion||presenceMotion||!ecs.has(id,C.Destination))return;
  // Return continuity belongs to the stable inspection pose, not the terminal
  // Camera Commit pose. Snapshot before entry starts moving the observer.
  captureReturnState(id);
  const t=C.Transform.get(id);
  const distance=camera.position.distanceTo(t.position);
  entryMotion={
    id,started:performance.now(),duration:520,
    fromCamera:camera.position.clone(),fromTarget:target.clone(),
    distance
  };
  window.vestibuleDirty=true;
}
const SelectionSystem={
  pick(x,y){
    const r=canvas.getBoundingClientRect();
    pointerNDC.set(((x-r.left)/r.width)*2-1,-((y-r.top)/r.height)*2+1);
    raycaster.setFromCamera(pointerNDC,camera);
    const pickables=[];
    for(const id of ecs.query(C.Selectable,C.RenderObject))
      if(C.Selectable.get(id).enabled)pickables.push(...C.RenderObject.get(id).pickables);
    for(const hit of raycaster.intersectObjects(pickables,false)){
      const id=hit.object.userData.entityId;
      if(id&&ecs.has(id,C.Selectable))return id;
    }
    return null;
  },
  tap(x,y){
    const hit=this.pick(x,y);
    if(selectedEntity){
      if(hit===selectedEntity)return;
      ForegroundSystem.dismiss();return
    }
    if(hit&&!presenceMotion)ForegroundSystem.begin(hit,true);
  }
};
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  tapStarts.set(e.pointerId,{x:e.clientX,y:e.clientY,t:performance.now()});
  if(pointers.size===2){const a=[...pointers.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchCentroid=centroid(a)}
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const a=[...pointers.values()];
  if(a.length===1){
    if(e.shiftKey||e.buttons===2)panPixels(e.clientX-old.x,e.clientY-old.y);
    else{theta-=(e.clientX-old.x)*.006;phi-=(e.clientY-old.y)*.006}
    applyCamera();
  }else if(a.length===2){
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),c=centroid(a);
    if(pinch&&d>0)radius*=pinch/d;
    if(pinchCentroid)panPixels(c.x-pinchCentroid.x,c.y-pinchCentroid.y,.42);
    pinch=d;pinchCentroid=c;applyCamera();
  }
});
canvas.addEventListener('pointerup',e=>{
  const start=tapStarts.get(e.pointerId);
  if(start){
    const travel=Math.hypot(e.clientX-start.x,e.clientY-start.y);
    const elapsed=performance.now()-start.t;
    if(travel<10 && elapsed<420 && pointers.size===1) SelectionSystem.tap(e.clientX,e.clientY);
  }
  clearPointer(e.pointerId);
});
canvas.addEventListener('pointercancel',e=>clearPointer(e.pointerId));
canvas.addEventListener('lostpointercapture',e=>clearPointer(e.pointerId));
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();radius*=Math.exp(e.deltaY*.001);applyCamera()},{passive:false});

addEventListener('keydown',e=>{if(e.key==='Home')home()});
addEventListener('resize',()=>{
  const wasPortrait=lastPortrait;
  lastPortrait=innerHeight>innerWidth*1.12;
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  applyRing({preserveCamera:true});
  if(wasPortrait!==lastPortrait) home();
  window.vestibuleDirty=true;
});

renderer.setAnimationLoop((now)=>{
  ExchangeSystem(now);
  DescentSystem(now);
  if(entryMotion){
    const m=entryMotion,raw=Math.min(1,(now-m.started)/m.duration),t=easeQuiet(raw);
    const tr=C.Transform.get(m.id);
    const toward=tr.position.clone().sub(m.fromCamera).normalize();
    camera.position.copy(m.fromCamera).addScaledVector(toward,m.distance*.92*t);
    const len=camera.position.length();
    if(len>CAMERA_BOUNDARY)camera.position.multiplyScalar(CAMERA_BOUNDARY/len);
    camera.position.y=Math.max(GROUND_Y+.18,camera.position.y);
    target.copy(tr.position);camera.lookAt(target);
    window.vestibuleDirty=true;
    if(raw>=1)finishEntry(m.id);
  }
  if(presenceMotion){
    const m=presenceMotion,raw=Math.min(1,(now-m.started)/m.duration),t=easeQuiet(raw);
    const transform=C.Transform.get(m.id);
    transform.position.lerpVectors(m.from,m.to,t);
    RenderSyncSystem.sync();
    camera.position.lerpVectors(m.fromCameraPosition,m.toCameraPosition,t);
    target.lerpVectors(m.fromTarget,m.toTarget,t);camera.lookAt(target);
    window.vestibuleDirty=true;
    if(raw>=1){
      transform.position.copy(m.to);RenderSyncSystem.sync();
      target.copy(m.toTarget);camera.lookAt(target);
      if(!m.toForeground){
        const saved=C.ObserverReturn.get(m.id);
        if(saved){
          camera.position.copy(saved.cameraPosition);target.copy(saved.target);
          radius=saved.radius;theta=saved.theta;phi=saved.phi;camera.lookAt(target);
        }
        ecs.remove(m.id,C.Foregrounded);ecs.remove(m.id,C.ObserverReturn);selectedEntity=null;updateLabLabel();
      }else{
        target.copy(transform.position);
        const off=camera.position.clone().sub(target);radius=off.length();
        phi=Math.acos(THREE.MathUtils.clamp(off.y/radius,-1,1));theta=Math.atan2(off.x,off.z);
        camera.lookAt(target);updateLabLabel();setLabActions(m.id);
      }
      presenceMotion=null;
    }
  }
  if(window.vestibuleDirty!==false){renderer.render(scene,camera);window.vestibuleDirty=false}
});


addEventListener('pageshow',e=>{
  if(e.persisted){
    try{sessionStorage.removeItem(VESTIBULE_RETURN_KEY)}catch(_){}
    updateLabLabel();
    setLabActions(selectedEntity);
    window.vestibuleDirty=true;
    return;
  }
  restoreReturnState();
});

window.vestibule={
  scene,camera,renderer,presences,
  get layout(){return 'Ring'},
  get selected(){return selectedEntity?C.Presence.get(selectedEntity).slot:null},
  home,
  select:i=>{const id=presenceEntities.find(id=>C.Presence.get(id).slot===i);if(id&&!selectedEntity&&!presenceMotion)ForegroundSystem.begin(id,true)},
  dismiss:()=>ForegroundSystem.dismiss(),
  enter:()=>{if(selectedEntity&&ecs.has(selectedEntity,C.Destination))beginEntry(selectedEntity)},
  ecs:{world:ecs,components:C,systems:{SelectionSystem,ForegroundSystem,RenderSyncSystem}},
  invalidate:()=>window.vestibuleDirty=true,
  inspect:()=>({
    ready:!!window.vestibuleReady,
    layout:'Ring',
    profile:profile(),
    selected:selectedEntity?C.Presence.get(selectedEntity).slot:null,
    positions:presenceEntities.map(id=>C.Transform.get(id).position.toArray()),
    camera:{position:camera.position.toArray(),target:target.toArray(),radius,theta,phi},
    rules:{worldRadius:WORLD_RADIUS,cameraBoundary:CAMERA_BOUNDARY,orientationChangeReframes:true,pixelRatioCap:1.5}
  })
};

applyRing({preserveCamera:true});
home();
window.vestibuleReady=true;
clearTimeout(window.vestibuleWatch);
window.vestibuleDirty=true;
</script>
</body>
